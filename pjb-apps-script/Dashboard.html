<title>Dashboard PJB Jumantik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
/* ============================================================ tokens
   Single-theme terang: latar putih standar diminta eksplisit, jadi tema
   gelap sistem sengaja tidak diikuti. Semua warna dicat eksplisit supaya
   halaman tetap benar di atas ground milik host. */
:root {
  color-scheme: light;
  --ground:   #ffffff;
  --panel:    #ffffff;
  --panel-2:  #f7f9fc;   /* netral berbias biru dingin, bukan abu-abu netral */
  --line:     #e4e8ef;
  --line-2:   #eef1f6;
  --ink:      #10151f;
  --ink-2:    #4a5468;
  --muted:    #8892a4;
  --accent:   #2a78d6;
  --accent-2: #cde2fb;
  --pole-low: #d03b3b;
  --good:     #0ca30c;
  --warn:     #b57500;
  --warn-bg:  #fff6e0;
  --bad-bg:   #fdecec;
  --ok-bg:    #e9f7e9;
  --chip:     #f1f4f9;
  --focus:    #2a78d6;

  --r: 7px;
}

* { box-sizing: border-box; }
/* Beberapa elemen di bawah punya "display" sendiri (mis. .loading-screen
   pakai flex) dengan spesifisitas yang sama dengan aturan bawaan browser
   untuk [hidden] — tanpa baris ini, urutan CSS membuat elemen "hidden"
   tetap ikut ditata dan terlihat. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 10.6px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 3.5px; }

/* ============================================================ shell */
.cockpit {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) minmax(0, 1fr);
  gap: 7px;
  padding: 8.8px 10.6px 10.6px;
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10.6px; }
.brand { display: flex; align-items: baseline; gap: 8.8px; min-width: 0; }
.brand h1 {
  margin: 0; font-size: 14.1px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap;
}
.brand .scope { font-size: 9.7px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .right { display: flex; align-items: center; gap: 7px; font-size: 9.7px; color: var(--muted); white-space: nowrap; }

/* ============================================================ filters */
.filters {
  display: flex; align-items: center; gap: 5.3px; flex-wrap: wrap;
  padding: 5.3px 7px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--r);
}
.eyebrow {
  font-size: 8.4px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
}
.seg { display: flex; gap: 2.6px; }
.seg button {
  font: inherit; font-size: 9.7px; font-weight: 600;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  padding: 3.5px 7.9px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.seg button:hover { background: var(--chip); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.ctrl {
  font: inherit; font-size: 9.7px; font-weight: 500;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 3.5px 7px; border-radius: 5.3px; height: 22.9px; cursor: pointer;
}
select.ctrl { padding-right: 3.5px; }
.sep { width: 1px; height: 15.8px; background: var(--line); margin: 0 2px; }
.count { margin-left: auto; font-size: 9.7px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* dropdown multi-pilih */
.ms { position: relative; }
.ms > button { display: inline-flex; align-items: center; gap: 5.3px; }
.ms .tag {
  background: var(--chip); border-radius: 999px; padding: 0 5.3px;
  font-size: 8.8px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.ms-pop {
  position: absolute; top: calc(100% + 3.5px); left: 0; z-index: 50;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 8.8px 26.4px rgba(16,21,31,.13); padding: 5.3px;
  width: 184.8px; max-height: 228.8px; overflow: auto;
}
.ms-pop[hidden] { display: none; }
.ms-pop .row { display: flex; gap: 5.3px; padding-bottom: 5.3px; border-bottom: 1px solid var(--line-2); margin-bottom: 3.5px; }
.ms-pop .row button {
  flex: 1; font: inherit; font-size: 9.2px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); border-radius: 4.4px; padding: 2.6px; color: var(--ink-2);
}
.opt { display: flex; align-items: center; gap: 6.2px; padding: 3.5px 5.3px; border-radius: 4.4px; cursor: pointer; font-size: 10.1px; }
.opt:hover { background: var(--chip); }
.opt input { accent-color: var(--accent); width: 11.4px; height: 11.4px; cursor: pointer; }

/* ============================================================ KPI */
.kpis { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 7px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 6.2px 8.8px 7px; display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.kpi .k-label { font-size: 8.8px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.kpi .k-val {
  font-size: 19.4px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-top: 1px;
}
.kpi.hero .k-val { font-size: 26.4px; }
.kpi .k-foot { font-size: 8.8px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4.4px; flex-wrap: wrap; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2.6px; background: var(--accent); }
.kpi.is-good::before { background: var(--good); }
.kpi.is-bad::before  { background: var(--pole-low); }
.kpi.is-warn::before { background: var(--warn); }
.kpi.is-plain::before { background: var(--line); }

.meter { height: 3.5px; border-radius: 999px; background: var(--accent-2); margin-top: 5.3px; position: relative; overflow: visible; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.meter.bad i { background: var(--pole-low); }
.meter .tgt { position: absolute; top: -2.6px; bottom: -2.6px; width: 1.5px; background: var(--ink-2); opacity: .6; }

.pill {
  display: inline-flex; align-items: center; gap: 2.6px; font-size: 8.4px; font-weight: 700;
  padding: 1px 5.3px; border-radius: 999px; white-space: nowrap;
}
.pill.ok   { background: var(--ok-bg);   color: var(--good); }
.pill.bad  { background: var(--bad-bg);  color: var(--pole-low); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

/* ============================================================ cards */
.band { display: grid; gap: 7px; min-height: 0; }
.band.a { grid-template-columns: 1fr 1fr 1.3fr 1.25fr; }
.band.b { grid-template-columns: 1fr .82fr .95fr 2.15fr; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.card > header {
  display: flex; align-items: center; justify-content: space-between; gap: 5.3px;
  padding: 6.2px 8.8px 5.3px; border-bottom: 1px solid var(--line-2); flex: none;
}
.card h2 { margin: 0; font-size: 10.1px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hint { font-size: 8.4px; color: var(--muted); font-weight: 500; }
.card .body { flex: 1; min-height: 0; overflow: auto; padding: 7px 8.8px 8.8px; }
.card .body.flush { padding: 0; }

.mini {
  font: inherit; font-size: 8.4px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  padding: 2px 6.2px; border-radius: 4.4px; cursor: pointer; flex: none;
}
.mini:hover { background: var(--chip); }
.mini[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

.hdr-actions { display: flex; align-items: center; gap: 5.3px; flex: none; }
.fs-btn { font-size: 9.7px; line-height: 1; padding: 2px 5.3px; }

/* ============================================================ layar penuh
   Kartu yang dibesarkan dipindah (bukan disalin) ke sini, jadi seluruh
   listener & fungsi render yang sudah ada terpakai lagi apa adanya — cukup
   panggil draw() setelah dipindah supaya chart mengukur ulang ruang barunya. */
.fs-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(16,21,31,.6); backdrop-filter: blur(1px);
  display: flex; align-items: center; justify-content: center; padding: 35.2px;
}
.fs-close {
  position: absolute; top: 14.1px; right: 14.1px; z-index: 301;
  font: inherit; font-size: 10.6px; font-weight: 700;
  background: var(--ink); color: #fff; border: none;
  padding: 6.2px 12.3px; border-radius: 999px; cursor: pointer;
}
.fs-close:hover { background: #000; }
#fsSlot { width: 100%; height: 100%; max-width: 1232px; }
.card.is-fullscreen { width: 100%; height: 100%; box-shadow: 0 21.1px 61.6px rgba(16,21,31,.4); }
.card.is-fullscreen h2 { font-size: 12.3px; }
.card.is-fullscreen .body { padding: 14.1px 17.6px 17.6px; }
.card.is-fullscreen .body.flush { padding: 0; }

.tabs { display: flex; gap: 2.6px; }
.tabs button {
  font: inherit; font-size: 8.8px; font-weight: 700; cursor: pointer;
  border: 1px solid transparent; background: none; color: var(--muted);
  padding: 2px 6.2px; border-radius: 4.4px;
}
.tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); }

/* ============================================================ charts */
.chart { display: block; width: 100%; }
.axis { font-size: 7.9px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.grid-line { stroke: var(--line-2); stroke-width: 1; }
.base-line { stroke: var(--line); stroke-width: 1; }
.tgt-line { stroke: var(--ink-2); stroke-width: 1; opacity: .45; }
.s-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.s-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.d-label { font-size: 8.8px; font-weight: 800; fill: var(--ink); }

/* baris bar */
.rows { display: flex; flex-direction: column; gap: 3.5px; }
.brow { display: grid; align-items: center; gap: 6.2px; }
.brow .nm { font-size: 9.2px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk { position: relative; height: 13.2px; }
.fil { position: absolute; top: 0; height: 100%; background: var(--accent); min-width: 2px; }
.fil.low { background: var(--pole-low); }
.mid { position: absolute; top: -1.8px; bottom: -1.8px; width: 1px; background: var(--ink-2); opacity: .4; }
.vl { font-size: 9.2px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 4.4px; }
.brow:hover .fil { filter: brightness(1.07); }

.axrow { display: grid; align-items: center; gap: 6.2px; margin-bottom: 4.4px; }
.axrow .sc { position: relative; height: 9.7px; }
.axrow span { position: absolute; top: 0; font-size: 7.9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.axrow .l { left: 0; } .axrow .c { left: 50%; transform: translateX(-50%); } .axrow .r { right: 0; }

.legend { display: flex; gap: 8.8px; margin-bottom: 5.3px; font-size: 8.4px; font-weight: 600; color: var(--ink-2); }
.legend i { width: 7.9px; height: 7.9px; border-radius: 2px; display: inline-block; margin-right: 3.5px; vertical-align: -0.9px; }

/* heatmap */
.hm table { border-collapse: separate; border-spacing: 2px; }
.hm th { font-size: 8.4px; font-weight: 700; color: var(--muted); padding: 2px 3.5px; white-space: nowrap; }
.hm thead th { position: sticky; top: 0; z-index: 3; background: var(--panel); }
.hm tbody th { position: sticky; left: 0; z-index: 2; background: var(--panel); text-align: left; }
.cell {
  min-width: 47.5px; height: 16.7px; border-radius: 2.6px; display: flex; align-items: center; justify-content: center;
  font-size: 8.4px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.cell.na { background: var(--chip); color: var(--muted); }
.scale { display: flex; align-items: center; gap: 4.4px; margin-top: 6.2px; font-size: 7.9px; color: var(--muted); font-weight: 600; }
.scale div { display: flex; gap: 1.5px; }
.scale i { width: 11.4px; height: 7px; border-radius: 1.5px; display: block; }

/* ============================================================ tabel */
table.dt { width: 100%; border-collapse: collapse; font-size: 9.2px; }
table.dt th {
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  text-align: left; font-size: 8.4px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); padding: 5.3px 7px; border-bottom: 1px solid var(--line);
  cursor: pointer; user-select: none; white-space: nowrap;
}
table.dt th:hover { color: var(--ink); }
table.dt th .ar { font-size: 7px; opacity: .35; margin-left: 2.6px; }
table.dt th[aria-sort] { color: var(--ink); }
table.dt th[aria-sort] .ar { opacity: 1; color: var(--accent); }
table.dt td { padding: 4.4px 7px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.dt td.n, table.dt th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.dt td a { color: var(--accent); font-weight: 600; text-decoration: none; }
table.dt td a:hover { text-decoration: underline; }
table.dt tbody tr:hover { background: var(--panel-2); }
table.dt td.ell { max-width: 132px; overflow: hidden; text-overflow: ellipsis; }

.empty { color: var(--muted); font-size: 9.7px; text-align: center; padding: 17.6px 0; font-weight: 500; }

/* pencarian */
.search-bar { padding: 7px 8.8px; border-bottom: 1px solid var(--line-2); flex: none; }
.search-bar input { width: 100%; }
.search-results { flex: 1; min-height: 0; overflow: auto; }
.search-tab-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.search-pager {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 7px;
  padding: 5.3px 8.8px; border-top: 1px solid var(--line-2); font-size: 8.8px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.search-pager .mini[disabled] { opacity: .4; cursor: default; }
.search-pager .mini[disabled]:hover { background: var(--panel); }

/* ============================================================ tooltip */
#tip {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .08s;
  background: var(--ink); color: #fff; border-radius: 5.3px; padding: 5.3px 7px;
  font-size: 9.2px; box-shadow: 0 7px 19.4px rgba(16,21,31,.22); max-width: 202.4px;
}
#tip.on { opacity: 1; }
#tip .tt { font-size: 8.4px; opacity: .65; font-weight: 600; margin-bottom: 2.6px; }
#tip .tr { display: flex; align-items: baseline; gap: 5.3px; }
#tip .tk { width: 8.8px; height: 2px; border-radius: 2px; flex: none; transform: translateY(-2.6px); }
#tip b { font-variant-numeric: tabular-nums; font-weight: 800; }
#tip span { opacity: .7; }

/* ============================================================ loading / error */
.loading-screen, .error-screen {
  height: 100dvh; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8.8px; color: var(--muted); font-size: 11.4px; font-weight: 600;
  text-align: center; padding: 17.6px;
}
.error-screen { color: var(--pole-low); }
.notice {
  background: var(--warn-bg); border: 1px solid var(--line); border-left: 2.6px solid var(--warn);
  border-radius: 5.3px; padding: 5.3px 8.8px; font-size: 9.2px; color: var(--ink-2); font-weight: 500;
}
.notice b { color: var(--ink); font-weight: 700; }

/* ============================================================ layar pendek/sempit
   Kalau tinggi layar tidak cukup untuk kokpit satu layar, halaman dibiarkan
   menggulir daripada memampatkan chart sampai tidak terbaca. */
@media (max-height: 620px), (max-width: 1180px) {
  html, body { height: auto; }
  .cockpit { height: auto; grid-template-rows: none; }
  .band.a, .band.b { grid-template-columns: 1fr 1fr; }
  .card { height: 281.6px; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 720px) {
  .band.a, .band.b { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="loading-screen" id="loadingScreen">Memuat data dari tab "Master Data"…</div>
<div class="error-screen" id="errorScreen" hidden></div>

<div class="cockpit" id="cockpit" hidden>

  <div class="topbar">
    <div class="brand">
      <h1>Dashboard PJB Jumantik</h1>
      <span class="scope" id="scopeLine">—</span>
    </div>
    <div class="right">
      <span id="stamp">—</span>
      <button class="mini" id="btnReload" type="button">Muat ulang</button>
    </div>
  </div>

  <div class="filters">
    <span class="eyebrow">Periode</span>
    <div class="seg" id="seg">
      <button type="button" data-p="all" aria-pressed="true">Semua</button>
      <button type="button" data-p="last">Bulan terakhir</button>
      <button type="button" data-p="30">30 hari</button>
      <button type="button" data-p="90">90 hari</button>
    </div>
    <input class="ctrl" type="date" id="dFrom" aria-label="Tanggal mulai">
    <input class="ctrl" type="date" id="dTo" aria-label="Tanggal akhir">
    <span class="sep"></span>
    <span id="msRw"></span>
    <span id="msRt"></span>
    <span id="msKader"></span>
    <span class="sep"></span>
    <select class="ctrl" id="fStat" aria-label="Status bangunan">
      <option value="all">Semua bangunan</option>
      <option value="pos">Positif jentik</option>
      <option value="neg">Bebas jentik</option>
    </select>
    <select class="ctrl" id="fAct" aria-label="Status tindakan">
      <option value="all">Semua tindakan</option>
      <option value="ada">Sudah ditindak</option>
      <option value="belum">Belum ditindak</option>
    </select>
    <button class="mini" id="btnReset" type="button">Reset</button>
    <span class="count" id="cnt"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="band a">
    <section class="card">
      <header>
        <h2>Tren ABJ <span class="hint">· target ≥ 95%</span></h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="abj">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="abj" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="abj"></div>
    </section>

    <section class="card">
      <header>
        <h2>Tren Container Index <span class="hint">· target &lt; 5%</span></h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="ci">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="ci" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="ci"></div>
    </section>

    <section class="card">
      <header>
        <h2>ABJ per RW</h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="rank">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="rank" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="rank"></div>
    </section>

    <section class="card">
      <header>
        <h2>ABJ per RW per bulan</h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="heat">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="heat" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="heat"></div>
    </section>
  </div>

  <div class="band b">
    <section class="card">
      <header>
        <h2>Jenis kontainer tercatat</h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="cont">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="cont" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="cont"></div>
    </section>

    <section class="card">
      <header>
        <h2>Kepatuhan tindakan</h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="act">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="act" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="act"></div>
    </section>

    <section class="card">
      <header>
        <h2>Volume pemeriksaan</h2>
        <div class="hdr-actions">
          <button class="mini" type="button" data-tv="day">Tabel</button>
          <button class="mini fs-btn" type="button" data-fs="day" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body" id="day"></div>
    </section>

    <section class="card">
      <header>
        <div class="tabs" id="tabs">
          <button type="button" data-t="follow" aria-selected="true">Tindak lanjut</button>
          <button type="button" data-t="kader" aria-selected="false">Kinerja kader</button>
          <button type="button" data-t="search" aria-selected="false">Cari rumah</button>
        </div>
        <div class="hdr-actions">
          <span class="hint" id="listHint"></span>
          <button class="mini fs-btn" type="button" data-fs="list" title="Perbesar" aria-label="Perbesar">⤢</button>
        </div>
      </header>
      <div class="body flush" id="list"></div>
    </section>
  </div>

</div>

<div id="fsOverlay" class="fs-overlay" hidden>
  <button id="fsCloseBtn" class="fs-close" type="button" aria-label="Tutup layar penuh">✕ Tutup</button>
  <div id="fsSlot"></div>
</div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
// ============================================================ state data
// Diisi dari getDashboardPayload() — lihat DashboardData.gs. Bentuk baris:
// [rwIdx, kaderIdx, rtIdx, bulan(1-12), tahun, tanggalISO, cDiperiksa, cPositif,
//  cNegatif, bangunanNegatif(1=bebas), tindakan3M, tindakanLarvasidasi,
//  kodeKontainer(array), namaPemilik, alamat, tanggalMentahAsli, statusFoto,
//  linkFoto, catatanKualitasData]
var DATA = null;
var RW = [], KADER = [], RT = [], CONT = {};
var ROWS = [];
var CURRENT_ROWS = [];

var I_RW=0, I_KD=1, I_RT=2, I_BLN=3, I_THN=4, I_DT=5, I_CD=6, I_CP=7, I_CN=8,
    I_NEG=9, I_3M=10, I_LV=11, I_CODE=12, I_NM=13, I_AL=14, I_DTASLI=15,
    I_FOTOST=16, I_FOTOLK=17, I_CATATAN=18;

var BLN = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var T_ABJ = 95, T_CI = 5;
var BLUE = ['#cde2fb','#9ec5f4','#6da7ec','#3987e5','#2a78d6','#256abf','#184f95'];
var RED  = ['#fbd9d9','#f4b3b3','#ec8c8c','#e26565','#d03b3b','#ab2f2f','#862424'];

// ============================================================ util
function nf(n,d){ return Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function pc(n){ return nf(n,1)+'%'; }
function E(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=String(x); return n; }
function S(t,a){ var n=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a) if(a[k]!=null) n.setAttribute(k,a[k]); return n; }
function clr(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function nice(min,max,ticks){
  var rg=(max-min)||1, raw=rg/ticks, mag=Math.pow(10,Math.floor(Math.log10(raw))), nm=raw/mag;
  var st=(nm<=1?1:nm<=2?2:nm<=5?5:10)*mag;
  return { min:Math.floor(min/st)*st, max:Math.ceil(max/st)*st, step:st };
}

var TIP = document.getElementById('tip');
function tip(title, lines, x, y){
  clr(TIP);
  TIP.appendChild(E('div','tt',title));
  lines.forEach(function(l){
    var row = E('div','tr');
    if (l.c){ var k=E('span','tk'); k.style.background=l.c; row.appendChild(k); }
    row.appendChild(E('b',null,l.v));
    if (l.n) row.appendChild(E('span',null,l.n));
    TIP.appendChild(row);
  });
  TIP.classList.add('on');
  var b = TIP.getBoundingClientRect();
  TIP.style.left = Math.max(6, Math.min(x+12, innerWidth-b.width-8))+'px';
  TIP.style.top  = Math.max(6, y-b.height-10)+'px';
}
function untip(){ TIP.classList.remove('on'); }
addEventListener('scroll', untip, true);

// ============================================================ boot
function boot(force){
  var loading = document.getElementById('loadingScreen');
  var errS = document.getElementById('errorScreen');
  errS.hidden = true;
  if (DATA) {
    // sudah pernah dimuat — tampilkan status "memuat ulang" tanpa menyembunyikan kokpit
    document.getElementById('stamp').textContent = 'Memuat ulang…';
  } else {
    loading.hidden = false;
  }
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .getDashboardPayload(!!force);
}
function onError(err){
  document.getElementById('loadingScreen').hidden = true;
  document.getElementById('cockpit').hidden = true;
  var es = document.getElementById('errorScreen');
  es.hidden = false;
  es.textContent = 'Gagal memuat data: ' + (err && err.message ? err.message : err);
}
function onData(payload){
  DATA = payload;
  RW = payload.rwList; KADER = payload.kaderList; RT = payload.rtList; CONT = payload.containerLabels;
  ROWS = payload.rows;

  document.getElementById('loadingScreen').hidden = true;
  document.getElementById('cockpit').hidden = false;

  buildFilters();
  stamp();
  draw();
}

function stamp(){
  document.getElementById('stamp').textContent = 'Diperbarui ' + (DATA.generatedAt || '—');
  var months = {};
  ROWS.forEach(function(r){ if (r[I_BLN]) months[r[I_THN]+'-'+r[I_BLN]] = 1; });
  var mk = Object.keys(months).sort();
  var span = mk.length ? (BLN[+mk[0].split('-')[1]] + '–' + BLN[+mk[mk.length-1].split('-')[1]] + ' ' + mk[mk.length-1].split('-')[0]) : '—';
  document.getElementById('scopeLine').textContent = RW.length + ' RW · ' + span + ' · ' + nf(ROWS.length) + ' baris';
}

// ============================================================ filter UI
var F = { from:'', to:'', preset:'all', rw:new Set(), rt:new Set(), kd:new Set(), stat:'all', act:'all' };
var TV = {};
var SORT = {};
var TAB = 'follow';
var Q = '';
var MS = {};

function multi(mount, label, opts, set){
  var host = document.getElementById(mount); clr(host);
  var wrap = E('div','ms'), btn = E('button','ctrl');
  btn.type='button'; btn.appendChild(E('span',null,label));
  var tag = E('span','tag','Semua'); btn.appendChild(tag); btn.appendChild(E('span',null,'▾'));

  var pop = E('div','ms-pop'); pop.hidden = true;
  var row = E('div','row');
  var bAll = E('button',null,'Semua'), bNone = E('button',null,'Kosong');
  bAll.type='button'; bNone.type='button';
  row.appendChild(bAll); row.appendChild(bNone); pop.appendChild(row);

  var boxes = [];
  opts.forEach(function(o,i){
    var l = E('label','opt'), cb = document.createElement('input');
    cb.type='checkbox'; cb.checked=true;
    l.appendChild(cb); l.appendChild(E('span',null,o));
    pop.appendChild(l); boxes.push(cb);
    cb.addEventListener('change', sync);
    set.add(i);
  });
  function sync(){
    set.clear(); var on=0;
    boxes.forEach(function(c,i){ if(c.checked){ set.add(i); on++; } });
    tag.textContent = on===boxes.length ? 'Semua' : nf(on);
    draw();
  }
  bAll.addEventListener('click', function(){ boxes.forEach(function(c){c.checked=true;}); sync(); });
  bNone.addEventListener('click', function(){ boxes.forEach(function(c){c.checked=false;}); sync(); });
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    document.querySelectorAll('.ms-pop').forEach(function(p){ if(p!==pop) p.hidden=true; });
    pop.hidden = !pop.hidden;
  });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });
  wrap.appendChild(btn); wrap.appendChild(pop); host.appendChild(wrap);
  return { reset: function(){ boxes.forEach(function(c){c.checked=true;}); sync(); } };
}
document.addEventListener('click', function(){ document.querySelectorAll('.ms-pop').forEach(function(p){p.hidden=true;}); });

var boundOnce = false;
function buildFilters(){
  MS.rw = multi('msRw','RW', RW, F.rw);
  MS.rt = multi('msRt','RT', RT, F.rt);
  MS.kd = multi('msKader','Kader', KADER, F.kd);

  if (boundOnce) return;
  boundOnce = true;

  document.getElementById('seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) preset(b.dataset.p);
  });
  document.getElementById('dFrom').addEventListener('change', function(){ F.from=this.value; F.preset=''; segSync(); draw(); });
  document.getElementById('dTo').addEventListener('change', function(){ F.to=this.value; F.preset=''; segSync(); draw(); });
  document.getElementById('fStat').addEventListener('change', function(){ F.stat=this.value; draw(); });
  document.getElementById('fAct').addEventListener('change', function(){ F.act=this.value; draw(); });
  document.getElementById('btnReset').addEventListener('click', function(){
    F.stat='all'; F.act='all';
    document.getElementById('fStat').value='all'; document.getElementById('fAct').value='all';
    MS.rw.reset(); MS.rt.reset(); MS.kd.reset();
    preset('all');
  });
  document.getElementById('btnReload').addEventListener('click', function(){ boot(true); });

  document.querySelectorAll('[data-tv]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.tv;
      TV[id] = !TV[id];
      b.setAttribute('aria-pressed', TV[id] ? 'true':'false');
      b.textContent = TV[id] ? 'Grafik' : 'Tabel';
      draw();
    });
  });
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    TAB = b.dataset.t;
    document.querySelectorAll('#tabs button').forEach(function(x){ x.setAttribute('aria-selected', x.dataset.t===TAB?'true':'false'); });
    // Paksa bangun ulang UI pencarian setiap ganti tab — daun elemen di
    // dalamnya sudah dibuang oleh tab lain (follow/kader selalu clr() total).
    document.getElementById('list').removeAttribute('data-search-built');
    draw();
  });

  document.querySelectorAll('.fs-btn').forEach(function(b){
    b.addEventListener('click', function(){ toggleFullscreen(b.dataset.fs); });
  });
  document.getElementById('fsCloseBtn').addEventListener('click', closeFullscreen);
  document.getElementById('fsOverlay').addEventListener('click', function(e){
    if (e.target.id === 'fsOverlay') closeFullscreen();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && FS_STATE) closeFullscreen();
  });
}

/**
 * Kartu yang dibesarkan PINDAH (bukan disalin) ke overlay — jadi seluruh
 * fungsi render & listener yang sudah menempel di dalamnya tetap terpakai
 * apa adanya. draw() dipanggil lagi setelah pindah supaya setiap chart
 * mengukur ulang clientWidth/Height barunya yang jauh lebih besar.
 */
var FS_STATE = null;
function toggleFullscreen(cardId){
  if (FS_STATE && FS_STATE.cardId === cardId) { closeFullscreen(); return; }
  if (FS_STATE) closeFullscreen();

  var mount = document.getElementById(cardId);
  var card = mount.closest('.card');
  if (!card) return;

  var placeholder = document.createComment('fs-placeholder-' + cardId);
  card.parentNode.insertBefore(placeholder, card);
  document.getElementById('fsSlot').appendChild(card);
  card.classList.add('is-fullscreen');
  document.getElementById('fsOverlay').hidden = false;
  FS_STATE = { cardId: cardId, card: card, placeholder: placeholder };

  // Dua rAF: satu supaya browser selesai menata ukuran baru kartu di dalam
  // overlay, satu lagi sebelum draw() membaca clientWidth/Height-nya.
  requestAnimationFrame(function(){ requestAnimationFrame(draw); });
}
function closeFullscreen(){
  if (!FS_STATE) return;
  var card = FS_STATE.card, placeholder = FS_STATE.placeholder;
  placeholder.parentNode.insertBefore(card, placeholder);
  placeholder.parentNode.removeChild(placeholder);
  card.classList.remove('is-fullscreen');
  document.getElementById('fsOverlay').hidden = true;
  FS_STATE = null;
  requestAnimationFrame(function(){ requestAnimationFrame(draw); });
}

function preset(p){
  F.preset = p;
  var ds = ROWS.map(function(r){return r[I_DT];}).filter(Boolean).sort();
  if (p==='all' || !ds.length){ F.from=''; F.to=''; }
  else {
    var last = ds[ds.length-1]; F.to = last;
    if (p==='last') F.from = last.slice(0,8)+'01';
    else { var d = new Date(last+'T00:00:00'); d.setDate(d.getDate()-(parseInt(p,10)-1)); F.from = d.toISOString().slice(0,10); }
  }
  document.getElementById('dFrom').value = F.from;
  document.getElementById('dTo').value = F.to;
  segSync(); draw();
}
function segSync(){
  document.querySelectorAll('#seg button').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.p===F.preset ? 'true':'false');
  });
}

// ============================================================ agregasi
function slice(){
  var aR = F.rw.size===RW.length, aT = F.rt.size===RT.length, aK = F.kd.size===KADER.length;
  return ROWS.filter(function(r){
    if (!aR && !F.rw.has(r[I_RW])) return false;
    if (!aT && !F.rt.has(r[I_RT])) return false;
    if (!aK && !F.kd.has(r[I_KD])) return false;
    if (F.from || F.to) {
      if (!r[I_DT]) return false; // tanggal tidak valid — keluar saat filter tanggal aktif
      if (F.from && r[I_DT] < F.from) return false;
      if (F.to && r[I_DT] > F.to) return false;
    }
    if (F.stat==='pos' && r[I_NEG]===1) return false;
    if (F.stat==='neg' && r[I_NEG]!==1) return false;
    var a = r[I_3M]===1 || r[I_LV]===1;
    if (F.act==='ada' && !a) return false;
    if (F.act==='belum' && a) return false;
    return true;
  });
}
function agg(rows){
  var t = {n:rows.length, neg:0, cd:0, cp:0, m3:0, lv:0, belum:0};
  rows.forEach(function(r){
    if (r[I_NEG]===1) t.neg++;
    t.cd += r[I_CD]; t.cp += r[I_CP];
    if (r[I_3M]===1) t.m3++;
    if (r[I_LV]===1) t.lv++;
    if (r[I_NEG]!==1 && r[I_3M]!==1 && r[I_LV]!==1) t.belum++;
  });
  t.pos = t.n - t.neg;
  t.abj = t.n ? t.neg/t.n*100 : 0;
  t.ci  = t.cd ? t.cp/t.cd*100 : 0;
  return t;
}
function mkeys(rows){
  var s={}; rows.forEach(function(r){ if (r[I_BLN]) s[r[I_THN]+'-'+('0'+r[I_BLN]).slice(-2)]=1; });
  return Object.keys(s).sort();
}
function mlabel(k){ var p=k.split('-'); return BLN[+p[1]]+' '+p[0].slice(2); }
/** "2026-08-27" -> "27 Agu" — format tak ambigu, bukan potongan "MM-DD" mentah. */
function dLabel(iso){ var p=String(iso).split('-'); return (+p[2]) + ' ' + BLN[+p[1]]; }

// ============================================================ tabel sortable
// Sel bisa berupa teks/angka biasa, atau {href,text} untuk dirender sebagai
// tautan (dipakai kolom Foto pada hasil pencarian).
function cellSortValue_(v){ return (v && typeof v==='object') ? (v.text||'') : v; }

function table(id, spec){
  var st = SORT[id];
  var rows = spec.rows.slice();
  if (st){
    var num = spec.num && spec.num.indexOf(st.col)>=0;
    rows.sort(function(a,b){
      var x=cellSortValue_(a[st.col]), y=cellSortValue_(b[st.col]);
      if (num){ x=parseFloat(String(x).replace(/\./g,'').replace(',','.'))||0; y=parseFloat(String(y).replace(/\./g,'').replace(',','.'))||0; return st.dir*(x-y); }
      return st.dir*String(x).localeCompare(String(y),'id');
    });
  }
  var t = E('table','dt'), th = document.createElement('thead'), tr = document.createElement('tr');
  spec.head.forEach(function(h,i){
    var c = E('th', spec.num&&spec.num.indexOf(i)>=0 ? 'n':null);
    c.appendChild(document.createTextNode(h));
    var ar = E('span','ar', st&&st.col===i ? (st.dir>0?'▲':'▼') : '↕');
    c.appendChild(ar);
    if (st&&st.col===i) c.setAttribute('aria-sort', st.dir>0?'ascending':'descending');
    c.tabIndex = 0;
    var go = function(){
      SORT[id] = (st && st.col===i) ? {col:i, dir:-st.dir} : {col:i, dir:1};
      draw();
    };
    c.addEventListener('click', go);
    c.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    tr.appendChild(c);
  });
  th.appendChild(tr); t.appendChild(th);
  var tb = document.createElement('tbody');
  rows.forEach(function(r){
    var x = document.createElement('tr');
    r.forEach(function(v,i){
      var ell = spec.ell && spec.ell.indexOf(i)>=0;
      var cls = spec.num&&spec.num.indexOf(i)>=0 ? 'n' : (ell ? 'ell' : null);
      var td = document.createElement('td');
      if (cls) td.className = cls;
      if (v && typeof v === 'object' && v.href) {
        var a = document.createElement('a');
        a.href = v.href; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = v.text || 'Lihat';
        td.appendChild(a);
      } else {
        var text = (v === undefined || v === null || v === '') ? '—' : String(v);
        td.textContent = text;
        if (ell) td.title = text;
      }
      x.appendChild(td);
    });
    tb.appendChild(x);
  });
  t.appendChild(tb);
  return t;
}

// ============================================================ chart: tren
function trend(id, pts, target, name, unit, higher){
  var host = document.getElementById(id); clr(host);
  if (TV[id]){
    host.appendChild(table(id, {
      head:['Bulan', name+' (%)', 'Jumlah '+unit],
      rows: pts.map(function(p){ return [mlabel(p.k), nf(p.v,1), nf(p.n)]; }),
      num:[1,2]
    }));
    return;
  }
  if (!pts.length){ host.appendChild(E('div','empty','Tidak ada data.')); return; }

  var W = host.clientWidth || 260, H = Math.max(120, host.clientHeight - 4);
  // b (margin bawah) diberi ruang tetap untuk label bulan di sumbu-X, supaya
  // bulannya langsung terlihat tanpa harus hover dulu.
  var m = {t:12, r:9, b:28, l:26}, iw = Math.max(50, W-m.l-m.r), ih = Math.max(50, H-m.t-m.b);
  var vs = pts.map(function(p){return p.v;}).concat([target]);
  var lo = Math.min.apply(null,vs), hi = Math.max.apply(null,vs);
  var pad = Math.max(0.5,(hi-lo)*0.25);
  var sc = nice(higher ? lo-pad : 0, hi+pad, 4);
  var y0 = higher ? Math.max(0,sc.min) : 0, y1 = higher ? Math.min(100,sc.max) : sc.max;
  if (y1-y0 < sc.step) y1 = y0 + sc.step;
  var tc = Math.max(2, Math.min(5, Math.round((y1-y0)/sc.step)));

  var svg = S('svg',{class:'chart', viewBox:'0 0 '+W+' '+H, height:H, role:'img'});
  svg.setAttribute('aria-label','Tren '+name);
  function X(i){ return m.l + (pts.length===1 ? iw/2 : i/(pts.length-1)*iw); }
  function Y(v){ return m.t + ih - (v-y0)/(y1-y0)*ih; }

  for (var g=0; g<=tc; g++){
    var v = y0 + (y1-y0)*g/tc, y = Y(v);
    svg.appendChild(S('line',{class:'grid-line', x1:m.l, x2:m.l+iw, y1:y, y2:y}));
    var tk = S('text',{class:'axis', x:m.l-5, y:y+3, 'text-anchor':'end'});
    tk.textContent = nf(v, sc.step<1?1:0)+'%';
    svg.appendChild(tk);
  }
  svg.appendChild(S('line',{class:'tgt-line', x1:m.l, x2:m.l+iw, y1:Y(target), y2:Y(target)}));

  var area = pts.map(function(p,i){ return (i?'L':'M')+X(i)+' '+Y(p.v); }).join(' ') +
             ' L'+X(pts.length-1)+' '+(m.t+ih)+' L'+X(0)+' '+(m.t+ih)+' Z';
  svg.appendChild(S('path',{d:area, fill:'var(--accent)', opacity:.09}));
  svg.appendChild(S('path',{class:'s-line', d: pts.map(function(p,i){ return (i?'L':'M')+X(i)+' '+Y(p.v); }).join(' ')}));
  pts.forEach(function(p,i){ svg.appendChild(S('circle',{class:'s-dot', cx:X(i), cy:Y(p.v), r:3.1})); });

  var li = pts.length-1;
  var lb = S('text',{class:'d-label', x:X(li), y:Y(pts[li].v)-8, 'text-anchor': li?'end':'middle'});
  lb.textContent = pc(pts[li].v); svg.appendChild(lb);

  svg.appendChild(S('line',{class:'base-line', x1:m.l, x2:m.l+iw, y1:m.t+ih, y2:m.t+ih}));
  pts.forEach(function(p,i){
    var xl = S('text',{class:'axis', x:X(i), y:m.t+ih+14, 'text-anchor': i===0 ? 'start' : (i===pts.length-1 ? 'end' : 'middle')});
    xl.textContent = mlabel(p.k);
    svg.appendChild(xl);
  });

  pts.forEach(function(p,i){
    var half = pts.length===1 ? iw/2 : iw/(pts.length-1)/2;
    var hit = S('rect',{x:Math.max(m.l,X(i)-half), y:m.t, width:Math.max(24,half*2), height:ih, fill:'transparent'});
    hit.addEventListener('pointermove', function(e){
      tip(mlabel(p.k), [{c:'#2a78d6', v:pc(p.v), n:name}, {v:nf(p.n), n:unit}], e.clientX, e.clientY);
    });
    hit.addEventListener('pointerleave', untip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

// ============================================================ chart: bar
function bars(host, items, unit, labelW, opt){
  opt = opt || {};
  if (!items.length){ host.appendChild(E('div','empty','Tidak ada data.')); return; }
  var max = Math.max.apply(null, items.map(function(i){return i.v;})) || 1;
  var wrap = E('div','rows');
  items.forEach(function(it){
    var row = E('div','brow');
    row.style.gridTemplateColumns = labelW+'px 1fr '+(opt.valW||34)+'px';
    row.appendChild(E('div','nm',it.name));
    var trk = E('div','trk'), fil = E('div','fil');
    fil.style.left = '0'; fil.style.width = (it.v/max*100)+'%';
    fil.style.borderRadius = '0 3px 3px 0';
    trk.appendChild(fil); row.appendChild(trk);
    row.appendChild(E('div','vl', nf(it.v)));
    row.addEventListener('pointermove', function(e){ tip(it.name, [{c:'#2a78d6', v:nf(it.v), n:unit}], e.clientX, e.clientY); });
    row.addEventListener('pointerleave', untip);
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
}

function kpi(label, val, foot, pillCls, pillTxt, stripe){
  var c = E('div','kpi '+(stripe||'is-plain'));
  c.appendChild(E('div','k-label',label));
  c.appendChild(E('div','k-val',val));
  var f = E('div','k-foot');
  if (foot) f.appendChild(document.createTextNode(foot));
  if (pillTxt){
    var p = E('span','pill '+(pillCls||''));
    p.appendChild(E('span',null,pillTxt));
    f.appendChild(p);
  }
  c.appendChild(f);
  return c;
}

// ============================================================ render
function draw(){
  if (!DATA) return;
  var rows = slice(), t = agg(rows);
  CURRENT_ROWS = rows;
  document.getElementById('cnt').textContent = nf(rows.length)+' baris';

  renderKpis(t);
  renderQualityNotice();

  var ks = mkeys(rows), byM = {};
  ks.forEach(function(k){ byM[k]=[]; });
  rows.forEach(function(r){ if(!r[I_BLN]) return; var k=r[I_THN]+'-'+('0'+r[I_BLN]).slice(-2); if(byM[k]) byM[k].push(r); });
  trend('abj', ks.map(function(k){ var a=agg(byM[k]); return {k:k, v:a.abj, n:a.n}; }), T_ABJ, 'ABJ', 'bangunan', true);
  trend('ci',  ks.map(function(k){ var a=agg(byM[k]); return {k:k, v:a.ci,  n:a.cd}; }), T_CI, 'CI', 'container', false);

  renderRank(rows);
  renderHeatmap(rows, ks);
  renderContainers(rows);
  renderActions(rows);
  renderDaily(rows);
  renderList(rows);
}

function renderKpis(t){
  var K = document.getElementById('kpis'); clr(K);
  var hero = E('div','kpi hero ' + (t.abj>=T_ABJ?'is-good':'is-bad'));
  hero.appendChild(E('div','k-label','Angka Bebas Jentik (ABJ)'));
  hero.appendChild(E('div','k-val', t.n?pc(t.abj):'—'));
  var mt = E('div','meter'+(t.abj<T_ABJ?' bad':''));
  var fi = document.createElement('i'); fi.style.width = Math.max(0,Math.min(100,t.abj))+'%'; mt.appendChild(fi);
  var tg = E('span','tgt'); tg.style.left = T_ABJ+'%'; mt.appendChild(tg);
  hero.appendChild(mt);
  var hf = E('div','k-foot'); hf.appendChild(document.createTextNode('Target ≥ 95%'));
  var hp = E('span','pill '+(t.abj>=T_ABJ?'ok':'bad'));
  hp.appendChild(E('span',null, t.abj>=T_ABJ?'✓':'▲'));
  hp.appendChild(E('span',null, t.abj>=T_ABJ?'Risiko rendah':'Risiko tinggi'));
  hf.appendChild(hp); hero.appendChild(hf);
  K.appendChild(hero);

  K.appendChild(kpi('Container Index', t.cd?pc(t.ci):'—', 'Target < 5%',
    t.ci<T_CI?'ok':'bad', t.ci<T_CI?'✓ Aman':'▲ Di atas target', t.ci<T_CI?'is-good':'is-bad'));
  K.appendChild(kpi('Bangunan diperiksa', nf(t.n), nf(t.cd)+' container', null, null, 'is-plain'));
  K.appendChild(kpi('Positif jentik', nf(t.pos), t.n?pc(t.pos/t.n*100)+' dari diperiksa':'—', null, null, 'is-plain'));
  K.appendChild(kpi('Positif tanpa tindakan', nf(t.belum), 'Belum 3M / larvasidasi',
    t.belum?'warn':'ok', t.belum?'▲ Perlu tindak lanjut':'✓ Tertangani', t.belum?'is-warn':'is-good'));
}

function renderQualityNotice(){
  var q = DATA.quality || {};
  var host = document.getElementById('scopeLine');
  // Catatan kualitas data ditaruh sebagai title (tooltip native) di scope
  // line supaya tidak menyita baris layar tambahan pada kokpit satu layar.
  var bits = [];
  if (q.catatan) bits.push(q.catatan + ' baris punya catatan kualitas data (lihat kolom Catatan di Master Data)');
  if (q.tanggalKosong) bits.push(q.tanggalKosong + ' baris tanpa tanggal valid');
  host.title = bits.join(' · ') || 'Tidak ada catatan kualitas data.';
}

function renderRank(rows){
  var host = document.getElementById('rank'); clr(host);
  var byR = {};
  rows.forEach(function(r){ (byR[r[I_RW]] = byR[r[I_RW]] || []).push(r); });
  var items = Object.keys(byR).map(function(k){
    var a = agg(byR[k]);
    return { nm:RW[k], abj:a.abj, n:a.n, pos:a.pos };
  }).sort(function(a,b){ return a.abj-b.abj; });

  if (TV.rank){
    host.appendChild(table('rank', {
      head:['RW','ABJ (%)','Diperiksa','Positif','Status'],
      rows: items.map(function(i){ return [i.nm, nf(i.abj,1), nf(i.n), nf(i.pos), i.abj>=T_ABJ?'Target':'Risiko']; }),
      num:[1,2,3]
    }));
    return;
  }
  if (!items.length){ host.appendChild(E('div','empty','Tidak ada data.')); return; }

  var lg = E('div','legend');
  var l1 = E('span'); var i1=document.createElement('i'); i1.style.background='var(--pole-low)'; l1.appendChild(i1); l1.appendChild(document.createTextNode('< 95%')); lg.appendChild(l1);
  var l2 = E('span'); var i2=document.createElement('i'); i2.style.background='var(--accent)'; l2.appendChild(i2); l2.appendChild(document.createTextNode('≥ 95%')); lg.appendChild(l2);
  host.appendChild(lg);

  var mx = Math.max(2, Math.ceil(Math.max.apply(null, items.map(function(i){ return Math.abs(i.abj-T_ABJ); }))));
  var ax = E('div','axrow'); ax.style.gridTemplateColumns = '38px 1fr 62px';
  ax.appendChild(E('div'));
  var sc = E('div','sc');
  sc.appendChild(E('span','l','−'+mx)); sc.appendChild(E('span','c','target 95%')); sc.appendChild(E('span','r','+'+mx));
  ax.appendChild(sc); ax.appendChild(E('div'));
  host.appendChild(ax);

  var wrap = E('div','rows');
  items.forEach(function(it){
    var dev = it.abj - T_ABJ, w = Math.abs(dev)/mx*50;
    var row = E('div','brow'); row.style.gridTemplateColumns = '38px 1fr 62px';
    row.appendChild(E('div','nm', it.nm.replace('RW ','')));
    var trk = E('div','trk'), fil = E('div','fil'+(dev<0?' low':''));
    if (dev>=0){ fil.style.left='50%'; fil.style.borderRadius='0 3px 3px 0'; }
    else { fil.style.left=(50-w)+'%'; fil.style.borderRadius='3px 0 0 3px'; }
    fil.style.width = w+'%';
    trk.appendChild(fil);
    var md = E('span','mid'); md.style.left='50%'; trk.appendChild(md);
    row.appendChild(trk);
    var vl = E('div','vl');
    vl.appendChild(E('span',null,pc(it.abj)));
    row.appendChild(vl);
    row.addEventListener('pointermove', function(e){
      tip(it.nm, [
        {c: dev>=0?'#2a78d6':'#d03b3b', v:pc(it.abj), n:'ABJ'},
        {v:(dev>=0?'+':'−')+nf(Math.abs(dev),1), n:'poin dari target'},
        {v:nf(it.n), n:'diperiksa'}, {v:nf(it.pos), n:'positif'}
      ], e.clientX, e.clientY);
    });
    row.addEventListener('pointerleave', untip);
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
}

function renderHeatmap(rows, ks){
  var hh = document.getElementById('heat'); clr(hh);
  var cells = {}, rwk = [];
  rows.forEach(function(r){
    if (!r[I_BLN]) return;
    var rw = RW[r[I_RW]], mk = r[I_THN]+'-'+('0'+r[I_BLN]).slice(-2);
    if (!cells[rw]){ cells[rw]={}; rwk.push(rw); }
    (cells[rw][mk] = cells[rw][mk] || []).push(r);
  });
  rwk.sort();

  if (TV.heat){
    hh.appendChild(table('heat', {
      head:['RW'].concat(ks.map(mlabel)),
      rows: rwk.map(function(rw){
        return [rw].concat(ks.map(function(mk){ var g=cells[rw][mk]; return g?nf(agg(g).abj,1):'—'; }));
      }),
      num: ks.map(function(_,i){ return i+1; })
    }));
    return;
  }
  if (!rwk.length || !ks.length){ hh.appendChild(E('div','empty','Tidak ada data.')); return; }

  var box = E('div','hm'), tb = document.createElement('table');
  var thd = document.createElement('thead'), htr = document.createElement('tr');
  htr.appendChild(E('th',null,'RW'));
  ks.forEach(function(k){ htr.appendChild(E('th',null,mlabel(k))); });
  thd.appendChild(htr); tb.appendChild(thd);
  var bdy = document.createElement('tbody');
  rwk.forEach(function(rw){
    var tr = document.createElement('tr');
    tr.appendChild(E('th',null,rw.replace('RW ','')));
    ks.forEach(function(mk){
      var td = document.createElement('td'), g = cells[rw][mk], cell;
      if (!g){ cell = E('div','cell na','—'); }
      else {
        var a = agg(g), d = a.abj-T_ABJ;
        var span = d<0 ? 12 : 5, st = Math.min(6, Math.max(0, Math.round(Math.min(1,Math.abs(d)/span)*6)));
        var bg = Math.abs(d)<0.35 ? '#eef1f6' : (d<0 ? RED[st] : BLUE[st]);
        cell = E('div','cell', nf(a.abj,1));
        cell.style.background = bg;
        var rr=parseInt(bg.substr(1,2),16), gg=parseInt(bg.substr(3,2),16), bb=parseInt(bg.substr(5,2),16);
        cell.style.color = (0.299*rr+0.587*gg+0.114*bb)/255 > 0.62 ? '#10151f' : '#fff';
        cell.addEventListener('pointermove', function(e){
          tip(rw+' · '+mlabel(mk), [{c:bg, v:pc(a.abj), n:'ABJ'},{v:nf(a.n), n:'diperiksa'},{v:nf(a.pos), n:'positif'}], e.clientX, e.clientY);
        });
        cell.addEventListener('pointerleave', untip);
      }
      td.appendChild(cell); tr.appendChild(td);
    });
    bdy.appendChild(tr);
  });
  tb.appendChild(bdy); box.appendChild(tb); hh.appendChild(box);

  var sl = E('div','scale');
  sl.appendChild(E('span',null,'83%'));
  var sw = E('div');
  [6,4,2,0].forEach(function(i){ var s=document.createElement('i'); s.style.background=RED[i]; sw.appendChild(s); });
  var nm=document.createElement('i'); nm.style.background='#eef1f6'; sw.appendChild(nm);
  [0,3,6].forEach(function(i){ var s=document.createElement('i'); s.style.background=BLUE[i]; sw.appendChild(s); });
  sl.appendChild(sw);
  sl.appendChild(E('span',null,'100%'));
  hh.appendChild(sl);
}

function renderDaily(rows){
  var dh = document.getElementById('day'); clr(dh);
  var byD = {};
  rows.forEach(function(r){ if(!r[I_DT]) return; if(!byD[r[I_DT]]) byD[r[I_DT]]={n:0,p:0}; byD[r[I_DT]].n++; if(r[I_NEG]!==1) byD[r[I_DT]].p++; });
  var dk = Object.keys(byD).sort();
  if (TV.day){
    dh.appendChild(table('day', {head:['Tanggal','Diperiksa','Positif'], rows:dk.map(function(k){return [k, nf(byD[k].n), nf(byD[k].p)];}), num:[1,2]}));
    return;
  }
  if (!dk.length){ dh.appendChild(E('div','empty','Tidak ada tanggal valid pada filter ini.')); return; }

  var W2 = dh.clientWidth||260, H2 = Math.max(110, dh.clientHeight-4);
  var m2 = {t:9,r:5,b:14,l:23}, iw2 = Math.max(40,W2-m2.l-m2.r), ih2 = Math.max(40,H2-m2.t-m2.b);
  var mx2 = Math.max.apply(null, dk.map(function(k){return byD[k].n;}));
  var s2 = nice(0, mx2, 3), ym = Math.max(s2.step, s2.max);
  var nt2 = Math.max(1, Math.round(ym/s2.step));
  var svg2 = S('svg',{class:'chart', viewBox:'0 0 '+W2+' '+H2, height:H2, role:'img'});
  svg2.setAttribute('aria-label','Volume pemeriksaan harian');
  for (var g2=0; g2<=nt2; g2++){
    var v2 = s2.step*g2, y2 = m2.t+ih2 - v2/ym*ih2;
    svg2.appendChild(S('line',{class:'grid-line', x1:m2.l, x2:m2.l+iw2, y1:y2, y2:y2}));
    var t2 = S('text',{class:'axis', x:m2.l-4, y:y2+3, 'text-anchor':'end'}); t2.textContent=nf(v2);
    svg2.appendChild(t2);
  }
  var slot = iw2/dk.length, bw = Math.min(12, Math.max(1.5, slot-2));
  dk.forEach(function(k,i){
    var d = byD[k], h = d.n/ym*ih2, x = m2.l+i*slot+(slot-bw)/2, y = m2.t+ih2-h;
    var rr = Math.min(2, bw/2);
    svg2.appendChild(S('path',{d:'M'+x+' '+(m2.t+ih2)+' V'+(y+rr)+' q0 '+(-rr)+' '+rr+' '+(-rr)+' h'+(bw-2*rr)+' q'+rr+' 0 '+rr+' '+rr+' V'+(m2.t+ih2)+' Z', fill:'var(--accent)'}));
    var hit = S('rect',{x:m2.l+i*slot, y:m2.t, width:Math.max(10,slot), height:ih2, fill:'transparent'});
    hit.addEventListener('pointermove', function(e){ tip(dLabel(k), [{c:'#2a78d6', v:nf(d.n), n:'diperiksa'},{v:nf(d.p), n:'positif'}], e.clientX, e.clientY); });
    hit.addEventListener('pointerleave', untip);
    svg2.appendChild(hit);
  });
  svg2.appendChild(S('line',{class:'base-line', x1:m2.l, x2:m2.l+iw2, y1:m2.t+ih2, y2:m2.t+ih2}));
  [0, dk.length-1].forEach(function(i,n){
    if (dk.length===1 && n===1) return;
    var tx = S('text',{class:'axis', x:m2.l+i*slot+slot/2, y:H2-4, 'text-anchor': n?'end':'start'});
    // "D MMM" (mis. "27 Agu"), bukan potongan ISO "MM-DD" — angka mentah
    // seperti "08-27" mudah terbaca terbalik sebagai tanggal-bulan.
    tx.textContent = dLabel(dk[i]); svg2.appendChild(tx);
  });
  dh.appendChild(svg2);
}

function renderList(rows){
  var lh = document.getElementById('list');

  if (TAB === 'search') { renderSearchTab(lh, rows); return; }

  clr(lh);
  if (TAB==='follow'){
    var pos = rows.filter(function(r){ return r[I_NEG]!==1; })
      .sort(function(a,b){ return String(b[I_DT]).localeCompare(String(a[I_DT])); });
    document.getElementById('listHint').textContent = nf(pos.length)+' bangunan positif';
    if (!pos.length) { lh.appendChild(E('div','empty','Tidak ada bangunan positif.')); return; }
    lh.appendChild(table('follow', {
      head:['Tanggal','RW','RT','Nama pemilik','Alamat','Tindakan'],
      rows: pos.slice(0,500).map(function(r){
        var a=[]; if(r[I_3M]===1)a.push('3M'); if(r[I_LV]===1)a.push('Larvasidasi');
        return [r[I_DT]||r[I_DTASLI], RW[r[I_RW]], RT[r[I_RT]], r[I_NM], r[I_AL],
          a.length?a.join(' + '):'⚠ Belum ada'];
      }),
      ell:[3,4]
    }));
    if (pos.length > 500) lh.appendChild(E('div','empty','Menampilkan 500 dari '+nf(pos.length)+' — perkecil filter.'));
  } else if (TAB==='kader'){
    var byK = {};
    rows.forEach(function(r){ (byK[r[I_KD]] = byK[r[I_KD]] || []).push(r); });
    var kr = Object.keys(byK).map(function(k){
      var a = agg(byK[k]);
      return [KADER[k], nf(a.n), nf(a.abj,1), nf(a.pos), nf(a.belum)];
    });
    document.getElementById('listHint').textContent = nf(kr.length)+' kader';
    lh.appendChild(table('kader', { head:['Kader','Diperiksa','ABJ (%)','Positif','Belum ditindak'], rows: kr, num:[1,2,3,4] }));
  }
}

/**
 * Tab pencarian dibangun SEKALI (kotak input tidak boleh ikut dibongkar
 * setiap draw() — kalau tidak, fokus & posisi kursor hilang tiap ketikan).
 * Hasil pencariannya saja yang digambar ulang.
 */
var SEARCH_PAGE = 1;
var SEARCH_PAGE_SIZE = 30;
var SEARCH_NUM_COLS = [6,7,8];

function renderSearchTab(host, rows){
  if (host.dataset.searchBuilt !== '1') {
    clr(host);
    var wrap = E('div','search-tab-wrap');
    var bar = E('div','search-bar');
    var input = document.createElement('input');
    input.type = 'search'; input.className = 'ctrl'; input.id = 'searchInput';
    input.placeholder = 'Ketik nama pemilik rumah/bangunan… (kosongkan untuk lihat semua)';
    input.value = Q;
    bar.appendChild(input);
    wrap.appendChild(bar);
    var results = E('div','search-results'); results.id = 'searchResults';
    wrap.appendChild(results);
    var pager = E('div','search-pager'); pager.id = 'searchPager';
    wrap.appendChild(pager);
    host.appendChild(wrap);
    host.dataset.searchBuilt = '1';

    input.addEventListener('input', function(){
      Q = this.value;
      SEARCH_PAGE = 1;
      renderSearchResults(CURRENT_ROWS);
    });
  }
  renderSearchResults(rows);
}

/** Sortir generik yang sama dengan yang dipakai table() — dipakai di sini
 * supaya urutan diterapkan pada SELURUH hasil sebelum dipotong per halaman,
 * bukan cuma pada baris yang sedang tampil. */
function sortRows_(rows, st, numCols){
  if (!st) return rows.slice();
  var num = numCols && numCols.indexOf(st.col) >= 0;
  return rows.slice().sort(function(a,b){
    var x = cellSortValue_(a[st.col]), y = cellSortValue_(b[st.col]);
    if (num){ x=parseFloat(String(x).replace(/\./g,'').replace(',','.'))||0; y=parseFloat(String(y).replace(/\./g,'').replace(',','.'))||0; return st.dir*(x-y); }
    return st.dir*String(x).localeCompare(String(y),'id');
  });
}

function renderSearchResults(rows){
  var host = document.getElementById('searchResults');
  var pagerHost = document.getElementById('searchPager');
  if (!host || !pagerHost) return;
  clr(host); clr(pagerHost);

  var q = Q.trim().toLowerCase();
  if (q && q.length < 2){
    document.getElementById('listHint').textContent = '';
    host.appendChild(E('div','empty','Ketik minimal 2 huruf, atau kosongkan kotak untuk melihat semua data.'));
    return;
  }

  // Kosong = tampilkan SEMUA data pada cakupan filter global saat ini —
  // pencarian di sini hanya mempersempit, bukan syarat untuk menampilkan apa pun.
  var matches = q ? rows.filter(function(r){ return String(r[I_NM]).toLowerCase().indexOf(q) !== -1; }) : rows;

  var sorted = SORT['search']
    ? sortRows_(matches, SORT['search'], SEARCH_NUM_COLS)
    : matches.slice().sort(function(a,b){
        var n = String(a[I_NM]).localeCompare(String(b[I_NM]), 'id');
        return n || String(b[I_DT]).localeCompare(String(a[I_DT]));
      });

  document.getElementById('listHint').textContent = nf(sorted.length) + (q ? ' catatan ditemukan' : ' baris (semua data pada filter saat ini)');
  if (!sorted.length){
    host.appendChild(E('div','empty', q ? 'Tidak ada nama yang cocok pada filter saat ini.' : 'Tidak ada data pada filter saat ini.'));
    return;
  }

  var totalPages = Math.max(1, Math.ceil(sorted.length / SEARCH_PAGE_SIZE));
  if (SEARCH_PAGE > totalPages) SEARCH_PAGE = totalPages;
  if (SEARCH_PAGE < 1) SEARCH_PAGE = 1;
  var start = (SEARCH_PAGE - 1) * SEARCH_PAGE_SIZE;
  var pageRows = sorted.slice(start, start + SEARCH_PAGE_SIZE);

  host.appendChild(table('search', {
    head:['Nama Pemilik','Alamat','RW','RT','Bulan','Tanggal','Diperiksa','Positif','Negatif','Status','Kode Kontainer','3M','Larva','Foto','Kader','Catatan'],
    rows: pageRows.map(function(r){
      var kodeLabel = r[I_CODE].map(function(c){ return CONT[c] || ('Kode '+c); }).join(', ');
      var foto = (r[I_FOTOST] === 'Ada foto' && r[I_FOTOLK]) ? { href: r[I_FOTOLK], text: 'Lihat foto' } : r[I_FOTOST];
      return [
        r[I_NM], r[I_AL], RW[r[I_RW]], RT[r[I_RT]], BLN[r[I_BLN]] || '—', r[I_DT] || r[I_DTASLI],
        nf(r[I_CD]), nf(r[I_CP]), nf(r[I_CN]), r[I_NEG]===1 ? 'Bebas' : 'Positif',
        kodeLabel, r[I_3M]===1 ? 'Ya' : '—', r[I_LV]===1 ? 'Ya' : '—',
        foto, KADER[r[I_KD]], r[I_CATATAN]
      ];
    }),
    num: SEARCH_NUM_COLS,
    ell:[1,10,15]
  }));

  // Paginasi — di luar area scroll tabel supaya selalu terlihat.
  var info = E('span', null, 'Halaman ' + SEARCH_PAGE + ' dari ' + totalPages + ' · baris ' +
    nf(start + 1) + '–' + nf(Math.min(start + SEARCH_PAGE_SIZE, sorted.length)) + ' dari ' + nf(sorted.length));
  var bPrev = E('button','mini','‹ Sebelumnya'); bPrev.type='button';
  var bNext = E('button','mini','Berikutnya ›'); bNext.type='button';
  bPrev.disabled = SEARCH_PAGE <= 1;
  bNext.disabled = SEARCH_PAGE >= totalPages;
  bPrev.addEventListener('click', function(){ SEARCH_PAGE--; renderSearchResults(CURRENT_ROWS); });
  bNext.addEventListener('click', function(){ SEARCH_PAGE++; renderSearchResults(CURRENT_ROWS); });
  pagerHost.appendChild(bPrev); pagerHost.appendChild(info); pagerHost.appendChild(bNext);
}

      <!--
        SCRIPT INI HARUS TETAP DI ATAS <main>, JANGAN DIPINDAH KE BAWAH.

        Isi halaman (<?!= content ?> di <main> tepat di bawah ini) membawa
        <script> inline-nya sendiri. Saat halaman dibuka dengan LOAD PENUH
        (ketik URL langsung, hard refresh, buka dari link) script fragment itu
        dieksekusi browser SAAT PARSING, yaitu di posisi ini — jauh sebelum
        blok <script> besar Shell di bawah halaman selesai diparse.

        Akibatnya fragment yang memanggil helper Shell langsung di top-level
        akan kena "ReferenceError: ... is not defined", script fragment mati
        di baris itu, dan halaman berhenti di state "Memuat..." selamanya.
        Hard refresh JUSTRU selalu memicu jalur ini, bukan memperbaikinya.

        Dua helper di bawah adalah yang dibutuhkan fragment PADA saat
        bootstrap, jadi keduanya sengaja didefinisikan di sini — bukan di blok
        besar bawah — supaya urutan parsing tidak pernah jadi masalah lagi.
      -->
      <script>
        /**
         * Pembungkus google.script.run dengan retry — transport-nya
         * sesekali menelan panggilan pertama setelah halaman baru dibuka.
         *
         * DIDEFINISIKAN DI SINI (bukan di blok bawah) karena inilah helper
         * pertama yang dipanggil hampir semua halaman saat bootstrap.
         */
        function gsRunWithRetry(fnName, args, onSuccess, onFailure, retriesLeft, delayMs) {
          if (retriesLeft == null) retriesLeft = 2;
          if (delayMs == null) delayMs = 700;
          var runner = google.script.run
            .withSuccessHandler(function (res) {
              if (!res && retriesLeft > 0) {
                setTimeout(function () { gsRunWithRetry(fnName, args, onSuccess, onFailure, retriesLeft - 1, delayMs); }, delayMs);
                return;
              }
              onSuccess(res);
            })
            .withFailureHandler(function (err) {
              if (retriesLeft > 0) {
                setTimeout(function () { gsRunWithRetry(fnName, args, onSuccess, onFailure, retriesLeft - 1, delayMs); }, delayMs);
                return;
              }
              onFailure(err);
            });
          runner[fnName].apply(runner, args || []);
        }

        /**
         * SEMUA halaman Content WAJIB membungkus pemanggilan bootstrap-nya
         * dengan ini — jangan panggil fungsi bootstrap langsung di top-level.
         *
         * Menangani dua jalur masuk halaman sekaligus:
         * - Load penuh: readyState masih 'loading' di titik parsing fragment,
         *   jadi bootstrap ditunda sampai event 'load' — saat itu seluruh
         *   helper Shell (Toast, TechfordNav, TechfordAuth) sudah ada.
         * - Navigasi SPA: dokumen sudah lama 'complete', jadi bootstrap
         *   jalan seketika tanpa menunggu apa pun (lihat execScripts).
         *
         * Dites otomatis oleh tests/shell-bootstrap-order.test.js — halaman
         * yang bootstrap di top-level tanpa pembungkus ini akan menggagalkan
         * test, supaya bug urutan parsing ini tidak terulang.
         */
        function techfordOnReady(fn) {
          if (document.readyState === 'complete') fn();
          else window.addEventListener('load', fn);
        }

        /**
         * Baris tabel yang bisa diklik untuk membuka drawer.
         *
         * Ditaruh di sini (satu implementasi untuk semua halaman) karena
         * bagian yang sulitnya BUKAN membuka drawer, melainkan mengetahui
         * kapan TIDAK boleh membukanya. Kalau tiap halaman menuliskannya
         * sendiri, tiga dari lima pasti lupa salah satu kasus di bawah:
         *
         * - Klik pada tombol/link/checkbox di dalam baris. Baris Lead punya
         *   checkbox pilih-massal dan Client punya tombol salin nomor —
         *   mencentang lalu drawer ikut terbuka membuat aksi massal praktis
         *   tak bisa dipakai.
         * - MENYOROT TEKS di dalam sel. Menyalin nomor telepon dengan cara
         *   diseleksi berakhir dengan mouseup di dalam baris; tanpa
         *   pemeriksaan ini drawer terbuka setiap kali orang menyalin
         *   sesuatu, dan teks yang disorotnya hilang.
         * - Klik tengah / klik kanan / klik dengan modifier (Ctrl/Cmd/Shift)
         *   — kebiasaan "buka di tab baru"; membuka drawer di situ
         *   mengagetkan.
         *
         * Elemen apa pun boleh menolak eksplisit dengan class "no-row-open".
         */
        function techfordRowOpen(event, fn) {
          if (event.button && event.button !== 0) return;
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

          var stop = { BUTTON: 1, A: 1, INPUT: 1, SELECT: 1, TEXTAREA: 1, LABEL: 1, SUMMARY: 1 };
          var node = event.target;
          var batas = event.currentTarget;
          while (node && node !== batas) {
            if (stop[node.tagName]) return;
            if (node.classList && node.classList.contains('no-row-open')) return;
            node = node.parentNode;
          }

          var sel = window.getSelection && window.getSelection();
          if (sel && sel.toString().length > 0) return;

          fn();
        }

        /**
         * Pindah ke record sebelum/sesudahnya SESUAI URUTAN YANG TERLIHAT.
         *
         * `ids` harus daftar hasil filter + sort yang sedang dipakai tabel,
         * bukan data mentah — kalau tidak, tombol "berikutnya" melompat ke
         * record yang tidak ada di layar dan urutannya terasa acak.
         *
         * @returns {?{id:string, index:number, total:number}} null kalau
         *          sudah di ujung (pemanggil menonaktifkan tombolnya).
         */
        function techfordDrawerStep(ids, currentId, delta) {
          if (!ids || !ids.length) return null;
          var i = ids.indexOf(currentId);
          if (i === -1) return null;
          var j = i + delta;
          if (j < 0 || j >= ids.length) return null;
          return { id: ids[j], index: j, total: ids.length };
        }

        /**
         * Panah kiri/kanan untuk berpindah record selama drawer terbuka.
         *
         * Sengaja TIDAK aktif saat fokus ada di input/textarea/select atau di
         * elemen contenteditable: menggeser kursor di dalam kolom teks adalah
         * arti panah yang jauh lebih diharapkan, dan drawer ini penuh dengan
         * form yang bisa diedit.
         */
        // Setiap navigasi SPA menjalankan ULANG <script> halaman (lihat
        // execScripts) — kalau techfordBindDrawerArrows memasang
        // document.addEventListener sendiri tiap dipanggil, listener-nya
        // MENUMPUK setiap kali halaman yang sama dibuka lagi (document tidak
        // pernah diganti, cuma innerHTML #mainContent). Dua listener yang
        // menumpuk berarti satu tekan panah memanggil onPrev/onNext DUA
        // KALI -> drawer melompat 2 langkah, padahal tombol ‹ › (onclick di
        // elemen yang selalu dibuat baru) tetap benar. Jadi: LISTENER
        // sungguhan dipasang SEKALI SEUMUR HIDUP halaman (window flag),
        // panggilan berikutnya cuma mengganti target isOpen/onPrev/onNext
        // yang "sedang aktif".
        var __techfordDrawerArrowBinding = null;
        function techfordBindDrawerArrows(isOpen, onPrev, onNext) {
          __techfordDrawerArrowBinding = { isOpen: isOpen, onPrev: onPrev, onNext: onNext };
          if (window.__techfordDrawerArrowListenerBound) return;
          window.__techfordDrawerArrowListenerBound = true;
          document.addEventListener('keydown', function (e) {
            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            var b = __techfordDrawerArrowBinding;
            if (!b) return;
            try {
              // Binding bisa jadi sisa halaman SEBELUMNYA yang sudah diganti
              // (elemen yang dicek isOpen() sudah tidak ada di DOM) — jangan
              // sampai error di sini malah mematikan listener global untuk
              // seluruh halaman berikutnya.
              if (!b.isOpen()) return;
            } catch (err) { return; }
            var a = document.activeElement;
            if (a && (a.isContentEditable || { INPUT: 1, TEXTAREA: 1, SELECT: 1 }[a.tagName])) return;
            e.preventDefault();
            if (e.key === 'ArrowLeft') b.onPrev(); else b.onNext();
          });
        }

        // Bahan baku hak akses dari server (SATU sumber: Config.ROLE_PAGE_ACCESS
        // & Config.getAccessLevel, lihat WebAppRouter.doGet/app_getPageFragment)
        // — dipakai TechfordAccess di blok <script> besar bawah. Ditaruh di
        // sini (bukan di sana) supaya sudah tersedia SAAT PARSING kalau ada
        // fragment yang butuh cek akses sendiri sebelum bootstrap normal
        // jalan (lihat ConfigureAccountContent/MasterDataContent), sama
        // alasan dengan gsRunWithRetry/techfordOnReady di atas.
        var TECHFORD_ROLE_ACCESS = <?!= roleAccessMap ?>;
        var TECHFORD_HAS_MASTER_ADMIN = <?= hasMasterAdmin ?>;
        var TECHFORD_ACTIVE_PAGE = '<?= activePage ?>';

        /**
         * Gerbang hak akses per Role — KEMBARAN Config.getAccessLevel (Apps
         * Script tidak bisa berbagi 1 file antara server .gs dan client
         * HTML). Data mentahnya (TECHFORD_ROLE_ACCESS) dikirim server dari
         * SATU sumber yang sama, jadi yang perlu disamakan di sini cuma
         * logika pembacaannya, bukan daftar Role/halamannya sendiri.
         *
         * PENTING — ini gerbang UI, BUKAN keamanan sungguhan: platform ini
         * tidak punya sesi server per-user (lihat catatan TechfordAuth di
         * bawah), jadi google.script.run tidak pernah benar-benar tahu siapa
         * yang memanggil. Tujuannya menyembunyikan/mengunci tombol yang
         * tidak relevan untuk Role tertentu, konsisten dengan model
         * keamanan platform ini (pembatasan domain @kitabisa.com adalah
         * lapisan yang sungguhan).
         */
        var TechfordAccess = (function () {
          function currentRole() {
            var user = (typeof TechfordAuth !== 'undefined') ? TechfordAuth.getCurrentUser() : null;
            return user ? (user.Role || '') : '';
          }

          function levelFor(page) {
            // Break-glass: belum ada Master Admin aktif sama sekali (misal
            // baru migrasi dari Role bebas-ketik lama) — kedua halaman ini
            // dibuka sementara untuk siapa pun yang login, supaya ada jalan
            // menunjuk Master Admin pertama tanpa perlu edit sheet manual.
            if ((page === 'configure-account' || page === 'master-data') && !TECHFORD_HAS_MASTER_ADMIN) {
              return 'full';
            }
            var row = TECHFORD_ROLE_ACCESS[page];
            if (!row) return 'full';
            return row[currentRole()] || 'none';
          }

          function canOpen(page) { return levelFor(page) !== 'none'; }
          function isViewOnly(page) { return levelFor(page) === 'view'; }

          // Dipanggil setiap kali status master-admin/menu terbaru datang
          // dari server (login awal & tiap navigasi SPA) supaya break-glass
          // di atas selalu pakai data terkini, bukan snapshot doGet pertama.
          function refreshHasMasterAdmin(value) {
            if (typeof value === 'boolean') TECHFORD_HAS_MASTER_ADMIN = value;
          }

          /**
           * Sidebar tidak tahu Role sama sekali saat dirender server (lihat
           * catatan TechfordAuth) — begitu Role diketahui di browser, item
           * menu yang levelnya 'none' untuk Role itu disembunyikan dengan
           * pola YANG SAMA seperti fitur belum aktif (.nav-item-disabled),
           * supaya tampilannya konsisten dengan menu yang memang belum
           * dibangun.
           */
          function applySidebarLocks() {
            document.querySelectorAll('.sidebar-nav .nav-item[data-page]').forEach(function (el) {
              var page = el.getAttribute('data-page');
              if (canOpen(page)) return;
              el.classList.add('nav-item-disabled');
              el.removeAttribute('onclick');
              el.removeAttribute('href');
            });
          }

          // Tombol simpan/tambah/hapus di halaman "view" dikunci lewat SATU
          // class di <body> (lihat aturan .techford-view-only di Style.html)
          // — bukan mengedit tiap halaman satu-satu. Filter/pencarian/
          // paginasi/buka-drawer TETAP jalan (yang dikunci cuma kontrol yang
          // MENGUBAH data), supaya "hanya bisa melihat" tetap bisa
          // benar-benar melihat, bukan ikut terkunci.
          function applyBodyLock(page) {
            document.body.classList.toggle('techford-view-only', isViewOnly(page));
          }

          function enforceCurrentPage() {
            applySidebarLocks();
            applyBodyLock(TECHFORD_ACTIVE_PAGE);
            if (canOpen(TECHFORD_ACTIVE_PAGE)) return;
            var main = document.getElementById('mainContent');
            if (main) {
              main.innerHTML = '<div style="max-width:520px;margin:60px auto;text-align:center;color:var(--text-muted);">' +
                '<h2 style="margin-bottom:8px;">🔒 Akses ditolak</h2>' +
                '<p>Role Anda tidak memiliki akses ke halaman ini.</p></div>';
            }
          }

          return {
            currentRole: currentRole, levelFor: levelFor, canOpen: canOpen, isViewOnly: isViewOnly,
            refreshHasMasterAdmin: refreshHasMasterAdmin, applySidebarLocks: applySidebarLocks,
            applyBodyLock: applyBodyLock, enforceCurrentPage: enforceCurrentPage
          };
        })();
      </script>

  <script>
    // Karena arsitektur platform ini full-page-reload (bukan SPA), halaman
    // konten kadang perlu redirect ke halaman lain (misal Client Monitoring
    // -> Sales Pipeline setelah bikin draft project). webAppUrl di sini
    // sama persis dengan yang dipakai link sidebar (ScriptApp.getService().getUrl()),
    // supaya redirect juga selalu pakai URL absolut, bukan relatif.
    var TECHFORD_WEB_APP_URL = '<?= webAppUrl ?>';

    // Collapse sidebar SEKARANG jadi rail ikon-saja (~56px, lihat CSS
    // .sidebar-collapsed .sidebar di Style.html) alih-alih hilang total
    // seperti sebelumnya — tetap bisa diklik untuk pindah halaman, label
    // teksnya disembunyikan lewat CSS dan digantikan atribut title="..."
    // (sudah dipasang di setiap <a>, lihat markup sidebar) sebagai tooltip
    // native saat kursor diarahkan.
    function toggleSidebar() {
      document.querySelector('.app-shell').classList.toggle('sidebar-collapsed');
    }

    // Collapse/expand per grup modul di sidebar — status disimpan per grup
    // (key = nama grup) di localStorage supaya tetap collapse/expand yang
    // sama begitu pindah halaman (arsitektur app ini masih full-page-reload,
    // jadi state JS biasa akan hilang tiap navigasi kalau tidak disimpan).
    function navGroupStorageKey(groupName) { return 'techfordNavCollapsed:' + groupName; }
    function toggleNavGroup(labelEl) {
      var group = labelEl.parentElement;
      var collapsed = group.classList.toggle('collapsed');
      try { localStorage.setItem(navGroupStorageKey(group.getAttribute('data-group')), collapsed ? '1' : '0'); } catch (e) {}
    }
    (function restoreNavGroupState() {
      document.querySelectorAll('.nav-group').forEach(function (group) {
        // Grup yang sedang berisi menu aktif TIDAK di-collapse otomatis,
        // walau tersimpan collapsed di localStorage — supaya user selalu
        // langsung lihat halaman yang sedang dibuka di sidebar.
        if (group.querySelector('.nav-item-active')) return;
        try {
          if (localStorage.getItem(navGroupStorageKey(group.getAttribute('data-group'))) === '1') {
            group.classList.add('collapsed');
          }
        } catch (e) {}
      });

      // Auto-scroll ke grup yang sedang aktif — grup itu dijamin ter-expand
      // (baris di atas), tapi kalau daftar menu sudah panjang, posisinya
      // bisa saja berada di luar area sidebar yang terlihat tanpa scroll
      // manual. block:'nearest' supaya tidak scroll sama sekali kalau
      // grupnya memang sudah terlihat (menghindari jitter di halaman yang
      // grup aktifnya ada di paling atas).
      var activeGroup = document.querySelector('.nav-group .nav-item-active');
      if (activeGroup) {
        try { activeGroup.scrollIntoView({ block: 'nearest' }); } catch (e) {}
      }
    })();

    // Klik nama grup di breadcrumb topbar (mis. "Sales Module") -> expand
    // grup yang sama di sidebar (kalau sedang collapsed) lalu scroll ke
    // situ — menyatukan breadcrumb & sidebar yang sebelumnya menampilkan
    // info yang sama tapi berdiri sendiri-sendiri tanpa saling terhubung.
    function focusSidebarGroup(groupName) {
      var group = document.querySelector('.nav-group[data-group="' + groupName + '"]');
      if (!group) return;
      if (group.classList.contains('collapsed')) {
        group.classList.remove('collapsed');
        try { localStorage.setItem(navGroupStorageKey(groupName), '0'); } catch (e) {}
      }
      try { group.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
      group.classList.add('nav-group-flash');
      setTimeout(function () { group.classList.remove('nav-group-flash'); }, 900);
    }

    // ---- Kotak cari menu — filter item sidebar sambil mengetik ----
    // Sengaja TIDAK mengubah struktur data menu, cuma toggle display item &
    // grup yang cocok/tidak cocok. Grup yang punya minimal 1 item cocok
    // otomatis di-expand sementara (dikembalikan ke state localStorage
    // semula begitu pencarian dikosongkan) supaya hasil langsung terlihat
    // tanpa perlu klik expand manual.
    function filterSidebarMenu(query) {
      var q = String(query || '').trim().toLowerCase();
      document.getElementById('sidebarSearchClear').style.display = q ? '' : 'none';
      var groups = document.querySelectorAll('#sidebarNav .nav-group');
      groups.forEach(function (group) {
        var items = group.querySelectorAll('.nav-item, .nav-item-disabled');
        var anyMatch = false;
        items.forEach(function (el) {
          var label = (el.getAttribute('data-label') || el.textContent || '').toLowerCase();
          var match = !q || label.indexOf(q) !== -1;
          el.style.display = match ? '' : 'none';
          if (match) anyMatch = true;
        });
        group.style.display = (!q || anyMatch) ? '' : 'none';
        if (q) {
          if (anyMatch) group.classList.add('search-force-open');
        } else {
          group.classList.remove('search-force-open');
        }
      });
    }
    function clearSidebarSearch() {
      var input = document.getElementById('sidebarSearchInput');
      input.value = '';
      filterSidebarMenu('');
      input.focus();
    }

    // ---- Grup "Favorit" — pin menu yang paling sering dipakai ----
    // Disimpan di localStorage (per browser/device, bukan per akun — sama
    // level persistensi dengan status collapse grup di atas). Grup aslinya
    // di NavigationConfig.MENU TIDAK disentuh sama sekali; ini murni
    // menyalin (clone) node <a> yang sudah ada ke satu wadah baru di atas.
    var FAVORITE_STORAGE_KEY = 'techfordFavoriteNav';
    function getFavoriteNavPages() {
      try { return JSON.parse(localStorage.getItem(FAVORITE_STORAGE_KEY) || '[]'); } catch (e) { return []; }
    }
    function setFavoriteNavPages(pages) {
      try { localStorage.setItem(FAVORITE_STORAGE_KEY, JSON.stringify(pages)); } catch (e) {}
    }
    function toggleFavoriteNav(page) {
      var pages = getFavoriteNavPages();
      var idx = pages.indexOf(page);
      if (idx === -1) pages.push(page); else pages.splice(idx, 1);
      setFavoriteNavPages(pages);
      renderFavoriteNavGroup();
    }
    function renderFavoriteNavGroup() {
      var pages = getFavoriteNavPages();
      var wrap = document.getElementById('navGroupFavorite');
      var divider = document.getElementById('navGroupFavoriteDivider');
      var itemsHost = document.getElementById('navGroupFavoriteItems');
      if (!wrap || !itemsHost) return;
      itemsHost.innerHTML = '';
      var found = 0;
      pages.forEach(function (page) {
        var original = document.querySelector('#sidebarNav .nav-item[data-page="' + page + '"]');
        if (!original) return;
        found++;
        var clone = original.cloneNode(true);
        clone.classList.toggle('nav-item-active', original.classList.contains('nav-item-active'));
        var pinBtn = clone.querySelector('.nav-pin-btn');
        if (pinBtn) pinBtn.title = 'Lepas dari Favorit';
        clone.setAttribute('onclick', "return TechfordNav.onSidebarClick(event, '" + page + "');");
        itemsHost.appendChild(clone);
      });
      wrap.style.display = found ? '' : 'none';
      divider.style.display = found ? '' : 'none';
    }
    renderFavoriteNavGroup();

    // Pengaman terakhir sebelum aksi tulis (save/request/update) benar-benar
    // dikirim ke server — dipanggil dari halaman manapun (Sales Pipeline,
    // Document Pipeline, Master Data, Configure Account, dst) supaya user
    // selalu punya kesempatan Lanjut/Batal, bahkan untuk aksi yang di
    // halamannya sendiri tidak punya modal konfirmasi custom.
    function techfordConfirm(message) {
      return window.confirm(message);
    }

    // google.script.run kadang memanggil withSuccessHandler dengan res===null
    // walau server-nya sendiri sukses & tidak melempar error sama sekali —
    // glitch transport HtmlService, makin sering muncul kalau banyak
    // google.script.run ditembak paralel bersamaan (lihat bootstrap tiap
    // halaman yang fetch >5 hal sekaligus). Sebelumnya tiap halaman cuma
    // punya retry manual utk fetch PERTAMA saat bootstrap — begitu bootstrap
    // dianggap selesai, fetch berikutnya (refresh manual, sesudah simpan,
    // dsb) langsung nyerah di percobaan pertama begitu kena glitch ini,
    // sehingga tabel yang tadinya sudah terisi malah ditimpa pesan error.
    // Helper generik ini dipakai di SEMUA pemanggilan google.script.run
    // (bukan cuma bootstrap) supaya konsisten retry dulu sebelum benar2
    // dianggap gagal.
    // gsRunWithRetry SENGAJA didefinisikan di blok <script> kecil DI ATAS
    // <main>, bukan di sini — lihat komentar panjang di sana. Kalau
    // didefinisikan di blok ini, halaman yang dibuka dengan load penuh akan
    // memanggilnya sebelum baris ini sempat diparse.

    /**
     * TechfordNav — router SPA client-side. Dulu tiap klik menu sidebar
     * (atau navigasi antar halaman lewat tombol, mis. "Kerjakan COR") selalu
     * full browser reload (doGet render ulang Shell+Content dari nol).
     * Sekarang klik sidebar cukup fetch FRAGMENT (app_getPageFragment) lewat
     * google.script.run dan menukar isi #mainContent — sidebar/topbar/Shell
     * tidak pernah ikut ke-render ulang, sehingga pindah section terasa
     * instan tanpa reload URL (lihat app_getPageFragment di WebAppRouter.gs).
     *
     * Sengaja TIDAK mengurus history.pushState/popstate (tombol Back/Forward
     * browser tidak perlu bisa dipakai untuk pindah antar section — sudah
     * dikonfirmasi ke user) — history.replaceState hanya dipakai supaya URL
     * di address bar tetap mencerminkan halaman yang sedang dibuka (untuk
     * copy-paste/refresh manual), TANPA menambah entri history baru.
     */
    var TechfordNav = (function () {
      var navigating = false;
      // Cache fragment HTML per halaman (HANYA untuk navigasi sidebar biasa
      // tanpa param tambahan, mis. bukan cor-calculator/quotation-composer
      // yang isinya beda-beda per docId) — supaya kunjungan ULANG ke
      // halaman yang sama terasa instan (skip RPC round-trip sepenuhnya,
      // yang sebelumnya membuat perpindahan section masih terasa lebih
      // lambat dari referensi video walau sudah tanpa reload). Data di
      // dalam halaman itu SENDIRI tetap selalu di-fetch ulang segar setiap
      // kunjungan (lihat catatan execScripts) — yang di-cache cuma
      // shell/skeleton HTML-nya, bukan datanya.
      var fragmentCache = {};

      // Script yang disuntik lewat innerHTML TIDAK otomatis dieksekusi
      // browser — harus dibuat ulang sebagai elemen <script> baru di posisi
      // yang sama supaya benar-benar jalan. Semua halaman Content di app ini
      // konsisten pakai pola "if (document.readyState==='complete') initFn();
      // else window.addEventListener('load', initFn)" untuk bootstrap-nya —
      // karena readyState SELALU 'complete' di titik ini (dokumen utama sudah
      // lama selesai load), re-exec script itu otomatis men-trigger ulang
      // bootstrap halaman tanpa perlu convention/hook baru sama sekali.
      function execScripts(container) {
        var oldScripts = container.querySelectorAll('script');
        for (var i = 0; i < oldScripts.length; i++) {
          var oldScript = oldScripts[i];
          var newScript = document.createElement('script');
          for (var a = 0; a < oldScript.attributes.length; a++) {
            newScript.setAttribute(oldScript.attributes[a].name, oldScript.attributes[a].value);
          }
          newScript.text = oldScript.text;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        }
      }

      function setActiveSidebarLink(page) {
        document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (a) {
          a.classList.toggle('nav-item-active', a.getAttribute('data-page') === page);
        });
        // Grup Favorit dirakit dari clone node #sidebarNav (lihat
        // renderFavoriteNavGroup di atas) — perlu dirakit ulang supaya
        // highlight halaman aktif ikut tampil di sana juga, bukan cuma di
        // grup aslinya.
        if (typeof renderFavoriteNavGroup === 'function') renderFavoriteNavGroup();
      }

      // Badge notifikasi (mis. jumlah New Leads) dihitung server-side setiap
      // fragment di-fetch (lihat buildMenuWithBadges) — kalau tidak
      // disinkronkan lagi ke sidebar di sini, angkanya akan tertinggal/stale
      // setelah navigasi SPA (dulu selalu ikut ter-render ulang karena
      // seluruh Shell reload tiap pindah halaman).
      function syncSidebarBadges(menu) {
        (menu || []).forEach(function (group) {
          (group.items || []).forEach(function (item) {
            var link = document.querySelector('.sidebar-nav .nav-item[data-page="' + item.page + '"]');
            if (!link) return;
            var badgeEl = link.querySelector('.nav-badge');
            if (item.badge) {
              if (!badgeEl) {
                badgeEl = document.createElement('span');
                badgeEl.className = 'nav-badge';
                link.insertBefore(badgeEl, link.querySelector('.nav-pin-btn'));
              }
              badgeEl.innerText = item.badge;
            } else if (badgeEl) {
              badgeEl.remove();
            }
          });
        });
        if (typeof renderFavoriteNavGroup === 'function') renderFavoriteNavGroup();
      }

      function applyFragment(page, params, res) {
        // Beberapa halaman menandai <body class="drawer-open"> saat drawer-nya
        // terbuka (supaya body tidak ikut scroll) — <body> milik Shell, BUKAN
        // bagian dari #mainContent yang ditukar, jadi TIDAK ikut ter-reset
        // otomatis seperti dulu (full page reload). Kalau user pindah section
        // sementara drawer masih terbuka, class ini harus dilepas manual di
        // sini supaya halaman berikutnya tidak "kebawa" body terkunci scroll.
        document.body.classList.remove('drawer-open');

        var mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = res.data.contentHtml;
        execScripts(mainContent);

        document.title = 'Techford Platform - ' + res.data.pageTitle;
        var breadcrumbHtml = '';
        if (res.data.breadcrumbGroup) breadcrumbHtml += '<span class="breadcrumb-muted">' + res.data.breadcrumbGroup + '</span><span class="breadcrumb-sep">›</span>';
        if (res.data.breadcrumbParent) breadcrumbHtml += '<span class="breadcrumb-muted">' + res.data.breadcrumbParent + '</span><span class="breadcrumb-sep">›</span>';
        breadcrumbHtml += '<span class="breadcrumb-current">' + res.data.pageTitle + '</span>';
        document.getElementById('topbarBreadcrumb').innerHTML = breadcrumbHtml;
        document.getElementById('topbarActions').innerHTML = res.data.headerActions || '';
        var helpWrap = document.getElementById('topbarHelpWrap');
        helpWrap.style.display = res.data.helpText ? '' : 'none';
        document.getElementById('topbarHelpText').innerHTML = res.data.helpText || '';

        setActiveSidebarLink(page);
        syncSidebarBadges(res.data.menu);

        TECHFORD_ACTIVE_PAGE = page;
        TechfordAccess.refreshHasMasterAdmin(res.data.hasMasterAdmin);
        TechfordAccess.applySidebarLocks();
        TechfordAccess.applyBodyLock(page);

        // Cosmetic saja (lihat catatan class TechfordNav) — tidak membuat
        // entri history baru, jadi tidak mengubah perilaku tombol Back.
        try {
          var qs = Object.keys(params || {}).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); });
          qs.unshift('page=' + encodeURIComponent(page));
          history.replaceState(null, '', TECHFORD_WEB_APP_URL + '?' + qs.join('&'));
        } catch (e) {}

        mainContent.classList.remove('spa-loading');
        navigating = false;
      }

      function fetchFragment(page, params, onSuccess, onFailure) {
        gsRunWithRetry('app_getPageFragment', [page, params || {}], function (res) {
          if (!res || !res.ok) { onFailure((res && res.error && res.error.message) || 'Tidak ada respons dari server, silakan coba lagi.'); return; }
          onSuccess(res);
        }, function (err) {
          onFailure(err && err.message ? err.message : err);
        });
      }

      function navigateTo(page, params) {
        if (navigating) return;
        if (!TechfordAccess.canOpen(page)) {
          alert('Role Anda tidak memiliki akses ke halaman ini.');
          return;
        }
        params = params || {};
        var cacheKey = Object.keys(params).length === 0 ? page : null;
        var mainContent = document.getElementById('mainContent');

        if (cacheKey && fragmentCache[cacheKey]) {
          // Instan — langsung pakai HTML shell yang sudah pernah di-fetch,
          // tanpa nunggu RPC sama sekali. Bootstrap halaman (execScripts)
          // tetap jalan seperti biasa jadi datanya tetap selalu segar.
          applyFragment(page, params, { data: fragmentCache[cacheKey] });
          // Refresh cache + badge sidebar diam-diam di background — TIDAK
          // menyentuh #mainContent lagi (supaya tidak menimpa input yang
          // sedang diketik user kalau mereka masih di halaman ini saat
          // respons ini datang balik).
          fetchFragment(page, params, function (res) {
            fragmentCache[cacheKey] = res.data;
            syncSidebarBadges(res.data.menu);
          }, function () {});
          return;
        }

        navigating = true;
        mainContent.classList.add('spa-loading');
        fetchFragment(page, params, function (res) {
          if (cacheKey) fragmentCache[cacheKey] = res.data;
          applyFragment(page, params, res);
        }, function (message) {
          mainContent.classList.remove('spa-loading');
          navigating = false;
          alert('Gagal memuat halaman: ' + message);
        });
      }

      function onSidebarClick(event, page) {
        // Klik dengan modifier (buka tab baru dst) atau klik kanan tetap
        // pakai perilaku link normal (href), tidak dicegat router.
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button === 1) return true;
        event.preventDefault();
        navigateTo(page, {});
        return false;
      }

      return { navigateTo: navigateTo, onSidebarClick: onSidebarClick };
    })();

    // Freeze halaman selama proses save/update/request ke server sedang
    // berjalan (dipanggil di setiap aksi tulis, sebelum google.script.run
    // dikirim, lalu di-hide lagi di success/failure handler-nya) — pakai
    // counter supaya aman kalau ada beberapa proses tumpang tindih (hide
    // hanya benar-benar menutup overlay kalau semua proses sudah selesai).
    var TechfordLoading = (function () {
      var pending = 0;
      function show(message) {
        pending++;
        var overlay = document.getElementById('techfordLoadingOverlay');
        if (!overlay) return;
        document.getElementById('techfordLoadingText').innerText = message || 'Memproses...';
        overlay.classList.add('open');
      }
      function hide() {
        pending = Math.max(0, pending - 1);
        if (pending > 0) return;
        var overlay = document.getElementById('techfordLoadingOverlay');
        if (overlay) overlay.classList.remove('open');
      }
      function reset() {
        pending = 0;
        var overlay = document.getElementById('techfordLoadingOverlay');
        if (overlay) overlay.classList.remove('open');
      }
      return { show: show, hide: hide, reset: reset };
    })();
    // Kalau user pindah halaman (full page reload) sementara overlay masih
    // terbuka, pastikan tidak "nyangkut" ke render halaman berikutnya.
    window.addEventListener('beforeunload', function () { TechfordLoading.reset(); });

    /**
     * TechfordToast — notifikasi ringan yang muncul sebentar di pojok
     * kanan atas lalu hilang sendiri, TIDAK memblokir alur kerja (beda
     * dari #techfordSuccessModal/alert() yang harus diklik OK dulu).
     * Dipakai KHUSUS untuk konfirmasi ringan/tidak kritis (misal "Realisasi
     * berhasil dicatat") — error & konfirmasi berisiko tetap pakai modal
     * biasa. Lihat artefak "Techford — Usulan Sistem Desain".
     */
    var TechfordToast = (function () {
      function show(message, tone) {
        var host = document.getElementById('toastHost');
        if (!host) return;
        var el = document.createElement('div');
        el.className = 'toast-item';
        var markClass = tone === 'bad' ? 'toast-bad' : 'toast-ok';
        var mark = tone === 'bad' ? '✕' : '✓';
        el.innerHTML = '<span class="' + markClass + '">' + mark + '</span><span></span>';
        el.querySelector('span:last-child').innerText = message;
        host.appendChild(el);
        requestAnimationFrame(function () { el.classList.add('show'); });
        setTimeout(function () {
          el.classList.remove('show');
          setTimeout(function () { el.remove(); }, 250);
        }, 3000);
      }
      return { show: show };
    })();

    // Warna avatar inisial ("dicatat oleh", dst) — dihitung dari nama
    // supaya 1 orang selalu dapat warna yang sama di seluruh app, tanpa
    // perlu disimpan di database. Palet dipilih dari turunan warna brand
    // (cerulean) supaya tetap "satu keluarga" walau warnanya bervariasi.
    var TECHFORD_AVATAR_PALETTE = ['#0A6E96', '#10A8E5', '#3A3A3A', '#6B7280', '#0E7C86', '#7C5CBF'];
    function techfordAvatarColor(name) {
      var str = String(name || '?');
      var hash = 0;
      for (var i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
      return TECHFORD_AVATAR_PALETTE[hash % TECHFORD_AVATAR_PALETTE.length];
    }
    function techfordAvatarInitial(name) {
      return String(name || '?').trim().charAt(0).toUpperCase() || '?';
    }
    function techfordAvatarHtml(name) {
      return '<div class="avatar-initial" style="background:' + techfordAvatarColor(name) + ';">' + techfordAvatarInitial(name) + '</div>';
    }

    /**
     * CorCalc — kalkulasi & rendering laporan COR, dipakai BERSAMA oleh
     * halaman Kalkulator COR (Download PDF, dari state live yang sedang
     * diedit) dan Document Pipeline (tombol "Lihat COR", dari draft
     * tersimpan lewat cor_getDraft) — satu sumber logika supaya angka di
     * kedua tempat itu selalu konsisten, tidak dobel-tulis rumus yang
     * sama di 2 file berbeda.
     */
    var CorCalc = (function () {
      function ri(n) { return isNaN(n) || !isFinite(n) ? 0 : Math.round(n); }
      function fmtRp(n) { return 'Rp' + ri(n).toLocaleString('id-ID'); }
      function esc(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      function pphRate(kat, tipe) {
        if (kat === 'Jasa') { if (tipe === 'Lembaga') return 0.02; if (tipe === 'Individu') return 0.025; }
        return 0;
      }
      // Baris rincian tanpa nominal (metode Standalone dengan Item) bernilai
      // nol untuk semuanya — KEMBARAN PERSIS dari CorReportRenderer.calcItemRow
      // di server; kalau salah satu berubah, samakan keduanya.
      function calcItemRow(item) {
        if (item && String(item.rowRole || '') === 'ITEM') {
          return { total: 0, rt: 0, tap: 0, priced: false };
        }
        var total = ri((item.harga || 0) * (item.qty || 1) * (item.periode || 1));
        var rt = pphRate(item.kategori, item.tipe);
        var tap = rt > 0 ? total / (1 - rt) : total;
        return { total: total, rt: rt, tap: tap, priced: true };
      }
      function adminFee(bankRate, afterFee) {
        if (!afterFee || afterFee <= 0) return 0;
        return Math.ceil(afterFee / 200000000) * (bankRate || 0);
      }
      function fundCalc(f, biayaPencairan) {
        // Platform Fee nol saat Zakat/Bencana — Tech Fee TETAP terhitung (1%
        // dari nominal) baik Zakat/Bencana atau bukan, kecuali admin mengetik
        // nominalnya sendiri (Tech_Fee_Manual, lihat CorService.saveDraft).
        var pf = f.fundType === 'CLIENT' && !f.isZakat ? ri(f.nominal * 0.05) : 0;
        var tf = f.fundType === 'CLIENT'
          ? (f.techFeeManual ? ri(Number(f.manualTechFee) || 0) : ri(f.nominal * 0.01))
          : 0;
        var af = f.nominal - pf - tf;
        var adm = adminFee(biayaPencairan, af);
        return { pf: pf, tf: tf, af: af, adm: adm, total: af - adm };
      }
      function totalMarginPct(marginState, marginComponents) {
        var sum = 0;
        (marginComponents || []).forEach(function (c) {
          sum += (marginState[c.key] ? (Number(marginState[c.key].percentage) || 0) : 0) / 100;
        });
        return sum;
      }

      /** @param opts {funds, salItems, baaItems, margin, marginComponents, isViaSalset, ngoRatePct, biayaSalset, pkp, pphOn, biayaPencairan} */
      function computeGD(opts) {
        var totalMasuk = 0;
        (opts.funds || []).forEach(function (f) { totalMasuk += fundCalc(f, opts.biayaPencairan).total; });

        var cashGross = totalMasuk, salFee = 0, sisaDana = 0;
        if (opts.isViaSalset) {
          salFee = ri(totalMasuk * ((opts.ngoRatePct || 10) / 100));
          sisaDana = totalMasuk - salFee;
          cashGross = sisaDana - (Number(opts.biayaSalset) || 0);
        }
        var ppnGd = opts.pkp ? ri(cashGross / 1.11) : cashGross;
        var pph23 = opts.pphOn ? ri(ppnGd * 0.02) : 0;
        var cashNet = ppnGd - pph23;
        // Default Margin bisa dimatikan (marginEnabled=false -> tidak ada profit
        // diambil di muka, availCost jadi = cashNet, persis "Cash In Vendor"
        // langsung jadi acuan Cost Vendor) atau diisi manual (marginMode
        // 'MANUAL' -> satu angka Total Margin %, dropdown komponen diabaikan).
        // opts.marginEnabled/marginMode sengaja opsional (undefined) supaya
        // pemanggil lama (computeGU, tes) tetap dapat perilaku SEBELUM toggle
        // ini ada: pakai komponen, seperti biasa.
        var totalMgnFrac;
        if (opts.marginEnabled === false) {
          totalMgnFrac = 0;
        } else if (opts.marginMode === 'MANUAL') {
          totalMgnFrac = (Number(opts.manualMarginPct) || 0) / 100;
        } else {
          totalMgnFrac = totalMarginPct(opts.margin, opts.marginComponents);
        }
        var profit = ri(cashNet * totalMgnFrac);
        var availCost = cashNet - profit;

        var salCalc = (opts.salItems || []).map(calcItemRow);
        var baaCalc = (opts.baaItems || []).map(calcItemRow);
        var totalSal = ri(salCalc.reduce(function (s, r) { return s + r.tap; }, 0));
        var totalBaa = ri(baaCalc.reduce(function (s, r) { return s + r.tap; }, 0));
        var totalSalRaw = ri(salCalc.reduce(function (s, r) { return s + r.total; }, 0));
        var totalBaaRaw = ri(baaCalc.reduce(function (s, r) { return s + r.total; }, 0));

        var dpp = ppnGd;
        var ppn11 = opts.pkp ? ri(dpp * 0.11) : 0;
        var pphSpp = opts.pphOn ? ri(dpp * 0.02) : 0;
        var neto = dpp - pphSpp;
        var pmProfit = cashNet - totalBaa;
        var pmPct = cashNet > 0 ? pmProfit / cashNet : 0;

        return {
          totalMasuk: totalMasuk, cashGross: cashGross, salFee: salFee, sisaDana: sisaDana,
          ppnGd: ppnGd, pph23: pph23, cashNet: cashNet, totalMgnFrac: totalMgnFrac, profit: profit, availCost: availCost,
          totalSal: totalSal, totalBaa: totalBaa, totalSalRaw: totalSalRaw, totalBaaRaw: totalBaaRaw,
          dpp: dpp, ppn11: ppn11, pphSpp: pphSpp, neto: neto, pmProfit: pmProfit, pmPct: pmPct,
          budSal: opts.isViaSalset ? (Number(opts.biayaSalset) || 0) : 0
        };
      }

      /** @param opts {salItems, baaItems, margin, marginComponents, isViaSalset, ngoRatePct, pkp, biayaPencairan} */
      function computeGU(opts) {
        var ngoRateFrac = (opts.ngoRatePct || 10) / 100;
        var salCalc = (opts.salItems || []).map(calcItemRow);
        var baaCalc = (opts.baaItems || []).map(calcItemRow);
        var totalGuSal = ri(salCalc.reduce(function (s, r) { return s + r.tap; }, 0));
        var totalGuBaa = ri(baaCalc.reduce(function (s, r) { return s + r.tap; }, 0));
        var totalGuSalRaw = ri(salCalc.reduce(function (s, r) { return s + r.total; }, 0));
        var totalGuBaaRaw = ri(baaCalc.reduce(function (s, r) { return s + r.total; }, 0));
        var guTotalMgnFrac = totalMarginPct(opts.margin, opts.marginComponents);
        var salGu = opts.isViaSalset ? totalGuSal / (1 - ngoRateFrac) : 0;
        var guMargin = guTotalMgnFrac < 1 ? totalGuBaa / (1 - guTotalMgnFrac) : totalGuBaa;
        var guPph = guMargin / 0.98;
        var guPpn = opts.pkp ? guPph * 1.11 : guPph;
        var guBaa, totalHasilGu;
        if (opts.isViaSalset) { guBaa = guPpn / (1 - ngoRateFrac); totalHasilGu = salGu + guBaa; }
        else { guBaa = guPpn; totalHasilGu = guPpn; }
        var guAdmin = adminFee(opts.biayaPencairan, totalHasilGu);
        var guFinal = (totalHasilGu + guAdmin) / 0.94;
        var guDpp = guPph;
        var guPpn11 = opts.pkp ? ri(guDpp * 0.11) : 0;
        var guPphSpp = ri(guDpp * 0.02);
        var guNeto = guDpp - guPphSpp;
        var guProfit = guMargin - totalGuBaa;
        var guSalFee = opts.isViaSalset ? ri(totalHasilGu * ngoRateFrac) : 0;

        return {
          totalGuSal: totalGuSal, totalGuBaa: totalGuBaa, totalGuSalRaw: totalGuSalRaw, totalGuBaaRaw: totalGuBaaRaw,
          guTotalMgnFrac: guTotalMgnFrac, salGu: salGu, guMargin: guMargin, guPph: guPph, guPpn: guPpn,
          guBaa: guBaa, totalHasilGu: totalHasilGu, guAdmin: guAdmin, guFinal: guFinal,
          guDpp: guDpp, guPpn11: guPpn11, guPphSpp: guPphSpp, guNeto: guNeto, guProfit: guProfit, guSalFee: guSalFee
        };
      }

      // ---- HTML builder (dipakai preview modal & Download PDF) ----
      var REPORT_CSS =
        '.cor-report{font-family:Arial,sans-serif;font-size:12px;color:#1a1a1a;}' +
        '.cor-report h1{font-size:20px;margin:0 0 4px;}' +
        '.cor-report h2{font-size:14px;margin:20px 0 6px;border-bottom:2px solid #333;padding-bottom:4px;}' +
        '.cor-report h3{font-size:12px;margin:10px 0 4px;color:#555;}' +
        '.cor-report table{width:100%;border-collapse:collapse;margin-bottom:6px;border:1px solid #ccc;}' +
        '.cor-report .pdf-tbl{table-layout:fixed;}' +
        '.cor-report .pdf-tbl th,.cor-report .pdf-tbl td{border:1px solid #ccc;padding:5px 7px;font-size:11px;text-align:left;overflow-wrap:break-word;word-break:break-word;}' +
        '.cor-report .pdf-tbl th{background:#f2f2f2;}' +
        '.cor-report .pdf-tbl td.nw,.cor-report .pdf-tbl th.nw{white-space:nowrap;overflow-wrap:normal;word-break:normal;}' +
        '.cor-report .pdf-tbl td.r,.cor-report .pdf-meta td.r{text-align:right;}' +
        '.cor-report .pdf-tbl tfoot td{background:#f8f8f8;font-weight:700;}' +
        '.cor-report .pdf-meta td{padding:5px 7px;font-size:12px;border:1px solid #ccc;}' +
        '.cor-report .pdf-label{font-weight:700;width:260px;color:#444;background:#f8f8f8;}' +
        '.cor-report .pdf-empty{color:#999;font-style:italic;text-align:center;}' +
        '.cor-report .pdf-note{background:#fff3cd;border:1px solid #ffe69c;padding:8px 10px;border-radius:6px;font-size:11px;}' +
        '.cor-report .pdf-zakat-note{font-style:italic;font-size:10.5px;color:#666;margin:2px 0 10px;}' +
        '.cor-report textarea{width:100%;}';

      function pdfRow(label, value) {
        return '<tr><td class="pdf-label">' + label + '</td><td class="pdf-value">' + value + '</td></tr>';
      }
      // Lebar kolom DITENTUKAN tetap (persis seperti resize manual kolom di
      // spreadsheet) supaya garis antar baris/tabel rapi konsisten — bukan
      // fit-to-content, isi yang kepanjangan cukup wrap ke bawah.
      // Kolom Zakat DIHAPUS (jadi catatan italic di bawah tabel, lihat
      // zakatNoteHtml) — diganti Biaya Admin. KEMBARAN dari CorReportRenderer.
      var FUND_COLS = [22, 14, 14, 14, 14, 22];
      // 8 kolom — TANPA "Metode". KEMBARAN dari CorReportRenderer.
      var COST_COLS = [13, 18, 7, 9, 6, 21, 13, 13];
      var COST_HEADERS = ['Kategori', 'Item', 'Jenis', 'Tipe', 'PPh',
        'Harga x Qty x Periode', 'Total', 'Total stlh PPh'];
      var MARGIN_COLS = [28, 40, 10, 22];
      var MARGIN_COLS_3COL = [35, 45, 20];
      function colgroup(widths) {
        return '<colgroup>' + widths.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>';
      }
      // nwFlags: array boolean paralel dengan headers — kolom angka tidak
      // boleh wrap. KEMBARAN dari CorReportRenderer.tblHead.
      function tblHead(headers, widths, nwFlags) {
        return (widths ? colgroup(widths) : '') +
          '<thead><tr>' + headers.map(function (h, i) {
            return '<th' + (nwFlags && nwFlags[i] ? ' class="nw"' : '') + '>' + h + '</th>';
          }).join('') + '</tr></thead>';
      }
      function nwCell(html, alignRight) {
        return '<td class="nw' + (alignRight ? ' r' : '') + '">' + html + '</td>';
      }
      var FUND_NW = [false, true, true, true, true, true];
      function fundRowsHtml(rows, biayaPencairan) {
        if (!rows.length) return '<tr><td colspan="6" class="pdf-empty">Tidak ada data.</td></tr>';
        return rows.map(function (f) {
          var c = fundCalc(f, biayaPencairan);
          return '<tr><td>' + esc(f.linkCampaign || '-') + '</td>' +
            nwCell(fmtRp(f.nominal), true) + nwCell(fmtRp(c.pf), true) + nwCell(fmtRp(c.tf), true) +
            nwCell(fmtRp(c.adm), true) + nwCell(fmtRp(c.total), true) + '</tr>';
        }).join('');
      }
      // KEMBARAN dari CorReportRenderer.zakatNoteHtml.
      function zakatNoteHtml(rows) {
        var zakatRows = (rows || []).filter(function (f) { return f.isZakat; });
        if (!zakatRows.length) return '';
        return '<p class="pdf-zakat-note">' +
          zakatRows.map(function (f) { return '*' + esc(f.linkCampaign || '-') + ' campaign zakat/bencana.'; }).join('<br>') +
          '</p>';
      }
      // KEMBARAN dari CorReportRenderer.campaignFundKindNoteHtml — label
      // di-hardcode di sini juga (WAJIB sama dengan Config.COR_CAMPAIGN_FUND_KIND
      // & kembarannya di server), karena file ini pun tidak boleh bergantung
      // pada Config server-side.
      var CAMPAIGN_FUND_KIND_LABEL = { DBT: 'DBT', FRAUD: 'Fraud', CLIENT: 'Client' };
      function campaignFundKindNoteHtml(rows) {
        var ditandai = (rows || []).filter(function (f) { return CAMPAIGN_FUND_KIND_LABEL[f.campaignFundKind]; });
        if (!ditandai.length) return '';
        return '<p class="pdf-zakat-note">' +
          ditandai.map(function (f) {
            return '*' + esc(f.linkCampaign || '-') + ' — sumber dana ' + CAMPAIGN_FUND_KIND_LABEL[f.campaignFundKind] + '.';
          }).join('<br>') +
          '</p>';
      }
      // KEMBARAN dari CorReportRenderer.fundSubtotalFoot/fundTableHtml/
      // grandFundTotalHtml — tfoot SATU tabel yang sama supaya border-nya
      // sejajar dengan grid tabel di atasnya.
      function fundSubtotalFoot(label, subtotal) {
        return '<tfoot><tr><td colspan="4">' + esc(label) + '</td>' +
          '<td colspan="2" class="r nw">' + fmtRp(subtotal) + '</td></tr></tfoot>';
      }
      function fundTableHtml(heading, rows, biayaPencairan, subtotalLabel) {
        var subtotal = rows.reduce(function (s, f) { return s + fundCalc(f, biayaPencairan).total; }, 0);
        return '<h3>' + esc(heading) + '</h3><table class="pdf-tbl">' +
          tblHead(['Link Campaign', 'Nominal', 'Platform Fee', 'Tech Fee', 'Biaya Admin', 'Total Masuk'], FUND_COLS, FUND_NW) +
          '<tbody>' + fundRowsHtml(rows, biayaPencairan) + '</tbody>' +
          fundSubtotalFoot(subtotalLabel, subtotal) +
          '</table>' + zakatNoteHtml(rows) + campaignFundKindNoteHtml(rows);
      }
      function grandFundTotalHtml(totalMasuk) {
        return '<table class="pdf-tbl">' + colgroup(FUND_COLS) + '<tbody><tr style="background:#f8f8f8;font-weight:700;">' +
          '<td colspan="4">Total Dana Masuk</td>' +
          '<td colspan="2" class="r nw">' + fmtRp(totalMasuk) + '</td>' +
          '</tr></tbody></table>';
      }
      // Kelompokkan jadi blok kategori (Metode & Kategori di-rowspan) —
      // KEMBARAN PERSIS dari CorReportRenderer.groupCostRows di server.
      function groupCostRows(rows) {
        var byCat = {};
        var order = [];
        (rows || []).forEach(function (r, i) {
          var mode = String(r.mode || 'GROUPED');
          var catKey = (r.categoryOrder === undefined || r.categoryOrder === null || r.categoryOrder === '')
            ? ('row' + i) : String(r.categoryOrder);
          var key = mode + '::' + catKey + '::' + String(r.category || '');
          if (!byCat[key]) {
            byCat[key] = { mode: mode, category: String(r.category || ''), items: [] };
            order.push(key);
          }
          byCat[key].items.push(r);
        });
        return order.map(function (k) {
          var g = byCat[k];
          g.items = g.items.slice().sort(function (a, b) {
            return (String(a.rowRole || '') === 'ITEM' ? 1 : 0) - (String(b.rowRole || '') === 'ITEM' ? 1 : 0);
          });
          return g;
        });
      }
      // KEMBARAN PERSIS dari CorReportRenderer.costRowsHtml — lihat catatan
      // panjang di sana soal merge kolom Standalone + Item.
      var COST_NW = [false, false, true, true, true, true, true, true];
      function costRowsHtml(rows) {
        var groups = groupCostRows(rows);
        if (!groups.length) return '<tr><td colspan="8" class="pdf-empty">Tidak ada data.</td></tr>';
        return groups.map(function (g) {
          var priceRow = g.items[0];
          var pc = calcItemRow(priceRow);
          return g.items.map(function (r, ii) {
            var leadKategori = ii > 0 ? '' : '<td rowspan="' + g.items.length + '">' + esc(g.category || '-') + '</td>';

            if (g.mode === 'STANDALONE_ITEM') {
              var label = r.label || (ii === 0 ? 'Nominal kategori' : '-');
              var numeric = ii > 0 ? '' :
                nwCell(esc(priceRow.kategori)).replace('<td class="nw">', '<td class="nw" rowspan="' + g.items.length + '">') +
                nwCell(esc(priceRow.tipe || '-')).replace('<td class="nw">', '<td class="nw" rowspan="' + g.items.length + '">') +
                nwCell(pc.rt > 0 ? (pc.rt * 100).toFixed(1) + '%' : '-', true).replace('<td class="nw r">', '<td class="nw r" rowspan="' + g.items.length + '">') +
                nwCell(fmtRp(priceRow.harga) + ' &times; ' + priceRow.qty + ' &times; ' + priceRow.periode, true).replace('<td class="nw r">', '<td class="nw r" rowspan="' + g.items.length + '">') +
                nwCell(fmtRp(pc.total), true).replace('<td class="nw r">', '<td class="nw r" rowspan="' + g.items.length + '">') +
                nwCell(fmtRp(pc.tap), true).replace('<td class="nw r">', '<td class="nw r" rowspan="' + g.items.length + '">');
              return '<tr>' + leadKategori + '<td>' + esc(label) + '</td>' + numeric + '</tr>';
            }

            var c = calcItemRow(r);
            var labelBiasa = r.label || '-';
            return '<tr>' + leadKategori + '<td>' + esc(labelBiasa) + '</td>' +
              nwCell(esc(r.kategori)) + nwCell(esc(r.tipe || '-')) +
              nwCell(c.rt > 0 ? (c.rt * 100).toFixed(1) + '%' : '-', true) +
              nwCell(fmtRp(r.harga) + ' &times; ' + r.qty + ' &times; ' + r.periode, true) +
              nwCell(fmtRp(c.total), true) + nwCell(fmtRp(c.tap), true) + '</tr>';
          }).join('');
        }).join('');
      }
      // KEMBARAN dari CorReportRenderer.costTableHtml — Total di tfoot SATU
      // angka saja (nilai setelah PPh), bukan tabel pdf-meta terpisah.
      function costTableHtml(heading, rows, totalAfterPph) {
        return '<h2>' + esc(heading) + '</h2><table class="pdf-tbl">' +
          tblHead(COST_HEADERS, COST_COLS, COST_NW) +
          '<tbody>' + costRowsHtml(rows) + '</tbody>' +
          '<tfoot><tr><td colspan="7">Total</td><td class="r nw">' + fmtRp(totalAfterPph) + '</td></tr></tfoot>' +
          '</table>';
      }
      function marginTableHtml(marginState, marginComponents, base, showNominal) {
        return marginComponents.map(function (c) {
          var m = marginState[c.key] || { subCategory: '-', percentage: 0 };
          var row = '<tr><td>' + c.label + '</td><td>' + esc(m.subCategory) + '</td><td class="r">' + m.percentage + '%</td>';
          if (showNominal) {
            var nominal = base * ((Number(m.percentage) || 0) / 100);
            row += '<td class="r">' + fmtRp(nominal) + '</td>';
          }
          return row + '</tr>';
        }).join('');
      }

      /**
       * @param model {
       *   docLabel, projectLabel, method, isViaSalset, vendorEntity, entity,
       *   pkp, ngoRatePct, guNgoRatePct, linkCampaigns,
       *   blocks: [{ tabLabel, funds, salItems, baaItems, margin }] — 1 blok
       *     untuk non-mix, 2 blok (Client & Campaign) untuk Mix Fund.
       *   marginComponents
       * }
       * @returns {string} HTML (isi saja, TANPA <html>/<head>/<body>) — bungkus
       *   sendiri dalam elemen ber-class "cor-report" + sisipkan REPORT_CSS.
       */
      function renderDocumentHtml(model) {
        var isGD = model.method === 'GROSS_DOWN';
        var title = 'COST OF REVENUE — ' + (isGD ? 'Gross Down' : 'Gross Up');
        var biayaPencairan = Number(model.entity.Biaya_Pencairan) || 0;

        var html = '<h1>' + title + '</h1><table class="pdf-meta"><tbody>' +
          pdfRow('Dokumen', model.docLabel) +
          pdfRow('Project', model.projectLabel) +
          pdfRow('Via SALSET', model.isViaSalset ? 'Ya' : 'Tidak') +
          pdfRow('Vendor', model.vendorEntity || '-') +
          pdfRow('Bank Aktif', model.entity.Entity_Name + ' (' + model.entity.Bank + ')') +
          pdfRow('Vendor PKP', model.pkp ? 'Ya' : 'Tidak') +
          '</tbody></table>';

        model.blocks.forEach(function (block) {
          if (block.tabLabel) html += '<h2 style="border-bottom-color:#0b6;">COR Dana ' + block.tabLabel + '</h2>';

          if (isGD) {
            var pphOn = model.isViaSalset || block.funds.some(function (f) { return f.fundType === 'CLIENT'; });
            var gd = computeGD({
              funds: block.funds, salItems: block.salItems, baaItems: block.baaItems,
              margin: block.margin, marginComponents: model.marginComponents,
              marginEnabled: model.marginEnabled, marginMode: model.marginMode, manualMarginPct: model.manualMarginPct,
              isViaSalset: model.isViaSalset, ngoRatePct: model.ngoRatePct, biayaSalset: model.biayaSalset,
              pkp: model.pkp, pphOn: pphOn, biayaPencairan: biayaPencairan
            });

            var danaClientRows = block.funds.filter(function (f) { return f.fundType === 'CLIENT'; });
            var danaCampaignRows = block.funds.filter(function (f) { return f.fundType === 'CAMPAIGN'; });
            html += '<h2>Source of Fund</h2>' +
              fundTableHtml('Dana Client', danaClientRows, biayaPencairan, 'Total Dana Client') +
              fundTableHtml('Dana Campaign', danaCampaignRows, biayaPencairan, 'Total Dana Campaign') +
              grandFundTotalHtml(gd.totalMasuk);

            if (model.isViaSalset) {
              html += '<h2>Implementation Fund (via SALSET)</h2><table class="pdf-meta"><tbody>' +
                pdfRow('SALSET Cash In (Gross)', fmtRp(gd.totalMasuk)) +
                pdfRow('NGO Fee Rate', model.ngoRatePct + '%') +
                pdfRow('SALSET Fee', fmtRp(gd.salFee)) +
                pdfRow('Sisa Dana', fmtRp(gd.sisaDana)) +
                '</tbody></table>';
            }

            html += '<h2>Fund Detail</h2><table class="pdf-meta"><tbody>' +
              (model.isViaSalset ? pdfRow('Biaya Pengeluaran SALSET', fmtRp(model.biayaSalset)) : '') +
              pdfRow('Cash In ' + model.vendorEntity + ' (Gross)', fmtRp(gd.cashGross)) +
              pdfRow('PPN Gross Down', fmtRp(gd.ppnGd)) +
              pdfRow('PPh 23 (2%)', fmtRp(gd.pph23)) +
              pdfRow('Cash In ' + model.vendorEntity + ' (Net)', fmtRp(gd.cashNet)) +
              '</tbody></table>' +

              (model.marginEnabled === false
                ? '<h2>Default Margin</h2><p style="font-style:italic; color:#555;">' +
                  'Tidak ada margin diambil di muka — profit dihitung dari Cash In dikurangi Cost ' + model.vendorEntity + ' aktual (lihat Profit Margin).' +
                  '</p>'
                : '<h2>Default Margin</h2>' +
                  (model.marginMode === 'MANUAL'
                    ? '<table class="pdf-meta"><tbody>' + pdfRow('Total Margin (manual)', (gd.totalMgnFrac * 100).toFixed(0) + '%') + '</tbody></table>'
                    : '<table class="pdf-tbl">' + tblHead(['Komponen', 'Kategori', '%', 'Nominal'], MARGIN_COLS) +
                      '<tbody>' + marginTableHtml(block.margin, model.marginComponents, gd.cashNet, true) + '</tbody></table>') +
                  '<table class="pdf-meta"><tbody>' +
                  pdfRow('Total Margin', (gd.totalMgnFrac * 100).toFixed(0) + '%') +
                  pdfRow('Profit', fmtRp(gd.profit)) +
                  pdfRow('Available Cost ' + model.vendorEntity, fmtRp(gd.availCost)) +
                  '</tbody></table>');

            if (model.isViaSalset) {
              html += costTableHtml('Biaya Pengeluaran SALSET', block.salItems, gd.totalSal);
            }

            html += costTableHtml('Biaya Pengeluaran ' + model.vendorEntity, block.baaItems, gd.totalBaa) +

              '<h2>SPP Amount</h2><table class="pdf-meta"><tbody>' +
              pdfRow('DPP', fmtRp(gd.dpp)) + pdfRow('PPN (11%)', fmtRp(gd.ppn11)) +
              pdfRow('PPh 23 (2%)', fmtRp(gd.pphSpp)) + pdfRow('Total Neto', fmtRp(gd.neto)) +
              '</tbody></table>' +

              '<h2>Profit Margin</h2><table class="pdf-meta"><tbody>' +
              pdfRow('Revenue After Tax', fmtRp(gd.cashNet)) + pdfRow('Total Cost', fmtRp(gd.totalBaa)) +
              pdfRow('Profit', fmtRp(gd.pmProfit)) + pdfRow('Persentase', (gd.pmPct * 100).toFixed(2) + '%') +
              '</tbody></table>';
          } else {
            var gu = computeGU({
              salItems: block.salItems, baaItems: block.baaItems, margin: block.margin, marginComponents: model.marginComponents,
              isViaSalset: model.isViaSalset, ngoRatePct: model.guNgoRatePct, pkp: model.pkp, biayaPencairan: biayaPencairan
            });

            if (model.isViaSalset) {
              html += costTableHtml('Cost SALSET', block.salItems, gu.totalGuSal);
            }
            html += costTableHtml('Cost ' + model.vendorEntity, block.baaItems, gu.totalGuBaa);

            if (model.isViaSalset) {
              html += '<h2>SALSET Gross Up</h2><table class="pdf-meta"><tbody>' +
                pdfRow('Total Cost SALSET', fmtRp(gu.totalGuSal)) +
                pdfRow('NGO Fee Rate', model.guNgoRatePct + '%') +
                pdfRow('Gross Up SALSET', fmtRp(gu.salGu)) +
                '</tbody></table>';
            }

            html += '<h2>Default Margin</h2><table class="pdf-tbl">' + tblHead(['Komponen', 'Kategori', '%'], MARGIN_COLS_3COL) +
              '<tbody>' + marginTableHtml(block.margin, model.marginComponents, gu.guMargin, false) + '</tbody></table>' +
              '<table class="pdf-meta"><tbody>' + pdfRow('Total Margin', (gu.guTotalMgnFrac * 100).toFixed(0) + '%') + '</tbody></table>' +

              '<h2>Gross Up Calculation</h2><table class="pdf-meta"><tbody>' +
              (model.isViaSalset ? pdfRow('SALSET Gross Up', fmtRp(gu.salGu)) : '') +
              pdfRow('Amount (Total Cost ' + model.vendorEntity + ')', fmtRp(gu.totalGuBaa)) +
              pdfRow('Gross Up Margin', fmtRp(gu.guMargin)) +
              pdfRow('Gross Up PPh 23', fmtRp(gu.guPph)) +
              (model.isViaSalset ? pdfRow('Gross Up NGO Fee Vendor', fmtRp(gu.guBaa)) : '') +
              pdfRow('Total Hasil Gross Up', fmtRp(gu.totalHasilGu)) +
              '</tbody></table>' +

              '<h2>Admin Pencairan</h2><table class="pdf-meta"><tbody>' +
              pdfRow('Bank Aktif', model.entity.Entity_Name + ' (' + model.entity.Bank + ')') +
              pdfRow('Rate / Pencairan', fmtRp(biayaPencairan)) +
              pdfRow('Biaya Admin', fmtRp(gu.guAdmin)) +
              pdfRow('Link Campaign', ((model.linkCampaigns || []).filter(function (l) { return l && l.trim(); }).join(', ') || '-')) +
              pdfRow('Gross Up Platform &amp; Tech Fee', fmtRp(gu.guFinal)) +
              '</tbody></table>' +

              '<h2>SPP Amount</h2><table class="pdf-meta"><tbody>' +
              pdfRow('DPP', fmtRp(gu.guDpp)) + pdfRow('PPN (11%)', fmtRp(gu.guPpn11)) +
              pdfRow('PPh 23 (2%)', fmtRp(gu.guPphSpp)) + pdfRow('Total Neto', fmtRp(gu.guNeto)) +
              '</tbody></table>' +

              '<h2>Program Fee</h2><table class="pdf-meta"><tbody>' +
              pdfRow('Profit ' + model.vendorEntity, fmtRp(gu.guProfit)) +
              (model.isViaSalset ? pdfRow('Salset Fee', fmtRp(gu.guSalFee)) : '') +
              pdfRow('Margin', (gu.guTotalMgnFrac * 100).toFixed(0) + '%') +
              '</tbody></table>';
          }
        });

        return html;
      }

      /**
       * Rakit model laporan dari DRAFT TERSIMPAN (hasil cor_getDraft).
       *
       * KENAPA DI SINI, BUKAN DI TIAP HALAMAN
       * -------------------------------------
       * Dulu fungsi ini disalin dua kali — di DocumentPipelineContent
       * ("Lihat COR") dan SalesPipelineContent (preview dari Document
       * Request). Dua salinan itu tertinggal saat metode input cost
       * ditambahkan: toCost-nya tidak membawa mode/category/categoryOrder/
       * rowRole, sehingga "Lihat COR" kehilangan pengelompokan kategori DAN
       * menampilkan baris rincian sebagai Rp0 — beda dari Download PDF yang
       * memakai model lengkap. Bentuk bug yang tidak mungkin ketahuan dari
       * salah satu halaman saja, karena masing-masing "konsisten" sendiri.
       *
       * Sekarang SATU sumber: kembaran server-side-nya adalah
       * CorService.buildReportModel (yang membaca sheet langsung). Kalau
       * salah satu berubah, samakan keduanya.
       *
       * @param draft hasil cor_getDraft: { doc, header, funds, costs, margins }
       * @param taxonomy { entities, marginComponents } dari cor_getTaxonomy
       * @param projectLabel string siap tampil ("PRJ26-1 — Nama Project")
       */
      function buildModelFromDraft(draft, taxonomy, projectLabel) {

        var activeEntity = isViaSalset ? salsetEnt : (vendorEnt || { Entity_Name: vendorEntity, Bank: '-', Is_PKP: false, Biaya_Pencairan: 0 });

        function toFund(f) {
          return {
            fundType: f.Fund_Type, linkCampaign: f.Link_Campaign || '',
            nominal: Number(f.GDV) || Number(f.Nominal) || 0, isZakat: !!f.Is_Zakat,
            campaignFundKind: f.Campaign_Fund_Kind || '',

        // Dokumen lama simpan 'Operasional' (sebelum disingkat "Ops") —
        // dinormalisasi di sini biar kalkulator, Lihat COR, & PDF konsisten.
        function normalizeKat(k) { return k === 'Operasional' ? 'Ops' : k; }
        function toCost(c) {
          return {
            label: c.Keterangan || '', kategori: normalizeKat(c.Kategori) || 'Barang', tipe: c.Tipe || '',

        var costs = draft.costs || [];
        function salItems(tab) { return costs.filter(function (c) { return c.Cor_Tab === tab && c.Cost_Group === 'SAL'; }).map(toCost); }
        function baaItems(tab) { return costs.filter(function (c) { return c.Cor_Tab === tab && c.Cost_Group === 'VENDOR'; }).map(toCost); }

            { tabLabel: 'Client', funds: fundObjs.filter(function (f) { return f.fundType === 'CLIENT'; }), salItems: salItems('CLIENT'), baaItems: baaItems('CLIENT'), margin: marginFor('CLIENT') },
            { tabLabel: 'Campaign', funds: fundObjs.filter(function (f) { return f.fundType === 'CAMPAIGN'; }), salItems: salItems('CAMPAIGN'), baaItems: baaItems('CAMPAIGN'), margin: marginFor('CAMPAIGN') }
          ];

          blocks = [{ tabLabel: null, funds: fundObjs, salItems: salItems('CLIENT'), baaItems: baaItems('CLIENT'), margin: marginFor('CLIENT') }];
        } else {
          blocks = [{ tabLabel: null, funds: [], salItems: salItems('CLIENT'), baaItems: baaItems('CLIENT'), margin: marginFor('CLIENT') }];
        }

        return {
          docLabel: draft.doc.Doc_ID,
          projectLabel: projectLabel || '-',
          method: method, isViaSalset: isViaSalset, vendorEntity: vendorEntity, entity: activeEntity, pkp: pkp,
          ngoRatePct: ngoRate, guNgoRatePct: ngoRate, biayaSalset: biayaSalset,
          // Dulu tidak ikut dikirim sama sekali, sehingga baris "Link Campaign"
          // di Admin Pencairan (Gross Up) selalu "-" di Lihat COR walau terisi
          // di Download PDF.
          linkCampaigns: header ? (header.Link_Campaigns || []) : [],
          marginComponents: (taxonomy && taxonomy.marginComponents) || [], blocks: blocks,
          marginEnabled: marginEnabled, marginMode: marginMode, manualMarginPct: manualMarginPct
        };
      }

          '</div>' +

      function formatQoDate(value) {

        if (isNaN(d.getTime())) return String(value);
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      }

      /**
       * SATU perakit model laporan dari draft tersimpan — dipakai bersama oleh
       * "Lihat Quotation" di Document Pipeline DAN di Sales Pipeline.
       *
       * Dulu kedua halaman itu menyalin perakitan ini sendiri-sendiri, dan
       * salinannya pasti tertinggal tiap kali ada field model baru (persis
       * bug yang pernah terjadi di "Lihat COR" — lihat catatan di
       * CorCalc.buildModelFromDraft). Field seperti hideValidDate/
       * hideAgencyFee/singleBoxPrice tidak akan pernah ikut terbawa kalau
       * perakitannya masih tersebar. Kembaran server-nya adalah
       * QuotationService.buildReportModel (membaca sheet langsung).
       *
       * @param draft hasil quotation_getDraft: { doc, entityCode, header, items }
       * @param taxonomy hasil quotation_getTaxonomy (dipakai ppnRate-nya)
       * @param logos hasil quotation_getLogos: { YKB, KAI }
       */
      function buildModelFromDraft(draft, taxonomy, logos) {
        var header = draft.header || {};
        return {
          entityCode: draft.entityCode,
          language: header.Language,
          entityName: header.Entity_Name,
          picName: header.Pic_Name,
          picEmail: header.Pic_Email,
          picPhone: header.Pic_Phone,
          picTitle: header.Pic_Title,
          headName: header.Head_Name,
          titleName: header.Title_Name,
          serviceName: header.Service_Name,
          firstStatementHtml: header.First_Statement,
          importantRemarksHtml: header.Important_Remarks,
          quotationNumber: header.Quotation_Number,
          createdDateText: formatQoDate(header.Created_Date),
          validDateText: formatQoDate(header.Valid_Date),
          agencyFeeRate: header.Agency_Fee_Rate,
          ppnRate: (taxonomy && taxonomy.ppnRate) || 11,
          hideValidDate: !!header.Hide_Valid_Date,
          hideAgencyFee: !!header.Hide_Agency_Fee,
          singleBoxPrice: !!header.Single_Box_Price,
          categories: buildCategoriesFromItems(draft.items || []),
          logoDataUri: (logos && logos[draft.entityCode]) || ''
        };
      }

      return {
        esc: esc, fmtRp: fmtRp, entityDisplayName: entityDisplayName, docTitleWord: docTitleWord,
        itemHasPricing: itemHasPricing, buildCategoriesFromItems: buildCategoriesFromItems,
        computeSubtotal: computeSubtotal, REPORT_CSS: REPORT_CSS, renderDocumentHtml: renderDocumentHtml,
        buildModelFromDraft: buildModelFromDraft
      };
    })();

    // Fungsi global (dipakai halaman manapun yang punya input password,
    // termasuk form Tambah Admin di Setting) supaya user bisa cek ulang
    // password yang diketik sebelum submit.
    function togglePasswordVisibility(inputId, btnEl) {
      var input = document.getElementById(inputId);
      var isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btnEl.innerText = isHidden ? '🙈' : '👁';
    }

    /**
     * Komponen searchable-select global: dipakai untuk dropdown yang bisa
     * berisi ratusan opsi (misal Head Office = kota/kabupaten se-Indonesia)
     * supaya user bisa mengetik untuk memfilter, bukan scroll manual.
     * Markup yang dibutuhkan per instance:
     *   <div class="searchable-select" id="<id>Wrap">
     *     <input id="<id>" autocomplete="off">
     *     <div class="searchable-select-options" id="<id>Options"></div>
     *   </div>
     * initSearchableSelect(id, optionsArray) mengisi ulang daftar opsi
     * (panggil lagi kalau master data berubah), sementara ketik & klik
     * ditangani otomatis lewat delegasi event di sini.
     */
    var searchableSelectData = {};

    function initSearchableSelect(id, options) {
      searchableSelectData[id] = options || [];
      var input = document.getElementById(id);
      if (input && !input.dataset.searchableBound) {
        input.dataset.searchableBound = '1';
        input.addEventListener('focus', function () { renderSearchableOptions(id, input.value); });
        input.addEventListener('input', function () { renderSearchableOptions(id, input.value); });
      }
    }

    function setSearchableSelectValue(id, value) {
      var input = document.getElementById(id);
      if (input) input.value = value || '';
    }

    function renderSearchableOptions(id, query) {
      var list = document.getElementById(id + 'Options');
      if (!list) return;
      var options = searchableSelectData[id] || [];
      var q = (query || '').trim().toLowerCase();
      var filtered = q ? options.filter(function (opt) { return opt.toLowerCase().indexOf(q) !== -1; }) : options;

      if (!filtered.length) {
        list.innerHTML = '<div class="searchable-select-empty">Tidak ada opsi cocok.</div>';
      } else {
        list.innerHTML = filtered.map(function (opt) {
          return '<div class="searchable-select-option" onclick="chooseSearchableOption(\'' + id + '\', this)">' + opt + '</div>';
        }).join('');
      }
      list.classList.add('open');
    }

    function chooseSearchableOption(id, el) {
      var input = document.getElementById(id);
      input.value = el.innerText;
      document.getElementById(id + 'Options').classList.remove('open');
    }

    document.addEventListener('click', function (e) {
      Object.keys(searchableSelectData).forEach(function (id) {
        var wrap = document.getElementById(id + 'Wrap');
        if (wrap && !wrap.contains(e.target)) {
          var list = document.getElementById(id + 'Options');
          if (list) list.classList.remove('open');
        }
      });
    });

    function toggleUserMenu() {
      document.getElementById('userMenu').classList.toggle('open');
    }

    document.addEventListener('click', function (e) {
      var wrap = document.querySelector('.user-menu-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('userMenu').classList.remove('open');
      }
    });

    /**
     * Gerbang identitas ringan (BUKAN keamanan sungguhan — lapisan keamanan
     * nyata adalah pembatasan domain Web App). Tujuannya cuma supaya
     * platform tahu "siapa yang sedang memakai ini" untuk Created_By/
     * Updated_By, dan menyimpan pilihan itu di localStorage supaya tidak
     * perlu login ulang tiap buka halaman.
     */
    var TechfordAuth = (function () {
      var STORAGE_KEY = 'techford_user';

      function getCurrentUser() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function setCurrentUser(user) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
      }

      function logout() {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }

      function applyUserToChrome(user) {
        var avatar = document.getElementById('currentUserAvatar');
        var nameEl = document.getElementById('currentUserName');
        if (avatar) avatar.innerText = (user.Name || 'U').charAt(0).toUpperCase();
        if (nameEl) nameEl.innerText = user.Name + (user.Role ? ' (' + user.Role + ')' : '');

        // Kartu identitas singkat di footer sidebar — TIDAK menggantikan
        // 🔔 Notification yang sudah ada, cuma ditambahkan di atasnya.
        // Berguna terutama di akun bersama/shared browser supaya jelas
        // sedang login sebagai siapa tanpa harus buka menu user di topbar.
        var card = document.getElementById('sidebarUserCard');
        var sbAvatar = document.getElementById('sidebarUserAvatar');
        var sbName = document.getElementById('sidebarUserName');
        var sbRole = document.getElementById('sidebarUserRole');
        if (card && sbAvatar && sbName && sbRole) {
          sbAvatar.innerText = (user.Name || 'U').charAt(0).toUpperCase();
          sbName.innerText = user.Name || '-';
          sbRole.innerText = user.Role || '-';
          card.style.display = '';
        }
      }

      function checkLogin() {
        var user = getCurrentUser();
        if (user) {
          applyUserToChrome(user);
          TechfordAccess.enforceCurrentPage();
          return;
        }
        document.getElementById('loginOverlay').classList.add('open');
      }

      function doLogin(isRetry) {
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;
        var errEl = document.getElementById('loginError');
        errEl.innerText = '';

        var btn = document.querySelector('#loginOverlay .btn-save');
        btn.disabled = true;
        btn.innerText = 'Memeriksa...';

        google.script.run
          .withSuccessHandler(function (res) {
            // Konsisten dengan pola di modul lain: google.script.run kadang
            // mengirim res=null walau server sebenarnya berhasil (bridge
            // quirk) — jangan langsung anggap gagal, coba ulang sekali dulu
            // secara diam-diam sebelum menampilkan error ke user.
            if (!res && !isRetry) {
              doLogin(true);
              return;
            }
            btn.disabled = false;
            btn.innerText = 'Masuk';
            if (!res || res.ok === false) {
              errEl.innerText = (res && res.error && res.error.message) || 'Tidak ada respons, silakan coba lagi.';
              return;
            }
            var user = res.data[0];
            setCurrentUser(user);
            document.getElementById('loginOverlay').classList.remove('open');
            applyUserToChrome(user);
            TechfordAccess.enforceCurrentPage();
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.innerText = 'Masuk';
            errEl.innerText = 'Gagal login: ' + (err && err.message ? err.message : err);
          })
          .employee_login(email, password);
      }

      return { getCurrentUser: getCurrentUser, logout: logout, checkLogin: checkLogin, doLogin: doLogin };
    })();

    if (document.readyState === 'complete') {
      TechfordAuth.checkLogin();
    } else {
      window.addEventListener('load', TechfordAuth.checkLogin);
    }
  </script>

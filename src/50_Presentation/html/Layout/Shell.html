<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <?!= include('50_Presentation/html/Style'); ?>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-title">Tech Ford</div>
        <div class="brand-subtitle">Kitabisa B2B OS 2026</div>
      </div>

      <nav class="sidebar-nav">
        <? for (var g = 0; g < menu.length; g++) { ?>
          <div class="nav-group-label"><?= menu[g].group ?></div>
          <? for (var i = 0; i < menu[g].items.length; i++) {
               var item = menu[g].items[i];
               var isActive = item.page === activePage;
               var classes = 'nav-item' + (isActive ? ' nav-item-active' : '') + (!item.enabled ? ' nav-item-disabled' : '');
          ?>
            <? if (item.enabled) { ?>
              <a class="<?= classes ?>" href="?page=<?= item.page ?>"><?= item.label ?></a>
            <? } else { ?>
              <span class="<?= classes ?>" title="Belum tersedia"><?= item.label ?></span>
            <? } ?>
          <? } ?>
        <? } ?>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item nav-item-disabled">🔔 Notification</div>
        <div class="nav-item nav-item-disabled">⚙️ Setting</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" onclick="toggleSidebar()" title="Tampilkan/sembunyikan menu">☰</button>
          <div class="breadcrumb">
            <? if (breadcrumbGroup) { ?><span class="breadcrumb-muted"><?= breadcrumbGroup ?></span><span class="breadcrumb-sep">›</span><? } ?>
            <span class="breadcrumb-current"><?= pageTitle ?></span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions"><?!= headerActions ?></div>
          <? if (helpText) { ?>
            <div class="help-tooltip-wrap">
              <button class="icon-btn">?</button>
              <div class="help-tooltip"><?!= helpText ?></div>
            </div>
          <? } ?>
          <button class="icon-btn" title="Notifikasi">🔔</button>
          <div class="avatar-circle"><?= userInitial ?></div>
        </div>
      </header>
      <main class="content-area"><?!= content ?></main>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.querySelector('.app-shell').classList.toggle('sidebar-collapsed');
    }
  </script>
</body>
</html>

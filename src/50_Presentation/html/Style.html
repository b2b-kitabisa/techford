  .page-gap { padding: 0 4px; color: var(--text-faint); }

  /* Penanda kelengkapan data client (Client Monitoring). Client hasil Move
     dari Lead selalu lahir belum lengkap — Entity Name & Head Office tidak
     ditanyakan di form inbound. */
  .stat-incomplete .stat-label, .stat-incomplete .stat-value { color: var(--warn); }
  .completeness { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .completeness-missing { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; line-height: 1.4; white-space: normal; }
  .data-table tbody tr.client-row-incomplete td:first-child { box-shadow: inset 3px 0 0 var(--warn); }

  /* Kartu PIC utama di carousel — dibedakan dari PIC biasa, dan PIC biasa
     dapat tombol "Jadikan utama" saat mode edit. */
  .pic-card.pic-card-primary { border-color: var(--color-cerulean); background: var(--accent-tint); }
  .pic-primary-tag { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-cerulean); background: var(--color-white); border: 1px solid var(--color-cerulean); border-radius: 999px; padding: 1px 6px; margin-bottom: 4px; }
  .pic-set-primary-btn { margin-top: 6px; font-family: inherit; font-size: 10.5px; font-weight: 700; color: var(--text-muted); background: none; border: 1px dashed var(--border-soft); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  .pic-set-primary-btn:hover { color: var(--color-cerulean); border-color: var(--color-cerulean); }

  /* Peringatan kemungkinan duplikat client sebelum menyimpan. */
  .dup-warn { background: var(--warn-tint); border: 1px solid var(--warn); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; text-align: left; }
  .dup-warn-title { font-size: 12.5px; font-weight: 800; color: var(--warn); margin-bottom: 7px; }
  .dup-warn-list { display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto; }
  .dup-warn-item { font-size: 12px; color: var(--color-mineshaft); background: var(--color-white); border-radius: 5px; padding: 5px 9px; }
  .dup-warn-item span { color: var(--text-muted); }

  /* ---- Penanda "Potensi Duplikat" (Lead Capturing) ----
     Satu orang sering mengisi form berkali-kali. Semua data tetap disimpan;
     ini murni penanda supaya admin sadar sebelum menindaklanjuti. */
  .dup-tag {
    display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: 0.03em;
    color: var(--warn); background: var(--warn-tint); border: 1px solid var(--warn);
    border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: middle;
    white-space: nowrap; cursor: help;
  }
  .drawer-dup-warn {
    margin-top: 10px; background: var(--warn-tint); border-left: 3px solid var(--warn);
    border-radius: 0 6px 6px 0; padding: 9px 12px; font-size: 12px; line-height: 1.5;
    color: var(--color-mineshaft);
  }

  /* ---- Sumber trafik (UTM) di drawer Lead ---- */
  .utm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 6px; }
  @media (max-width: 520px) { .utm-grid { grid-template-columns: 1fr; } }

  /* ---- Keterangan Entity Type "Other" ----
     Form inbound membiarkan pengisi mengetik bebas (246 variasi di data
     nyata). Nilainya dinormalkan jadi 'Other', teks aslinya ditampilkan
     lewat tombol ini supaya tidak ada informasi yang hilang. */
  .entity-other-btn {
    margin-left: 6px; font-family: inherit; font-size: 10px; font-weight: 700;
    color: var(--color-cerulean); background: var(--accent-tint);
    border: 1px solid var(--color-cerulean); border-radius: 999px;
    padding: 1px 8px; cursor: pointer; white-space: nowrap;
  }
  .entity-other-btn:hover { background: var(--accent-tint-strong); }
  .entity-other-text {
    margin-top: 6px; font-size: 12px; color: var(--color-mineshaft);
    background: var(--bg-tint); border: 1px dashed var(--border-soft);
    border-radius: 6px; padding: 7px 10px;
  }

  /* ============================================================
     Lead Capturing & Client Monitoring — perbaikan tampilan
     ============================================================ */

  /* ---- Score card Lead: 6 kartu ringkas (3 kolom x 2 baris) + Inbound
     Health membentang di kolom kanan.
     TANPA max-width — sebelumnya dibatasi 900px supaya kartunya tidak jadi
     kotak-kotak raksasa, tapi di layar lebar itu malah menyisakan area kosong
     mencolok di sisi kanan (sekitar lebar satu kartu lagi). Grid sekarang
     mengisi penuh lebar kontainernya; kartunya tetap padat (nilai & persentase
     duduk di satu baris) jadi tidak terasa kosong meski lebih lebar. ---- */
  .stat-cards-lead {
    display: grid;
    /* 3 kolom untuk 6 kartu ringkas (3 per baris x 2 baris) + 1 kolom untuk
       Inbound Health yang membentang kedua barisnya. */
    grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.15fr);
    gap: 8px; margin-bottom: 14px;
  }
  .stat-mini {
    background: var(--color-white); border: 1px solid var(--border-soft);
    border-radius: 7px; padding: 7px 10px; min-width: 0;
  }
  .stat-mini.clickable { cursor: pointer; }
  .stat-mini.clickable:hover { box-shadow: var(--shadow-sm); }
  .stat-mini.active { border-color: var(--color-mineshaft); background: var(--bg-tint); }
  .stat-mini .stat-mini-label { font-size: 11.5px; font-weight: 700; line-height: 1.3; }
  .stat-mini-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .stat-mini .stat-mini-value {
    font-size: 21px; font-weight: 800; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .stat-mini-pct {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 800;
    color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .stat-mini-note { font-size: 9.5px; color: var(--text-faint); line-height: 1.3; }
  /* Warna per status — sama dengan badge di tabel supaya kartu dan baris
     tabel terbaca sebagai satu bahasa warna. */
  .stat-mini.tone-new .stat-mini-label, .stat-mini.tone-new .stat-mini-value { color: #6a1b9a; }
  .stat-mini.tone-contacted .stat-mini-label, .stat-mini.tone-contacted .stat-mini-value { color: var(--good); }
  .stat-mini.tone-moved .stat-mini-label, .stat-mini.tone-moved .stat-mini-value { color: var(--color-cerulean); }
  .stat-mini.tone-other .stat-mini-label, .stat-mini.tone-other .stat-mini-value { color: var(--warn); }
  .stat-mini.tone-spam .stat-mini-label, .stat-mini.tone-spam .stat-mini-value { color: var(--bad); }
  .stat-mini.tone-total { border-color: rgba(var(--color-mineshaft-rgb), 0.4); }
  .stat-cards-lead .stat-health-tall {
    grid-column: 4; grid-row: 1 / span 2;
    display: flex; flex-direction: column;
    border-color: var(--accent-border); background: var(--accent-tint);
  }
  .stat-health-tall .stat-mini-label, .stat-health-tall .stat-mini-value { color: var(--color-cerulean); }
  .stat-health-tall .stat-mini-value { font-size: 30px; }
  .stat-health-tall .stat-sub { margin-top: auto; }
  @media (max-width: 900px) {
    .stat-cards-lead { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat-cards-lead .stat-health-tall { grid-column: 1 / -1; grid-row: auto; }
  }
  @media (max-width: 560px) {
    .stat-cards-lead { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ---- Header & footer drawer menempel saat di-scroll ----
     Drawer Lead & Client panjang (Interest, UTM, PIC, Notes); begitu admin
     scroll ke bawah, tombol status/Save keluar dari pandangan. Dipasang lewat
     class terpisah, BUKAN ke .drawer-panel global — drawer modul lain
     (COR, Quotation, Cost Monitoring) punya susunan sendiri dan tidak ikut
     diubah tanpa diuji. ---- */
  .drawer-panel.drawer-sticky-chrome > .drawer-header { position: sticky; top: 0; z-index: 12; }
  .drawer-panel.drawer-sticky-chrome > .drawer-footer {

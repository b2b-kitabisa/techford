<style>
  :root {
    /* ---- Brand colors (3 primary) ---- */
    --color-cerulean: #10A8E5;
    --color-cerulean-rgb: 16, 168, 229;
    --color-mineshaft: #3A3A3A;
    --color-mineshaft-rgb: 58, 58, 58;
    --color-white: #FFFFFF;

    /* Turunan dari Mine Shaft untuk teks pudar, border, dan background halus
       — supaya seluruh UI tetap konsisten ke 3 warna utama, bukan abu-abu
       lepas yang tidak terikat brand. */
    --text-muted: rgba(var(--color-mineshaft-rgb), 0.65);
    --text-faint: rgba(var(--color-mineshaft-rgb), 0.45);
    --border-soft: rgba(var(--color-mineshaft-rgb), 0.15);
    --border-softer: rgba(var(--color-mineshaft-rgb), 0.08);
    --bg-hover: rgba(var(--color-mineshaft-rgb), 0.06);
    --bg-tint: rgba(var(--color-mineshaft-rgb), 0.03);
    --bg-disabled: rgba(var(--color-mineshaft-rgb), 0.25);

    --accent-tint: rgba(var(--color-cerulean-rgb), 0.1);
    --accent-tint-strong: rgba(var(--color-cerulean-rgb), 0.18);
    --accent-border: rgba(var(--color-cerulean-rgb), 0.5);

    /* ---- Sistem Desain v2 (lihat artefak "Techford — Usulan Sistem
       Desain") — token semantik & bayangan dipakai konsisten oleh
       komponen bersama (.stat-tile/.pill/.dtable/dst) supaya tiap modul
       tidak reka ulang warna/radius/shadow sendiri-sendiri. ---- */
    --good: #188038;
    --good-tint: #E6F4EA;
    --warn: #B8860B;
    --warn-tint: #FEF7E0;
    --bad: #C5221F;
    --bad-tint: #FCE8E6;
    --shadow-sm: 0 1px 2px rgba(var(--color-mineshaft-rgb), 0.08), 0 1px 1px rgba(var(--color-mineshaft-rgb), 0.05);
    --shadow-md: 0 4px 14px rgba(var(--color-mineshaft-rgb), 0.10), 0 1px 3px rgba(var(--color-mineshaft-rgb), 0.07);
    --shadow-lg: 0 16px 40px rgba(var(--color-mineshaft-rgb), 0.16), 0 4px 10px rgba(var(--color-mineshaft-rgb), 0.08);
    --radius-md: 10px;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  /* Sebagian besar komponen di app ini pakai font-size fixed dalam px
     (bukan rem/relative), jadi tidak ada satu variabel tunggal yang bisa
     diubah untuk menyesuaikan semuanya sekaligus. Cara paling aman &
     berdampak-luas tanpa menulis ulang ratusan deklarasi font-size satu-
     per-satu: `zoom` di html — efeknya identik dengan user menekan
     Ctrl+Scroll zoom di browser (semua ukuran & proporsi ikut menyusut
     bersama, muat lebih banyak konten per layar), tapi otomatis aktif
     tanpa perlu di-set manual tiap buka. Ini berlaku di SELURUH halaman
     (Style.html dipakai bersama semua Content page lewat SPA shell), bukan
     cuma Cost Monitoring. 0.88 ternyata masih belum cukup kecil (user tetap
     perlu zoom out manual ke ~90% di browser di atasnya) — diturunkan ke
     0.8 supaya tampilan di zoom browser 100% (default, tanpa perlu
     otak-atik apa pun) sudah sama nyamannya dengan 0.88 + zoom out manual
     90% sebelumnya (0.88 × 0.9 ≈ 0.79, dibulatkan ke 0.8). */
  html { zoom: 0.8; }
  body {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: var(--color-mineshaft);
    background: var(--color-white);
  }

  /* ---- Generic simple content (fallback pages) ---- */
  .container { max-width: 720px; margin: 0 auto; padding: 24px; }
  .error { color: #c5221f; }

  /* ---- Textarea (base, elemen polos) ---- */
  /* Banyak <textarea> tersebar di berbagai halaman (COR, Quotation, Sales
     Pipeline, dst) tidak dibungkus class khusus sama sekali, jadi selama ini
     tampil polos bawaan browser (kotak persegi, tanpa border-radius/focus
     state) — beda jauh dari input/select yang semuanya sudah di-style per
     konteks. Aturan berbasis elemen (bukan class) ini otomatis menjangkau
     SEMUA textarea polos itu tanpa perlu ubah tiap file; textarea yang sudah
     punya style scoped sendiri (mis. .drawer-edit-form textarea) tetap
     menang karena selector class lebih spesifik. */
  textarea {
    font-family: inherit; font-size: 13px; padding: 9px 10px; color: var(--color-mineshaft);
    border: 1px solid var(--border-soft); border-radius: 6px; resize: vertical;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus { outline: none; border-color: var(--color-cerulean); box-shadow: 0 0 0 3px var(--accent-tint-strong); }
  textarea::placeholder { color: var(--text-faint); }

  /* ---- App Shell layout ---- */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--color-white);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s ease, opacity 0.15s ease;
  }
  .app-shell.sidebar-collapsed .sidebar { width: 0; opacity: 0; border-right: none; }
  .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border-soft); }
  .brand-title { font-size: 22px; font-weight: 700; color: var(--color-mineshaft); }
  .brand-subtitle { font-size: 12px; color: var(--text-muted); }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  /* Label modul (grup menu) sengaja dibuat lebih besar & tegas daripada
     .nav-item (section/page di bawahnya) supaya hierarki modul > section
     langsung terlihat dan tidak mudah tertukar. Warna disamakan untuk
     semua modul (bukan beda-beda per grup) supaya tetap sederhana. */
  .nav-group-label {
    font-size: 15px; font-weight: 800; color: var(--color-mineshaft);
    margin: 12px 16px 6px; padding: 0;
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .nav-group-divider { height: 1px; background: var(--border-softer); margin: 4px 16px 0; }
  /* Klik label modul buat collapse/expand grup-nya (lihat toggleNavGroup di
     Shell.html) — supaya sidebar tidak penuh kalau modulnya banyak. Status
     collapse disimpan di localStorage per grup, dan grup yang berisi menu
     yang sedang aktif tidak pernah otomatis di-collapse saat halaman dibuka
     (lihat restoreNavGroupState), supaya user tidak kehilangan jejak. */
  .nav-group-chevron {
    font-size: 11px; color: var(--text-faint); transition: transform 0.18s ease; flex-shrink: 0;
  }
  .nav-group.collapsed .nav-group-chevron { transform: rotate(-90deg); }
  .nav-group-items {
    max-height: 800px; overflow: hidden;
    transition: max-height 0.22s ease;
  }
  .nav-group.collapsed .nav-group-items { max-height: 0; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 16px;
    font-size: 14px;
    color: var(--color-mineshaft);
    text-decoration: none;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item-active { background: var(--color-mineshaft); color: var(--color-white); font-weight: 700; }
  .nav-item-disabled { color: var(--bg-disabled); cursor: not-allowed; }
  .nav-item-disabled:hover { background: transparent; }

  /* Badge notifikasi jumlah (mirip unread count inbox) di sidebar — misal
     jumlah New Leads / New Pipeline yang belum ditindaklanjuti. */
  .nav-badge {
    background: var(--color-cerulean); color: var(--color-white); border-radius: 10px;
    padding: 1px 7px; font-size: 11px; font-weight: 800; line-height: 1.5; flex-shrink: 0;
  }
  .nav-item-active .nav-badge { background: var(--color-white); color: var(--color-mineshaft); }

  .sidebar-footer { border-top: 1px solid var(--border-soft); padding: 8px 0; }

  /* ---- Topbar ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--color-white);
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .breadcrumb { font-size: 20px; white-space: nowrap; }
  .breadcrumb-muted { color: var(--text-faint); font-weight: normal; }
  .breadcrumb-sep { color: var(--text-faint); margin: 0 8px; }
  .breadcrumb-current { font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .icon-btn {
    background: none; border: none; font-size: 18px; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .avatar-circle {
    width: 34px; height: 34px; border-radius: 50%; background: var(--color-cerulean); color: var(--color-white);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    cursor: pointer;
  }
  .user-menu-wrap { position: relative; }
  .user-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 8px); background: var(--color-white);
    border: 1px solid var(--border-soft); border-radius: 6px; box-shadow: 0 4px 12px rgba(var(--color-mineshaft-rgb), 0.15);
    min-width: 180px; z-index: 60; overflow: hidden;
  }
  .user-menu.open { display: block; }
  .user-menu-name { padding: 10px 14px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border-softer); }
  .user-menu-item { padding: 10px 14px; font-size: 13px; cursor: pointer; }
  .user-menu-item:hover { background: var(--bg-hover); }

  /* ---- Login gate ---- */
  .login-overlay {
    display: none; position: fixed; inset: 0; background: var(--color-mineshaft);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .login-overlay.open { display: flex; }
  .login-box { background: var(--color-white); border-radius: 10px; width: 340px; max-width: 90vw; padding: 32px 28px; text-align: center; }
  .login-box p { font-size: 13px; color: var(--text-muted); margin: 6px 0 16px; }
  .login-box input {
    width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-soft);
    border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .login-box .btn-save { width: 100%; padding: 12px; }
  .login-box .error { margin-bottom: 8px; font-size: 12px; }

  /* ---- Password field dengan toggle mata ---- */
  .password-field-wrap { position: relative; }
  .password-field-wrap input { width: 100%; padding-right: 38px !important; }
  .password-toggle-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px;
    color: var(--text-muted);
  }

  .help-tooltip-wrap { position: relative; }
  .help-tooltip-wrap .icon-btn {
    border: 1px solid var(--border-soft); font-weight: 700; font-size: 14px; color: var(--text-muted);
  }
  .help-tooltip {
    display: none; position: absolute; right: 0; top: calc(100% + 8px);
    background: var(--color-mineshaft); color: var(--color-white); border-radius: 8px; padding: 12px 16px;
    font-size: 12.5px; line-height: 1.5; width: 320px; z-index: 50; box-shadow: 0 4px 12px rgba(var(--color-mineshaft-rgb), 0.3);
  }
  .help-tooltip strong { color: var(--color-cerulean); }
  .help-tooltip-wrap:hover .help-tooltip { display: block; }
  .btn-sync {
    background: var(--accent-tint); color: var(--color-cerulean); border: 1px solid var(--color-cerulean);
    padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn-sync:hover { background: var(--accent-tint-strong); }
  .btn-sync:disabled { opacity: 0.6; cursor: default; }

  .content-area { padding: 24px; }
  /* Dipasang sebentar oleh TechfordNav (router SPA, lihat Shell.html) saat
     pindah section — konten lama meredup halus sambil fragment baru
     di-fetch, bukan langsung kosong/berkedip. */
  .content-area.spa-loading { opacity: 0.4; pointer-events: none; transition: opacity 0.15s ease; }

  /* ---- Stat cards ---- */
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--color-white); border-radius: 8px; padding: 14px 16px;
    border: 1px solid var(--border-soft);
  }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:hover { box-shadow: 0 2px 6px rgba(var(--color-mineshaft-rgb), 0.08); }
  .stat-label { font-weight: 700; font-size: 14px; }
  .stat-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  /* Warna status di bawah ini sengaja tetap semantik/multi-warna (bukan
     3 warna brand) supaya status Lead & Client tetap bisa dibedakan
     sekilas tanpa perlu membaca teks label. */
  .stat-new .stat-label, .stat-new .stat-value { color: #6a1b9a; }
  .stat-contacted .stat-label, .stat-contacted .stat-value { color: #188038; }
  .stat-moved .stat-label, .stat-moved .stat-value { color: var(--color-cerulean); }
  .stat-other .stat-label, .stat-other .stat-value { color: #b8860b; }
  .stat-spam .stat-label, .stat-spam .stat-value { color: #c5221f; }
  .stat-moved-pct .stat-label, .stat-moved-pct .stat-value { color: #0d652d; }
  .stat-card.active { border-color: var(--color-mineshaft); }

  /* ---- Filter bar ---- */
  .filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; row-gap: 10px; }
  /* :not([type="checkbox"]) SENGAJA ditambahkan — sebelumnya rule ini ikut
     memaksa checkbox (misal "Retainer" di Sales Pipeline, atau checkbox di
     dalam dropdown filter Stage) jadi setinggi 40px dengan border/padding
     kotak input teks, bukan checkbox ukuran normal. */
  .filter-bar input:not([type="checkbox"]), .filter-bar select {
    padding: 10px; border: 1px solid var(--border-soft); border-radius: 6px; font-size: 14px; font-family: inherit;
    height: 40px; box-sizing: border-box;
  }
  .filter-bar input:not([type="checkbox"]) { flex: 1; min-width: 200px; }
  .filter-bar input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
  .filter-checkbox-label { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; }
  .filter-reset { background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: inherit; white-space: nowrap; }

  .status-filter-wrap { position: relative; }
  .filter-select-btn {
    padding: 10px 14px; border: 1px solid var(--border-soft); border-radius: 6px; font-size: 14px;
    background: var(--color-white); cursor: pointer; white-space: nowrap; font-family: inherit;
    height: 40px; box-sizing: border-box;
  }
  .filter-select-btn.has-value { border-color: var(--color-cerulean); color: var(--color-cerulean); background: var(--accent-tint); font-weight: 700; }
  .status-filter-dropdown {
    display: none; position: absolute; left: 0; top: calc(100% + 4px); background: var(--color-white);
    border: 1px solid var(--border-soft); border-radius: 6px; box-shadow: 0 4px 12px rgba(var(--color-mineshaft-rgb), 0.15);
    min-width: 200px; z-index: 20; padding: 6px 0;
  }
  .status-filter-dropdown.open { display: block; }
  .status-filter-dropdown label {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .status-filter-dropdown label:hover { background: var(--bg-hover); }
  .status-filter-actions {
    display: flex; justify-content: space-between; gap: 8px; padding: 4px 14px 8px;
    border-bottom: 1px solid var(--border-softer); margin-bottom: 4px;
  }
  .status-filter-actions button {
    background: none; border: none; color: var(--color-cerulean); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; padding: 0;
  }


  /* ---- Data table ---- */
  .table-scroll {
    overflow: auto; max-height: 560px; border-radius: 8px;
  }
  .data-table { width: 100%; border-collapse: collapse; background: var(--color-white); font-size: 12px; }
  .data-table thead th {
    background: var(--color-mineshaft); color: var(--color-white); text-align: left; padding: 9px 12px; font-weight: normal;
    font-size: 11.5px; white-space: nowrap; position: sticky; top: 0; z-index: 5;
  }
  .data-table thead th.sortable { cursor: pointer; user-select: none; }
  .data-table thead th.sortable:hover { background: #4a4a4a; }
  .sort-icon { font-size: 9px; opacity: 0.5; margin-left: 3px; }
  .data-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border-softer); vertical-align: top; }
  .data-table tbody tr { transition: background-color 0.1s; }
  .data-table tbody tr:hover { background: var(--accent-tint); }
  .nowrap-cell { white-space: nowrap; }
  .ellipsis-cell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .entity-name { font-weight: 700; }
  .entity-pic { font-size: 10.5px; color: var(--text-muted); }
  .contact-cell { font-size: 11.5px; white-space: nowrap; }
  .contact-cell a { display: block; color: var(--color-cerulean); text-decoration: none; }
  .contact-cell .contact-email { color: var(--text-muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  /* Badge status sengaja tetap multi-warna — lihat catatan di .stat-new dkk. */
  .badge-new { background: #f3e8fd; color: #6a1b9a; }
  .badge-contacted { background: #e6f4ea; color: #188038; }
  .badge-moved { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .badge-other { background: #fef7e0; color: #b8860b; }
  .badge-spam { background: #fce8e6; color: #c5221f; }
  /* Dipakai khusus Stage badge di Document Pipeline — disamakan warnanya
     dengan score card .pipeline-bucket-* (bukan reuse .badge-new dkk yang
     dipakai status Lead/Client Monitoring dengan makna warna berbeda). */
  .stage-badge-new-request { background: #fef7e0; color: #b8860b; }
  .stage-badge-in-progress { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .stage-badge-client-review { background: #fce8e6; color: #c5221f; }
  .stage-badge-done { background: #e6f4ea; color: #188038; }
  /* Tag kecil penanda project Retainer di tabel Sales Pipeline — sengaja
     badge, bukan warna row, supaya tidak bertabrakan kalau baris lain nanti
     juga perlu diwarnai (misal status Loss). */
  .badge-retainer {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 10px;
    font-size: 10px; font-weight: 700; background: var(--accent-tint-strong); color: var(--color-cerulean);
    vertical-align: middle;
  }
  .btn-icon-round {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-soft); background: var(--color-white);
    cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  }
  .btn-icon-round:hover { background: var(--bg-hover); color: var(--color-mineshaft); }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 32px; }

  /* ---- Pagination ---- */
  .pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; font-size: 14px;
  }
  .page-buttons { display: flex; gap: 4px; }
  .page-buttons button {
    border: 1px solid var(--border-soft); background: var(--color-white); padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .page-buttons button.active { background: var(--color-mineshaft); color: var(--color-white); border-color: var(--color-mineshaft); }
  .page-buttons button:disabled { opacity: 0.5; cursor: default; }

  /* Saat drawer terbuka, halaman utama tidak boleh ikut ter-scroll —
     hanya drawer-panel (punya overflow-y sendiri) yang boleh scroll. */
  body.drawer-open { overflow: hidden; }

  /* ---- Detail Drawer (side panel dari kanan) ---- */
  /* display:none diganti opacity/visibility supaya bisa dikasih transisi —
     overlay fade-in, panel slide-in dari kanan (translateX) — trigger-nya
     tetap classList.add/remove('open') yang sama seperti sebelumnya, tidak
     ada JS yang perlu diubah. */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(var(--color-mineshaft-rgb), 0.4); z-index: 200;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.2s ease, visibility 0s linear 0.2s;
  }
  .drawer-overlay.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity 0.2s ease, visibility 0s linear 0s;
  }
  .drawer-panel {
    position: absolute; top: 0; right: 0; height: 100%; width: 620px; max-width: 95vw;
    background: var(--color-white); box-shadow: -4px 0 16px rgba(var(--color-mineshaft-rgb), 0.2);
    display: flex; flex-direction: column; overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .drawer-overlay.open .drawer-panel { transform: translateX(0); }
  .drawer-panel-wide { width: 820px; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .form-grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .form-grid-2col label, .drawer-edit-form label {
    font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px;
  }
  .form-grid-2col input, .form-grid-2col select {
    padding: 9px 10px; border: 1px solid var(--border-soft); border-radius: 6px; font-size: 13px; font-family: inherit;
  }

  /* ---- PIC Carousel ---- */
  .pic-carousel-wrap { position: relative; }
  .pic-carousel {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding-bottom: 6px; scrollbar-width: thin;
  }
  .pic-card {
    flex: 0 0 220px; scroll-snap-align: start; border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 12px; font-size: 13px; background: var(--bg-tint);
  }
  .pic-carousel-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); background: var(--color-white); border: 1px solid var(--border-soft);
    border-radius: 50%; width: 28px; height: 28px; cursor: pointer; z-index: 2; font-size: 14px;
  }
  .pic-carousel-arrow.left { left: -14px; }
  .pic-carousel-arrow.right { right: -14px; }
  .pic-card-remove {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: #fce8e6; color: #c5221f; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pic-card-remove:hover { background: #f6c6c2; }
  .pic-card { position: relative; }

  /* ---- Searchable Select (ketik untuk filter opsi, dipakai untuk
     dropdown dengan banyak opsi seperti Head Office & Industry) ---- */
  .searchable-select { position: relative; }
  .searchable-select input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border-soft); border-radius: 6px;
    font-size: 13px; font-family: inherit;
  }
  .searchable-select-options {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--color-white); border: 1px solid var(--border-soft); border-radius: 6px; box-shadow: 0 4px 12px rgba(var(--color-mineshaft-rgb), 0.15);
    max-height: 220px; overflow-y: auto; z-index: 30;
  }
  .searchable-select-options.open { display: block; }
  .searchable-select-option { padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .searchable-select-option:hover, .searchable-select-option.highlighted { background: var(--bg-hover); }
  .searchable-select-empty { padding: 8px 12px; font-size: 12px; color: var(--text-faint); }

  /* ---- Master Data collapsible sections ---- */
  .master-data-section {
    border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; background: var(--color-white);
  }
  .master-data-section summary {
    cursor: pointer; font-weight: 700; font-size: 13.5px; list-style: none; padding: 4px 0;
  }
  .master-data-section summary::-webkit-details-marker { display: none; }
  .master-data-section summary::before { content: '▸ '; color: var(--color-cerulean); }
  .master-data-section[open] summary::before { content: '▾ '; }
  .drawer-header { padding: 16px 24px 18px; background: var(--color-mineshaft); flex-shrink: 0; }
  .drawer-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .drawer-close { background: none; border: none; color: var(--color-white); font-size: 22px; cursor: pointer; line-height: 1; }
  .drawer-header h2 { margin: 0; font-size: 20px; color: var(--color-white); }
  .drawer-header .drawer-entity-type { font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 0.5px; margin-top: 2px; }

  .drawer-contact-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 16px 24px;
  }
  .drawer-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent-tint);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .drawer-contact-info { flex: 1; font-size: 13px; min-width: 0; }
  .drawer-pic-name { font-weight: 700; margin-bottom: 2px; }
  .drawer-contact-line a { color: var(--color-cerulean); text-decoration: none; }

  .drawer-action-row {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 0 24px 16px; border-bottom: 1px solid var(--border-softer);
  }

  .btn-outline {
    border: 1px solid var(--border-soft); background: var(--color-white); padding: 8px 14px; border-radius: 6px;
    font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .btn-outline:hover { background: var(--bg-hover); }

  .status-dropdown-wrap { position: relative; }
  .status-dropdown {
    display: none; position: absolute; right: 0; top: calc(100% + 4px); background: var(--color-white);
    border: 1px solid var(--border-soft); border-radius: 6px; box-shadow: 0 4px 12px rgba(var(--color-mineshaft-rgb), 0.15);
    min-width: 180px; z-index: 10; overflow: hidden;
  }
  .status-dropdown.open { display: block; }
  .status-option {
    padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .status-option:hover { background: var(--bg-hover); }
  .status-option svg { flex-shrink: 0; }
  /* Sama seperti badge status — warna tetap semantik/multi-warna. */
  .status-option-contacted { color: #188038; }
  .status-option-other { color: #b8860b; }
  .status-option-spam { color: #c5221f; }
  .status-option-moved { color: var(--color-cerulean); }

  .drawer-edit-form {
    display: none; flex-direction: column; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border-softer);
  }
  .drawer-edit-form.open { display: flex; }
  .drawer-edit-form label { font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
  .drawer-edit-form input, .drawer-edit-form textarea, .drawer-edit-form select {
    padding: 8px; border: 1px solid var(--border-soft); border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .drawer-edit-form textarea { min-height: 60px; resize: vertical; }

  .drawer-section { padding: 16px 24px; border-bottom: 1px solid var(--border-softer); }
  .drawer-section h3 { margin: 0 0 12px; font-size: 15px; }
  .drawer-field-label { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .drawer-field-value { font-size: 13px; color: var(--color-mineshaft); white-space: pre-wrap; }
  .drawer-section textarea {
    width: 100%; min-height: 70px; border: 1px solid var(--border-soft); border-radius: 6px;
    padding: 10px; font-size: 13px; resize: vertical; font-family: inherit;
  }

  .drawer-footer {
    padding: 16px 24px; margin-top: auto; display: flex; align-items: center;
    justify-content: flex-end; gap: 12px; flex-shrink: 0;
  }
  .save-hint { font-size: 12px; color: var(--color-cerulean); font-weight: 700; }
  .btn-save {
    background: var(--color-mineshaft); color: var(--color-white); border: none; padding: 10px 20px;
    border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn-save:disabled { opacity: 0.6; cursor: default; }

  /* ---- Save Confirmation Dialog ---- */
  /* Sama seperti drawer — display:none diganti opacity/visibility supaya
     bisa dikasih animasi scale+fade masuk, trigger tetap classList.open. */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(var(--color-mineshaft-rgb), 0.5);
    align-items: center; justify-content: center; z-index: 300;
    display: flex; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.18s ease, visibility 0s linear 0.18s;
  }
  .confirm-overlay.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity 0.18s ease, visibility 0s linear 0s;
  }
  .confirm-box {
    background: var(--color-white); border-radius: 8px; width: 360px; max-width: 90vw; padding: 24px;
    transform: scale(0.94); transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .confirm-overlay.open .confirm-box { transform: scale(1); }
  .confirm-box h3 { margin: 0 0 8px; }
  .confirm-box p { margin: 0 0 20px; font-size: 13px; color: var(--text-muted); }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---- Freeze overlay (dipasang selama proses save/update/request ke
     server sedang berjalan, supaya admin tidak bisa klik apapun lagi &
     paham halamannya sedang memproses) ---- */
  .techford-loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(var(--color-mineshaft-rgb), 0.25);
    align-items: center; justify-content: center; z-index: 2000; cursor: wait;
  }
  .techford-loading-overlay.open { display: flex; }
  .techford-loading-box {
    background: var(--color-white); border-radius: 8px; padding: 18px 26px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 16px rgba(var(--color-mineshaft-rgb), 0.25);
  }
  .techford-loading-spinner {
    width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--border-soft);
    border-top-color: var(--color-mineshaft); animation: techford-spin 0.7s linear infinite;
  }
  .techford-loading-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  @keyframes techford-spin { to { transform: rotate(360deg); } }

  /* ---- Inline loading indicator (dipakai di baris "Memuat data..." tabel,
     preview panel, dst — supaya keliatan JELAS sedang loading, bukan cuma
     teks polos yang gampang kelewat/terlihat seperti state kosong). ---- */
  .inline-spinner {
    display: inline-block; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--border-soft); border-top-color: var(--color-cerulean);
    animation: techford-spin 0.7s linear infinite; vertical-align: middle; margin-right: 7px;
  }
  .empty-row.loading-row td { color: var(--text-muted); }

  /* ---- Success Popup ---- */
  .success-overlay {
    position: fixed; inset: 0; background: rgba(var(--color-mineshaft-rgb), 0.5);
    align-items: center; justify-content: center; z-index: 500;
    display: flex; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.18s ease, visibility 0s linear 0.18s;
  }
  .success-overlay.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity 0.18s ease, visibility 0s linear 0s;
  }
  .success-box {
    background: var(--color-white); border-radius: 8px; width: 320px; max-width: 90vw;
    padding: 28px 24px; text-align: center;
    transform: scale(0.94); transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .success-overlay.open .success-box { transform: scale(1); }
  .success-icon {
    width: 48px; height: 48px; border-radius: 50%; background: var(--accent-tint-strong); color: var(--color-cerulean);
    font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .success-box h3 { margin: 0 0 20px; font-size: 15px; }

  /* ---- Sales Pipeline: score cards ---- */
  .pipeline-score-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .pipeline-score-card {
    background: var(--color-white); border-radius: 8px; padding: 16px 20px;
    border: 1px solid var(--border-soft); flex: 2; min-width: 240px;
  }
  .pipeline-score-title { font-size: 17px; font-weight: 800; }
  .pipeline-score-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .pipeline-score-value { font-size: 18px; font-weight: 700; }
  /* Warna Achieved (hijau) & Forecast (oranye) sengaja semantik, sama
     alasannya dengan badge status di modul lain. */
  .pipeline-score-achieved .pipeline-score-title, .pipeline-score-achieved .pipeline-score-value { color: #188038; }
  .pipeline-score-forecast .pipeline-score-title, .pipeline-score-forecast .pipeline-score-value { color: #b8860b; }

  /* CATATAN: .score-tooltip-icon / .score-tooltip DIHAPUS. Dulu score card
     Sales Pipeline menampilkan angka yang dipadatkan (mis. "Rp2.0B") dan
     angka penuhnya hanya bisa dilihat dengan hover ikon "i". Sekarang angka
     penuh ditampilkan langsung sebagai dua baris berlabel (.pl-sc-kv), jadi
     tidak ada lagi yang perlu disembunyikan di balik hover. */

  .pipeline-bucket-card {
    background: var(--color-white); border-radius: 8px; padding: 16px 20px;
    border: 1px solid var(--border-soft); flex: 3; min-width: 280px;
    display: flex; align-items: center; justify-content: space-around; gap: 8px;
  }
  .pipeline-bucket-item { text-align: center; }
  .pipeline-bucket-label { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
  .pipeline-bucket-value {
    display: inline-block; margin-top: 8px; padding: 8px 18px; border-radius: 8px;
    font-weight: 800; font-size: 20px; min-width: 48px;
  }
  .pipeline-bucket-pros .pipeline-bucket-label { color: #b8860b; }
  .pipeline-bucket-pros .pipeline-bucket-value { background: #fef7e0; color: #b8860b; }
  .pipeline-bucket-nego .pipeline-bucket-label { color: var(--color-cerulean); }
  .pipeline-bucket-nego .pipeline-bucket-value { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .pipeline-bucket-won .pipeline-bucket-label { color: #188038; }
  .pipeline-bucket-won .pipeline-bucket-value { background: #e6f4ea; color: #188038; }
  .pipeline-bucket-loss .pipeline-bucket-label { color: #c5221f; }
  .pipeline-bucket-loss .pipeline-bucket-value { background: #fce8e6; color: #c5221f; }

  /* CATATAN: .pipeline-value-line / .pipeline-value-label DIGANTI oleh
     .pl-val-line / .pl-val-lbl di blok Sales Pipeline paling bawah — sekarang
     rata kanan dengan digit sejajar (tabular-nums) supaya besaran antar baris
     bisa dibandingkan sekilas. Alasan lamanya tetap berlaku: GDV & REV dibuat
     SAMA gaya visualnya supaya tidak terkesan REV adalah pecahan/untung dari
     GDV, padahal dua angka independen. */

  /* ---- Toggle button group (Service, Program Type, Issue, dsb) ---- */
  .toggle-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggle-btn-list { display: flex; flex-direction: column; gap: 6px; }
  .toggle-btn {
    padding: 8px 14px; border: 1px solid var(--border-soft); border-radius: 6px; background: var(--color-white);
    cursor: pointer; font-size: 12px; font-weight: 700; font-family: inherit; color: var(--color-mineshaft);
    text-align: left;
  }
  .toggle-btn:hover { background: var(--bg-hover); }
  .toggle-btn.active { background: var(--color-cerulean); border-color: var(--color-cerulean); color: var(--color-white); }
  .toggle-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .taxonomy-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--text-muted); margin-bottom: 8px; display: block;
  }
  .service-category-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0 14px; margin-top: 10px; }
  .service-category-col { display: flex; flex-direction: column; gap: 6px; }

  /* ---- On/off switch (Retainer Project, dsb) ---- */
  .switch-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-slider {
    position: absolute; inset: 0; background: var(--bg-disabled); border-radius: 22px; cursor: pointer; transition: 0.2s;
  }
  .switch-slider:before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: var(--color-white); border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .switch-slider { background: var(--color-cerulean); }
  .switch input:checked + .switch-slider:before { transform: translateX(18px); }
  .switch input:disabled + .switch-slider { cursor: not-allowed; opacity: 0.6; }

  /* Varian untuk switch yang duduk di atas background gelap (drawer-header
     Mine Shaft) — versi default (tint Mine Shaft tipis) nyaris tidak
     kelihatan di atas background yang juga Mine Shaft. */
  .switch-on-dark .switch-slider { background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.55); }
  .switch-on-dark .switch-slider:before { background: var(--color-white); }
  .switch-on-dark input:checked + .switch-slider { background: var(--color-cerulean); border-color: var(--color-cerulean); }

  /* ---- Fitur yang sengaja masih placeholder (Document Request, Revenue
     Breakdown detail) — ditandai visual jelas supaya tidak dikira bug. ---- */
  .placeholder-box { opacity: 0.55; }
  .placeholder-note { font-size: 11px; color: var(--text-faint); font-style: italic; margin-top: 8px; }

  /* ---- Revenue Breakdown — GDV & Service Revenue ditumpuk vertikal
     (bukan bersebelahan) supaya tiap baris (link/nominal/notes) punya
     ruang cukup dan tidak berdesakan. Tiap sub-section punya "kartu"
     sendiri dengan header rata kanan-kiri (judul + total). ---- */
  .revenue-subsection { border: 1px solid var(--border-softer); border-radius: 10px; padding: 16px; margin-bottom: 16px; background: var(--bg-hover); }
  .revenue-subsection:last-of-type { margin-bottom: 0; }
  .revenue-subsection-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .revenue-subsection-header h3 { margin: 0; font-size: 14px; }
  .revenue-total-pill { font-size: 13px; font-weight: 700; color: var(--color-cerulean); background: var(--accent-tint); border-radius: 8px; padding: 4px 12px; }
  .revenue-row-labels { display: flex; gap: 8px; padding: 0 2px 6px; font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.02em; }
  .revenue-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .revenue-row input { background: var(--color-white); }
  .revenue-row-empty { font-size: 13px; color: var(--text-faint); padding: 8px 2px; }
  .revenue-service-label { font-size: 13px; flex: 1.4; }

  /* ---- GDV Tahap 2 — 3 skema input (CSR / CSR Retainer / Ads Sponsorship)
     bisa tampil BERSAMAAN di satu project (kalau services-nya dipilih
     lebih dari satu), jadi tiap skema punya blok+label sendiri supaya
     jelas asalnya, ditumpuk vertikal dalam satu kartu GDV yang sama. ---- */
  .gdv-scheme-block { margin-bottom: 16px; }
  .gdv-scheme-block:last-child { margin-bottom: 0; }
  .gdv-scheme-label { font-size: 12px; font-weight: 700; color: var(--color-cerulean); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; }
  .gdv-retainer-link-group { border: 1px dashed var(--border-softer); border-radius: 8px; padding: 10px 8px; margin-bottom: 10px; background: var(--color-white); }
  .gdv-retainer-link-group:last-of-type { margin-bottom: 0; }

  /* ══════════════════════════════════════════════════════════════════
     SISTEM DESAIN v2 — komponen bersama, dipakai lintas modul (Sales
     Pipeline, Document Pipeline, Cost Monitoring, dst). Lihat artefak
     "Techford — Usulan Sistem Desain" untuk perbandingan visual sebelum/
     sesudah. Ditambahkan ADDITIVE (tidak menghapus class lama) supaya
     migrasi tiap halaman bisa bertahap tanpa merusak yang belum disentuh.
     ══════════════════════════════════════════════════════════════════ */

  /* ---- Stat tile (score card terpadu, ganti .stat-card/.pipeline-score-card/
     .cm-score-card yang sebelumnya beda-beda per halaman) ---- */
  .stat-tile-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-tile {
    background: var(--color-white); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .15s ease, transform .15s ease;
  }
  .stat-tile.clickable { cursor: pointer; }
  .stat-tile.clickable:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .stat-tile .st-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); }
  .stat-tile .st-value { font-family: var(--font-mono); font-size: 19px; font-weight: 700; margin-top: 5px; letter-spacing: -0.01em; }
  .stat-tile .st-desc { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .stat-tile .st-compare { font-size: 12px; margin-top: 7px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
  .stat-tile.accent { border-color: var(--color-cerulean); background: linear-gradient(180deg, var(--accent-tint), var(--color-white) 70%); }
  .st-delta { font-weight: 700; display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; border-radius: 6px; font-size: 11px; }
  .st-delta.up { color: var(--good); background: var(--good-tint); }
  .st-delta.down { color: var(--bad); background: var(--bad-tint); }
  .st-delta.flat { color: var(--text-faint); background: var(--bg-hover); }

  /* ---- Pill status terpadu (neutral/info/warn/good/bad) — DIPAKAI UNTUK
     STATUS BARU (Cost Monitoring, dst). Badge Lead/Client lama (.badge-*)
     SENGAJA tidak diganti/dihapus, biar tidak menyentuh makna warna yang
     sudah dipakai di tempat lain (lihat catatan di 04_NavigationConfig
     & stageBadgeClass). ---- */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .pill.neutral { color: var(--text-faint); background: var(--bg-hover); }
  .pill.info { color: var(--color-cerulean); background: var(--accent-tint-strong); }
  .pill.warn { color: var(--warn); background: var(--warn-tint); }
  .pill.good { color: var(--good); background: var(--good-tint); }
  .pill.bad { color: var(--bad); background: var(--bad-tint); }

  /* ---- Tabel: hover baris, kolom rata kanan angka, teks 1-baris terpotong ---- */
  .data-table tbody tr { transition: background .1s ease; }
  .data-table tbody tr:hover { background: var(--bg-hover); }
  .data-table td.num { font-family: var(--font-mono); text-align: right; }
  .data-table th.num { text-align: right; }
  .data-table td.truncate { max-width: 0; }
  .data-table td.truncate .clip { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-row-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  /* Header tabel "nempel" saat scroll — bungkus <table> dalam
     <div class="table-scroll-sticky" style="max-height:..."> untuk pakai ini. */
  .table-scroll-sticky { overflow-y: auto; }
  .table-scroll-sticky table thead th { position: sticky; top: 0; background: var(--bg-tint); z-index: 1; }
  /* Tombol aksi baris baru terlihat penuh saat baris di-hover — tabel
     terasa lebih lega secara default. Bungkus tombol aksi dengan class
     ini di kolom Action. */
  .row-action-reveal { opacity: 0; transition: opacity .12s ease; }
  .data-table tbody tr:hover .row-action-reveal, .data-table tbody tr:focus-within .row-action-reveal { opacity: 1; }

  /* ---- Search field dengan ikon ---- */
  .search-field { position: relative; flex: 1; min-width: 180px; }
  .search-field .search-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 13px; pointer-events: none; }
  .search-field input { width: 100%; padding-left: 32px !important; }

  /* ---- Segmented control (ganti tab link bergaris-bawah) ---- */
  .segmented { display: inline-flex; padding: 3px; background: var(--bg-hover); border-radius: 9px; gap: 2px; }
  .segmented button { border: none; background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 16px; border-radius: 7px; cursor: pointer; color: var(--text-faint); transition: background .15s ease, color .15s ease; }
  .segmented button.active { background: var(--color-white); color: var(--color-mineshaft); box-shadow: var(--shadow-sm); }

  /* ---- Modal header kontekstual (ikon sesuai tingkat keseriusan) ---- */
  .modal-hd { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border-soft); }
  .modal-hd .modal-hd-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .modal-hd.tone-warn .modal-hd-ic { background: var(--warn-tint); color: var(--warn); }
  .modal-hd.tone-bad .modal-hd-ic { background: var(--bad-tint); color: var(--bad); }
  .modal-hd.tone-good .modal-hd-ic { background: var(--good-tint); color: var(--good); }
  .modal-hd.tone-info .modal-hd-ic { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .modal-hd h3, .modal-hd h4 { margin: 0 !important; }
  .modal-hd p { margin: 2px 0 0; font-size: 12px; color: var(--text-faint); }

  /* ---- Validasi form inline (pelengkap alert(), bukan pengganti semua) ---- */
  .field-error input, .field-error select, .field-error textarea { border-color: var(--bad) !important; background: var(--bad-tint) !important; }
  .field-error-msg { font-size: 11.5px; color: var(--bad); margin-top: 4px; display: flex; align-items: center; gap: 4px; }

  /* ---- Stepper wizard bernomor ---- */
  .stepper { display: flex; align-items: center; margin: 4px 0 18px; }
  .stepper .step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; position: relative; }
  .stepper .step .step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid var(--border-soft); background: var(--color-white); color: var(--text-faint); z-index: 1; }
  .stepper .step .step-lbl { font-size: 11px; color: var(--text-faint); text-align: center; }
  .stepper .step.done .step-dot { background: var(--good); border-color: var(--good); color: #fff; }
  .stepper .step.current .step-dot { background: var(--color-white); border-color: var(--color-cerulean); color: var(--color-cerulean); box-shadow: 0 0 0 4px var(--accent-tint); }
  .stepper .step.done .step-lbl, .stepper .step.current .step-lbl { color: var(--color-mineshaft); font-weight: 600; }
  .stepper .step:not(:last-child)::after { content: ""; position: absolute; top: 13px; left: 50%; width: 100%; height: 2px; background: var(--border-soft); }
  .stepper .step.done:not(:last-child)::after { background: var(--good); }

  /* ---- Avatar inisial (atribusi "dicatat oleh") ---- */
  .avatar-initial { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .attrib-row { display: flex; align-items: center; gap: 8px; }
  .attrib-row .attrib-who { font-size: 12.5px; font-weight: 600; }
  .attrib-row .attrib-when { font-size: 11px; color: var(--text-faint); }

  /* ---- Input nominal Rupiah dengan chip "Rp" ---- */
  .curr-field { position: relative; }
  .curr-field .curr-prefix { position: absolute; left: 1px; top: 1px; bottom: 1px; display: flex; align-items: center; padding: 0 10px; background: var(--bg-hover); border-radius: 5px 0 0 5px; font-size: 12.5px; font-weight: 700; color: var(--text-faint); pointer-events: none; }
  .curr-field input { width: 100%; padding-left: 50px !important; text-align: right; font-family: var(--font-mono); font-weight: 700; box-sizing: border-box; }

  /* ---- Timeline riwayat (ganti daftar baris datar) ---- */
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border-soft); }
  .timeline .tl-item { position: relative; padding-bottom: 14px; }
  .timeline .tl-item:last-child { padding-bottom: 0; }
  .timeline .tl-item::before { content: ""; position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-white); border: 2px solid var(--color-cerulean); }
  .timeline .tl-item.bad::before { border-color: var(--bad); }
  .timeline .tl-item .tl-amt { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
  .timeline .tl-item .tl-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

  /* ---- Severity stripe (garis warna kiri kartu, sinyal status sekilas) ---- */
  .stripe-card { position: relative; border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 12px 16px 12px 18px; background: var(--color-white); box-shadow: var(--shadow-sm); overflow: hidden; }
  .stripe-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--border-soft); }
  .stripe-card.ok::before { background: var(--good); }
  .stripe-card.bad::before { background: var(--bad); }
  .stripe-card.warn::before { background: var(--warn); }

  /* ---- Tombol dengan spinner (state loading async) ---- */
  .btn-loading-spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: techford-spin 0.7s linear infinite; margin-right: 7px; vertical-align: middle; }
  .btn-outline .btn-loading-spin { border: 2px solid var(--border-soft); border-top-color: var(--color-mineshaft); }

  /* ---- Tooltip info terpadu ---- */
  .info-tip-wrap { position: relative; display: inline-flex; }
  .info-tip-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--bg-hover); color: var(--text-faint); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: help; }
  .info-tip-box { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 210px; background: var(--color-mineshaft); color: var(--color-white); font-size: 11.5px; line-height: 1.5; padding: 9px 11px; border-radius: 8px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .15s ease; z-index: 50; }
  .info-tip-box::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--color-mineshaft); }
  .info-tip-wrap:hover .info-tip-box { opacity: 1; }

  /* ---- Pagination terpadu ---- */
  .pagi { display: flex; align-items: center; gap: 6px; }
  .pagi button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border-soft); background: var(--color-white); font-family: inherit; font-size: 12.5px; cursor: pointer; color: var(--text-muted); }
  .pagi button:hover:not(:disabled) { background: var(--bg-hover); }
  .pagi button.active { background: var(--color-cerulean); border-color: var(--color-cerulean); color: #fff; font-weight: 700; }
  .pagi button:disabled { opacity: 0.4; cursor: default; }
  .pagi .pagi-sep { color: var(--text-faint); font-size: 12px; padding: 0 2px; }

  /* ---- Skeleton loading shimmer (ganti pola teks "Memuat..." + spinner) ---- */
  .skel { position: relative; overflow: hidden; background: var(--bg-hover); border-radius: 6px; }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: translateX(-100%); animation: techford-shimmer 1.4s infinite;
  }
  .skel-tile { height: 74px; border-radius: var(--radius-md); }
  .skel-row { height: 14px; margin: 6px 0; border-radius: 4px; }
  @keyframes techford-shimmer { 100% { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

  /* ---- Toast notifikasi (lihat TechfordToast di Shell.html) ---- */
  .toast-host { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast-item {
    background: var(--color-mineshaft); color: var(--color-white); padding: 10px 16px; border-radius: 9px; font-size: 12.5px;
    box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px;
    opacity: 0; transform: translateY(-8px); transition: opacity .2s ease, transform .2s ease;
  }
  .toast-item.show { opacity: 1; transform: translateY(0); }
  .toast-item .toast-ok { color: #6fe0a0; font-weight: 700; }
  .toast-item .toast-bad { color: #f2a6a3; font-weight: 700; }

  /* ================================================================
     Drawer bertumpuk + pola "pensil dulu" (Sales Pipeline)
     ----------------------------------------------------------------
     Project Detail sekarang MURNI baca — semua form edit dipindah ke
     drawer terpisah yang dibuka DI ATAS drawer Detail (Detail sengaja
     tetap terlihat di belakang supaya konteks project tidak hilang).
     Karena .drawer-overlay dasar z-index 200, drawer bertumpuk ini
     perlu di atasnya tapi tetap di BAWAH .confirm-overlay (300) supaya
     dialog konfirmasi tetap muncul paling depan.
     ================================================================ */
  .drawer-overlay.drawer-stacked { z-index: 240; background: rgba(var(--color-mineshaft-rgb), 0.28); }
  .drawer-panel-mid { width: 640px; }

  /* Baris data TERSIMPAN dalam mode baca — tampil sebagai teks, bukan
     input, sampai tombol pensil di baris itu diklik. Tujuannya supaya
     drawer yang dibuka cuma untuk dilihat tidak bisa berubah karena
     salah ketik. */
  .row-view {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    background: var(--color-white); margin-bottom: 8px;
  }
  .row-view:hover { box-shadow: var(--shadow-sm); }
  .row-view .rv-main { flex: 1; min-width: 0; }
  .row-view .rv-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-view .rv-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .row-view .rv-amt { font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-align: right; flex-shrink: 0; }

  /* Baris dalam mode EDIT (setelah pensil diklik, atau baris baru yang
     memang belum pernah tersimpan) — dibedakan warnanya supaya jelas
     bagian mana yang sedang diubah. */
  .row-edit {
    display: flex; align-items: center; gap: 8px; padding: 9px;
    border: 1px solid var(--color-cerulean); border-radius: var(--radius-sm);
    background: var(--accent-tint); margin-bottom: 8px;
  }
  .row-edit input, .row-edit select { background: var(--color-white); }

  .icon-btn-sm {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-soft);
    background: var(--color-white); color: var(--text-faint); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
    font-family: inherit; padding: 0;
  }
  .icon-btn-sm:hover { border-color: var(--color-cerulean); color: var(--color-cerulean); }
  .icon-btn-sm.danger:hover { border-color: var(--bad); color: var(--bad); }

  /* Daftar vertikal dengan angka rata kanan — dipakai di Detail untuk
     Campaign Link GDV & kategori Service Revenue (menggantikan deretan
     badge horizontal yang tidak menampilkan nominal). */
  .vlist { display: flex; flex-direction: column; gap: 6px; }
  .vlist-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 11px;
    border: 1px solid var(--border-softer); border-radius: var(--radius-sm); background: var(--color-white);
  }
  .vlist-row .vl-main { flex: 1; min-width: 0; }
  .vlist-row .vl-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vlist-row .vl-name.mono { font-family: var(--font-mono); }
  .vlist-row .vl-sub { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .vlist-row .vl-right { text-align: right; flex-shrink: 0; }
  .vlist-row .vl-amt { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
  .vlist-row .vl-amt-lbl { font-size: 10px; color: var(--text-faint); margin-top: 1px; }

  /* Tab pemilih skema di drawer Input GDV — satu project bisa punya
     CSR & Ads Sponsorship sekaligus; tab menjaga drawer tetap pendek
     dibanding menumpuk semua skema vertikal. */
  .scheme-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-soft); margin-bottom: 14px; }
  .scheme-tabs button {
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 14px; background: none;
    border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-faint); cursor: pointer;
  }
  .scheme-tabs button:hover { color: var(--color-mineshaft); }
  .scheme-tabs button.active { color: var(--color-cerulean); border-bottom-color: var(--color-cerulean); }

  /* Empty state yang menjelaskan langkah berikutnya, bukan cuma teks abu-abu. */
  .empty-hint {
    text-align: center; padding: 22px 16px; border: 1px dashed var(--border-soft);
    border-radius: var(--radius-md); color: var(--text-faint); font-size: 12.5px; background: var(--bg-hover);
  }
  .empty-hint .eh-ic { font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.8; }

  /* Strip metadata project (dibuat kapan/oleh siapa, aktivitas terakhir). */
  .meta-strip {
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-faint);
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-soft);
  }
  .meta-strip b { color: var(--color-mineshaft); font-weight: 600; }

  .tag-chip {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 9px;
    border-radius: 999px; background: var(--accent-tint); color: var(--color-cerulean);
  }

  /* Field yang dikunci karena Stage sudah Won — dibedakan visualnya dari
     field aktif supaya jelas ini bukan bug/gagal render. */
  .locked-field input, .locked-field textarea, .locked-field select {
    background: var(--bg-hover) !important; color: var(--text-faint) !important; cursor: not-allowed;
  }
  .lock-tag { font-size: 10px; font-weight: 600; color: var(--text-faint); margin-left: 4px; }

  .link-ext { color: var(--color-cerulean); text-decoration: none; word-break: break-all; }
  .link-ext:hover { text-decoration: underline; }

  /* Banner penjelasan di dalam drawer (mis. alasan field dikunci) — beda
     dari .error yang dipakai untuk kegagalan fetch di atas tabel. */
  .alert-inline {
    font-size: 12.5px; line-height: 1.55; padding: 11px 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); background: var(--bg-hover); margin-bottom: 14px;
  }
  .alert-inline.warn { border-color: var(--warn); background: var(--warn-tint); }
  .alert-inline.warn strong { color: var(--warn); }

  /* ================================================================
     Sales Pipeline — perbaikan tabel, score card, search & filter
     ================================================================ */

  /* ---- Chip singkatan Service di tabel ----
     Kelima service disingkat (CSR / SS / EVNT / ADS / P&P) supaya kolomnya
     tidak melebar tanpa batas saat satu project punya banyak service. Nama
     panjang + category tetap terbaca lewat atribut title. */
  .svc-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .svc-chip {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 800; padding: 2px 7px;
    border-radius: 999px; white-space: nowrap; border: 1px solid transparent; cursor: help;
    letter-spacing: 0.02em;
  }
  .svc-chip.svc-csr { background: #e6f4ea; color: #188038; }
  .svc-chip.svc-ads { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .svc-chip.svc-other { background: var(--bg-hover); color: var(--text-muted); }
  .svc-chip.svc-more { background: none; border-color: var(--border-soft); color: var(--text-faint); }

  /* ---- Badge Stage di kolom pertama tabel ----
     Warnanya SENGAJA sama dengan bucket score card (.pipeline-bucket-*)
     supaya angka di score card dan baris di tabel bicara dengan bahasa
     visual yang sama. */
  .pl-stage {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 800; padding: 3px 8px;
    border-radius: 5px; letter-spacing: 0.03em; white-space: nowrap;
  }
  .pl-stage-pros { background: #fef7e0; color: #b8860b; }
  .pl-stage-nego { background: var(--accent-tint-strong); color: var(--color-cerulean); }
  .pl-stage-won  { background: #e6f4ea; color: #188038; }
  .pl-stage-loss { background: #fce8e6; color: #c5221f; }
  .pl-stage-draft { background: var(--bg-hover); color: var(--text-muted); }

  /* ---- Owner: avatar 20px + nama ----
     Sengaja lebih kecil dari .avatar-initial (26px) yang dipakai di drawer —
     di tabel perannya cuma penanda cepat, bukan identitas utama baris. */
  .pl-owner { display: flex; align-items: center; gap: 7px; }
  .pl-owner .pl-av {
    width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-size: 8.5px; font-weight: 800; color: #fff; flex-shrink: 0;
  }

  /* ---- Kolom Value: rata kanan, digit sejajar antar baris ---- */
  .pl-val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pl-val .pl-val-line { font-size: 12px; font-family: var(--font-mono); }
  .pl-val .pl-val-lbl { font-weight: 800; color: var(--text-faint); font-size: 9.5px; margin-right: 5px; font-family: var(--font-ui); }

  /* ---- Penanda baris per Stage ----
     Deal yang sudah mati (Loss) tidak lagi menuntut perhatian yang sama
     dengan deal yang masih hidup. */
  .data-table tbody tr.pl-row-loss td { opacity: 0.55; }
  .data-table tbody tr.pl-row-won td:first-child { box-shadow: inset 3px 0 0 #188038; }
  .data-table tbody tr.pl-row-draft td:first-child { box-shadow: inset 3px 0 0 var(--text-faint); }

  /* ---- Kaki tabel: penghitung baris ---- */
  .pl-count { font-size: 12px; color: var(--text-muted); }
  .pl-count b { color: var(--color-mineshaft); font-weight: 700; }

  /* ---- Score card: GDV & REV sebagai dua baris berlabel ----
     Menggantikan satu kalimat "GDV : Rp2.0B | REV : Rp1.0B" yang dipadatkan,
     dan menghapus kebutuhan tooltip hover untuk melihat angka sebenarnya. */
  .pl-sc-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 7px; }
  .pl-sc-k { font-size: 9.5px; font-weight: 800; color: var(--text-faint); letter-spacing: 0.05em; }
  .pl-sc-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; }
  .pl-sc-note { font-size: 11.5px; color: var(--text-faint); margin: -6px 0 16px; }
  .pl-sc-note b { color: var(--text-muted); }

  /* ---- Bucket score card yang bisa diklik untuk memfilter Stage ---- */
  button.pipeline-bucket-item {
    font-family: inherit; border: 1px solid transparent; background: none; cursor: pointer;
    color: inherit; padding: 6px 4px; border-radius: 8px;
  }
  button.pipeline-bucket-item:hover { background: var(--bg-hover); }
  button.pipeline-bucket-item.bucket-active { border-color: currentColor; background: var(--bg-hover); }
  .pipeline-bucket-pct { font-weight: 800; color: var(--text-muted); }
  .pipeline-bucket-sub { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 5px; white-space: nowrap; }

  /* ---- Search box: tombol kosongkan ---- */
  .search-field .search-clear {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
    border-radius: 50%; border: none; background: var(--bg-hover); color: var(--text-muted); cursor: pointer;
    font-size: 13px; line-height: 1; display: none; align-items: center; justify-content: center; padding: 0;
    font-family: inherit;
  }
  .search-field .search-clear:hover { background: var(--bad-tint); color: var(--bad); }
  .search-field.has-text .search-clear { display: flex; }
  .search-field.has-text input { padding-right: 32px !important; }

  /* ---- Chip filter aktif yang bisa dilepas satu-satu ---- */
  .filter-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: -6px 0 14px; }
  .filter-chips-label { font-size: 10.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
    background: var(--accent-tint); color: var(--color-cerulean); padding: 4px 5px 4px 10px; border-radius: 999px;
  }
  .filter-chip button {
    border: none; background: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1;
    padding: 0 3px; opacity: 0.65; font-family: inherit;
  }
  .filter-chip button:hover { opacity: 1; }

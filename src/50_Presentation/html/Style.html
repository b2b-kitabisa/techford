<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #202124;
    background: #f4f5f7;
  }

  /* ---- Generic simple content (fallback pages) ---- */
  .container { max-width: 720px; margin: 0 auto; padding: 24px; }
  .error { color: #c5221f; }

  /* ---- App Shell layout ---- */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #ffffff;
    border-right: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid #e0e0e0; }
  .brand-title { font-size: 22px; font-weight: bold; }
  .brand-subtitle { font-size: 12px; color: #5f6368; }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .nav-group-label {
    font-size: 11px; font-weight: bold; text-transform: uppercase;
    color: #5f6368; padding: 12px 16px 4px;
  }
  .nav-item {
    display: block;
    padding: 8px 16px;
    font-size: 14px;
    color: #202124;
    text-decoration: none;
    cursor: pointer;
  }
  .nav-item:hover { background: #f1f3f4; }
  .nav-item-active { background: #202124; color: #fff; font-weight: bold; }
  .nav-item-disabled { color: #bdbdbd; cursor: not-allowed; }
  .nav-item-disabled:hover { background: transparent; }

  .sidebar-footer { border-top: 1px solid #e0e0e0; padding: 8px 0; }

  /* ---- Topbar ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e0e0e0;
  }
  .page-title { margin: 0; font-size: 26px; }
  .btn-sync {
    background: #eef7ff; color: #1a73e8; border: 1px solid #1a73e8;
    padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
  }
  .btn-sync:hover { background: #d8ecff; }
  .btn-sync:disabled { opacity: 0.6; cursor: default; }

  .content-area { padding: 24px; }

  /* ---- Stat cards ---- */
  .stat-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: #fff; border-radius: 8px; padding: 14px 16px;
    border: 1px solid #e0e0e0;
  }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .stat-label { font-weight: bold; font-size: 14px; }
  .stat-desc { font-size: 11px; color: #5f6368; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: bold; }
  .stat-new .stat-label, .stat-new .stat-value { color: #6a1b9a; }
  .stat-contacted .stat-label, .stat-contacted .stat-value { color: #188038; }
  .stat-moved .stat-label, .stat-moved .stat-value { color: #1a73e8; }
  .stat-other .stat-label, .stat-other .stat-value { color: #b8860b; }
  .stat-spam .stat-label, .stat-spam .stat-value { color: #c5221f; }
  .stat-card.active { border-color: #202124; }

  /* ---- Filter bar ---- */
  .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; }
  .filter-bar input, .filter-bar select {
    padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px;
  }
  .filter-bar input { flex: 1; }
  .filter-reset { background: none; border: none; color: #5f6368; cursor: pointer; }

  /* ---- Data table ---- */
  .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; font-size: 12.5px; }
  .data-table thead th {
    background: #3c4043; color: #fff; text-align: left; padding: 10px 14px; font-weight: normal; font-size: 12px;
  }
  .data-table tbody td { padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: top; }
  .entity-name { font-weight: bold; }
  .entity-pic { font-size: 11px; color: #5f6368; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
  .badge-new { background: #f3e8fd; color: #6a1b9a; }
  .badge-contacted { background: #e6f4ea; color: #188038; }
  .badge-moved { background: #e8f0fe; color: #1a73e8; }
  .badge-other { background: #fef7e0; color: #b8860b; }
  .badge-spam { background: #fce8e6; color: #c5221f; }
  .btn-detail {
    background: #eee; border: 1px solid #ccc; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font-size: 12px;
  }
  .btn-detail:hover { background: #ddd; }
  .empty-row td { text-align: center; color: #5f6368; padding: 32px; }

  /* ---- Pagination ---- */
  .pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; font-size: 14px;
  }
  .page-buttons { display: flex; gap: 4px; }
  .page-buttons button {
    border: 1px solid #dadce0; background: #fff; padding: 6px 12px;
    border-radius: 4px; cursor: pointer;
  }
  .page-buttons button.active { background: #202124; color: #fff; border-color: #202124; }
  .page-buttons button:disabled { opacity: 0.5; cursor: default; }

  /* ---- Modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 8px; width: 480px; max-width: 90vw; padding: 24px; }
  .modal-box h2 { margin-top: 0; }
  .modal-close { float: right; cursor: pointer; font-size: 20px; background: none; border: none; }
  .detail-grid { display: grid; grid-template-columns: 140px 1fr; row-gap: 10px; font-size: 14px; }
  .detail-grid dt { color: #5f6368; }
  .detail-grid dd { margin: 0; }
</style>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('html/Style'); ?>
</head>
<body>
  <div class="container">
    <h1>Employee</h1>

    <div id="error" class="error"></div>
    <table id="employeeTable">
      <thead><tr><th>ID</th><th>Nama</th><th>Email</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>

    <h3>Tambah Employee</h3>
    <input id="name" placeholder="Nama">
    <input id="email" placeholder="Email">
    <button onclick="onboard()">Simpan</button>
  </div>

  <script>
    function loadEmployees() {
      google.script.run.withSuccessHandler(function (res) {
        if (!res.ok) return showError(res.error.message);
        var tbody = document.querySelector('#employeeTable tbody');
        tbody.innerHTML = '';
        res.data.forEach(function (emp) {
          tbody.innerHTML += '<tr><td>' + emp.Id + '</td><td>' + emp.Name +
            '</td><td>' + emp.Email + '</td><td>' + emp.Status + '</td></tr>';
        });
      }).employee_listActive();
    }

    function onboard() {
      var input = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value
      };
      google.script.run.withSuccessHandler(function (res) {
        if (!res.ok) return showError(res.error.message);
        loadEmployees();
      }).employee_onboard(input);
    }

    function showError(msg) {
      document.getElementById('error').innerText = msg;
    }

    loadEmployees();
  </script>
</body>
</html>
